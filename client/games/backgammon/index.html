<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎲 双陆棋</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🎲 双陆棋</h1><div class="score">玩家 <b id="sc">0</b> · 电脑 <b id="bs">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=480*dpr;cv.height=360*dpr;cv.style.width=Math.min(480,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let board,turn,sel,score,bscore,alive,raf;
function rset(){board=Array(24).fill(0);board[0]=2;board[11]=5;board[16]=3;board[18]=5;board[23]=2;turn=1;sel=-1;score=0;bscore=0;alive=true;document.getElementById('sc').textContent=0;document.getElementById('bs').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){ctx.fillStyle='#1a0d0d';ctx.fillRect(0,0,480,360);for(let i=0;i<24;i++){const x=20+(i%12)*38;const y=i<12?60:280;ctx.fillStyle=(i%2===0)?'#2a1414':'#1a0d0d';ctx.fillRect(x,y,34,140);ctx.strokeStyle='#b02a2a';ctx.strokeRect(x,y,34,140);ctx.fillStyle='#d9a08f';ctx.font='11px sans-serif';ctx.fillText((board[i]||0)+'',x+10,y+70)}ctx.fillStyle='#ffd9c8';ctx.font='13px sans-serif';ctx.fillText('回合:'+turn+' 选:'+sel,10,20);raf=requestAnimationFrame(loop)}
function move(from,d){const target=turn===1?(from+d)%24:23-((23-from+d)%24);board[from]--;board[target]+=turn;if(turn===1)score++;}
function ai(){let moved=false;for(let i=23;i>=0&&!moved;i--)if(board[i]<0){for(let d=1;d<=6&&!moved;d++){const target=23-((23-i+d)%24);if(target>=0&&target<24){move(i,d);moved=true;break}}}turn=1}
function pick(i){if(turn!==1||!alive)return;if(sel<0){if(board[i]>0)sel=i}else{const d=Math.abs(i-sel);if(d<=6&&d>=1){move(sel,d);sel=-1;turn=2;setTimeout(ai,400)}else if(board[i]>0)sel=i}}
function restart(){rset()}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(480/r.width);const y=(e.clientY-r.top)*(360/r.height);const col=Math.floor((x-20)/38);const row=y<200?0:1;const idx=row*12+col;if(idx>=0&&idx<24)pick(idx)});
rset();
</script></body></html>
