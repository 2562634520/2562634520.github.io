<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>酷跑达人</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;touch-action:none;user-select:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.hud{font-size:13px;color:#d9a08f;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
canvas{background:#120d10;border:1px solid #33262a;border-radius:12px;touch-action:none;display:block;max-width:96vw;max-height:68vh}
.btn{display:inline-block;padding:9px 22px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin:4px}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:24px 30px;box-shadow:0 0 40px #b02a2a2e;max-width:86vw}
.panel b{font-size:24px;color:#ffd9c8;display:block;margin-bottom:8px}
.panel p{font-size:13px;color:#c9a89b;margin-bottom:12px}
.tip{font-size:11px;color:#8f7f7b;text-align:center}
</style></head><body>
<div class="wrap"><h1>🏃 酷跑达人</h1><div class="hud">距离 <b id="sc">0</b>m · 最佳 <span id="best">0</span>m</div><canvas id="cv"></canvas><div class="tip">空格 / 点击跳跃，可二段跳 · 别撞障碍</div></div>
<div class="over"><div class="panel"><b id="msg"></b><p id="sub"></p><button class="btn" id="again">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');cv.width=360;cv.height=480;
let x=50,y=330,vy=0,g=0.55,jumps=0,run=false,dist=0,best=+(localStorage.getItem('parkourBest')||0),obs=[],spd=4.2,frame=0;
document.getElementById('best').textContent=best;
function start(){x=50;y=330;vy=0;jumps=0;dist=0;obs=[];spd=4.2;run=true;document.querySelector('.over').classList.remove('show')}
function tick(){if(!run)return;dist+=spd/10;document.getElementById('sc').textContent=Math.floor(dist);
if(frame%60===0&&Math.random()<0.7){const type=Math.random()<0.5?0:1;obs.push({x:cv.width+20,y:type?322:342,w:type?26:38,h:type?54:34})}
obs.forEach(o=>o.x-=spd);obs=obs.filter(o=>o.x>-50);
vy+=g;y+=vy;if(y>330){y=330;vy=0;jumps=0}
obs.forEach(o=>{if(x+20>o.x&&x<o.x+o.w&&y+38>o.y&&y<o.y+o.h){over('撞上障碍','跑了 '+Math.floor(dist)+'m')}});
frame++;draw()}
function draw(){ctx.fillStyle='#120d10';ctx.fillRect(0,0,cv.width,cv.height);
ctx.fillStyle='#2a1b1e';ctx.fillRect(0,368,cv.width,4);
obs.forEach(o=>{ctx.fillStyle='#d64545';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle='#ffd9c8';ctx.fillRect(o.x+4,o.y+4,o.w-8,8)});
ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.arc(x+10,y+10,9,0,7);ctx.fill();
ctx.fillStyle='#7de08a';ctx.fillRect(x,y+18,20,20);
ctx.fillStyle='#d64545';ctx.fillRect(x-4,y+20,6,14);ctx.fillRect(x+18,y+20,6,14)}
function jump(){if(!run){start();return}if(jumps<2){vy=-10.5;jumps++}}
function over(m,s){run=false;if(dist>best){best=Math.floor(dist);localStorage.setItem('parkourBest',best);document.getElementById('best').textContent=best}
document.getElementById('msg').textContent=m;document.getElementById('sub').textContent=s+' · 最佳 '+best+'m';document.querySelector('.over').classList.add('show')}
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();jump()}});
cv.addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});
document.getElementById('again').onclick=start;start();setInterval(tick,33);
</script></body></html>
