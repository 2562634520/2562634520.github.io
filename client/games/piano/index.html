<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎹 钢琴演奏</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🎹 钢琴演奏</h1><div class="score">得分 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=480*dpr;cv.height=360*dpr;cv.style.width=Math.min(480,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let target,score,alive,raf,x;
function rset(){target={notes:[1,2,3,1,2,3,4,5],idx:0};score=0;x=0;alive=true;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function play(n){try{const ctx2=new(window.AudioContext||window.webkitAudioContext)();const o=ctx2.createOscillator();const g=ctx2.createGain();o.connect(g);g.connect(ctx2.destination);o.frequency.value=200+n*80;g.gain.value=.3;o.start();o.stop(ctx2.currentTime+.2)}catch(e){}if(n===target.notes[target.idx]){target.idx++;score+=10;if(target.idx>=target.notes.length){{document.getElementById('msg').textContent='得分 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('pianoBest',Math.max(parseInt(localStorage.getItem('pianoBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}document.getElementById('sc').textContent=score}}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,480,360);for(let i=0;i<8;i++){ctx.fillStyle=i===target.notes[target.idx]?'#b02a2a':'#3a2c2f';ctx.fillRect(40+i*50,200,46,140);ctx.strokeStyle='#d9a08f';ctx.strokeRect(40+i*50,200,46,140);ctx.fillStyle='#ffd9c8';ctx.font='20px sans-serif';ctx.fillText(String.fromCharCode(65+i),55+i*50,330)}ctx.fillStyle='#d9a08f';ctx.font='14px sans-serif';ctx.fillText('提示键: '+String.fromCharCode(64+target.notes[target.idx]),40,50);raf=requestAnimationFrame(loop)}
function restart(){rset()}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(480/r.width);const idx=Math.floor((x-40)/50);if(idx>=0&&idx<8)play(idx+1)});
document.addEventListener('keydown',e=>{const k=e.key.toUpperCase();if(k>='A'&&k<='H')play(k.charCodeAt(0)-64)});
rset();
</script></body></html>
