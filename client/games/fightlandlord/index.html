<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🃏 斗地主</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}
.seat{font-size:12px;color:#d9a08f;min-height:18px}
.cards{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:560px}
.pc{width:38px;height:56px;background:linear-gradient(145deg,#f8efe6,#e3d3c5);border:1px solid #b9a18f;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#3a241b;cursor:pointer;user-select:none;box-shadow:0 3px 8px #0008}
.pc.red{color:#b02a2a}
.pc.sel{transform:translateY(-9px);border-color:#d64545;box-shadow:0 0 12px #d6454588}
.last{min-height:32px;margin:4px auto;display:flex;gap:4px;justify-content:center;align-items:center;font-size:12px;color:#d9a08f}
.row{display:flex;gap:8px;justify-content:center}
</style></head><body>
<div class="wrap"><h1>🃏 斗地主</h1><div class="seat" id="leftN"></div>
<div class="seat" id="rightN"></div>
<div class="last" id="last"></div>
<div class="cards" id="bottomCards" style="min-height:56px"></div>
<div class="cards" id="area"></div>
<div class="info" id="info"></div>
<div class="row"><button class="btn small" id="btnCall">叫地主</button><button class="btn small" id="btnNoCall">不叫</button><button class="btn small" id="btnPlay" style="display:none">出牌</button><button class="btn small" id="btnPass" style="display:none">不出</button></div>
<div class="hint">点击选牌，再点「出牌」；支持单张/对子/三带/顺子/连对/炸弹/王炸</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const RANK={'3':3,'4':4,'5':5,'6':6,'7':7,'8':8,'9':9,'10':10,'J':11,'Q':12,'K':13,'A':14,'2':15,'小王':16,'大王':17};
const SUITS=['♠','♥','♦','♣'];
let deck=[],hands=[[],[],[]],bottom=[],landlord=-1,seat=0,current=null,passCnt=0,sel=new Set(),bidding=true,over=false;
const area=document.getElementById('area'),lastArea=document.getElementById('last'),info=document.getElementById('info'),btnPlay=document.getElementById('btnPlay'),btnPass=document.getElementById('btnPass');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function newDeck(){deck=[];for(const s of SUITS)for(const v of Object.keys(RANK).slice(0,13))deck.push({v,s});deck.push({v:'小王',s:''},{v:'大王',s:''});shuffle(deck)}
function sortH(h){h.sort((a,b)=>RANK[b.v]-RANK[a.v]||a.s.localeCompare(b.s))}
function renderHand(){area.innerHTML='';const h=hands[0];for(let i=0;i<h.length;i++){const c=h[i];const d=document.createElement('div');d.className='pc'+(c.s==='♥'||c.s==='♦'?' red':'')+(sel.has(i)?' sel':'');d.textContent=c.s?c.v+' '+c.s:c.v;d.onclick=()=>{if(bidding||over)return;if(sel.has(i))sel.delete(i);else sel.add(i);renderHand()};area.appendChild(d)}}
function renderSeats(){document.getElementById('leftN').textContent='左家 '+hands[1].length+' 张'+(landlord===1?' 👑':'');document.getElementById('rightN').textContent='右家 '+hands[2].length+' 张'+(landlord===2?' 👑':'');info.textContent=(over?'':bidding?'你叫地主吗？':(seat===0?'轮到你出牌':'等待出牌…'))+'　'+(landlord===0?'你是地主':'你是农民')}
function renderLast(){lastArea.innerHTML='';if(!current)return;if(current.pass){lastArea.textContent='不出';return}for(const c of current.cards){const d=document.createElement('div');d.className='pc'+(c.s==='♥'||c.s==='♦'?' red':'');d.textContent=c.s?c.v+c.s:c.v;d.style.cursor='default';lastArea.appendChild(d)}}
function init(){newDeck();hands=[[],[],[]];for(let i=0;i<51;i++)hands[i%3].push(deck.pop());bottom=deck.slice();for(const h of hands)sortH(h);bidding=true;over=false;sel.clear();current=null;passCnt=0;landlord=-1;seat=0;document.querySelector('.over').classList.remove('show');document.getElementById('bottomCards').innerHTML='';
document.getElementById('btnCall').style.display='inline-block';document.getElementById('btnNoCall').style.display='inline-block';btnPlay.style.display='none';btnPass.style.display='none';renderHand();renderSeats();renderLast()}
function showBottom(){const d=document.getElementById('bottomCards');d.innerHTML='';for(const c of bottom){const x=document.createElement('div');x.className='pc';x.textContent=c.s?c.v+c.s:c.v;x.style.cursor='default';d.appendChild(x)}}
function callLandlord(){landlord=0;hands[0].push(...bottom);sortH(hands[0]);bidding=false;seat=0;document.getElementById('btnCall').style.display='none';document.getElementById('btnNoCall').style.display='none';showBottom();renderHand();renderSeats();renderLast()}
function noCall(){document.getElementById('btnCall').style.display='none';document.getElementById('btnNoCall').style.display='none';landlord=Math.random()<0.5?1:2;hands[landlord].push(...bottom);sortH(hands[landlord]);bidding=false;seat=landlord;showBottom();renderHand();renderSeats();renderLast();if(seat!==0)setTimeout(aiTurn,700)}
document.getElementById('btnCall').onclick=callLandlord;document.getElementById('btnNoCall').onclick=noCall;
function classify(cards){if(cards.length===2&&cards[0].v==='小王'&&cards[1].v==='大王')return{t:'rocket',r:17};
const g={};for(const c of cards)g[c.v]=(g[c.v]||0)+1;const ks=Object.keys(g).sort((a,b)=>RANK[a]-RANK[b]);
if(cards.length===4&&ks.length===1)return{t:'bomb',r:RANK[ks[0]]};
if(ks.length===1&&cards.length===1)return{t:'single',r:RANK[ks[0]]};
if(ks.length===1&&cards.length===2)return{t:'pair',r:RANK[ks[0]]};
if(ks.length===1&&cards.length===3)return{t:'triple',r:RANK[ks[0]]};
if(ks.length===2&&cards.length===4)return{t:'t3_1',r:RANK[g[ks[0]]===3?ks[0]:ks[1]]};
if(ks.length===2&&cards.length===5&&((g[ks[0]]===3&&g[ks[1]]===2)||(g[ks[0]]===2&&g[ks[1]]===3)))return{t:'t3_2',r:RANK[g[ks[0]]===3?ks[0]:ks[1]]};
if(ks.length>=5&&cards.length===ks.length){let ok=true;for(let i=1;i<ks.length;i++)if(RANK[ks[i]]!==RANK[ks[i-1]]+1)ok=false;if(ok&&RANK[ks[0]]<=12)return{t:'straight',r:RANK[ks[0]],len:ks.length}}
if(ks.length>=3&&cards.length===ks.length*2&&g[ks[0]]===2){let ok=true;for(let i=1;i<ks.length;i++)if(RANK[ks[i]]!==RANK[ks[i-1]]+1)ok=false;if(ok&&RANK[ks[0]]<=12)return{t:'pstraight',r:RANK[ks[0]],len:ks.length}}
return null}
function beats(a,b){if(!b)return true;if(a.t==='rocket')return true;if(b.t==='rocket')return false;if(a.t==='bomb'&&b.t!=='bomb')return true;if(a.t!==b.t)return false;if(a.len!==b.len)return false;return a.r>b.r}
function play(){if(over||seat!==0||bidding)return;const cards=[...sel].sort((a,b)=>RANK[hands[0][b].v]-RANK[hands[0][a].v]).map(i=>hands[0][i]);if(!cards.length)return;const cl=classify(cards);if(!cl){info.textContent='不合法的牌型';return}
const canLead=!current||current.pass;if(!canLead&&!beats(cl,current)){info.textContent='管不上，比上家小';return}
hands[0]=hands[0].filter((_,i)=>!sel.has(i));sel.clear();current=cl;current.cards=cards;current.seat=0;passCnt=0;renderHand();renderLast();checkWin();if(over)return;seat=1;renderSeats();setTimeout(aiTurn,700)}
function combosOfType(h,type){const out=[];const g={};for(const c of h){if(!g[c.v])g[c.v]=[];g[c.v].push(c)}const vs=Object.keys(g).sort((a,b)=>RANK[a]-RANK[b]);
if(type==='single')for(const v of vs)out.push({cards:g[v].slice(0,1),r:RANK[v]});
if(type==='pair')for(const v of vs)if(g[v].length>=2)out.push({cards:g[v].slice(0,2),r:RANK[v]});
if(type==='triple')for(const v of vs)if(g[v].length>=3)out.push({cards:g[v].slice(0,3),r:RANK[v]});
if(type==='t3_1')for(const v of vs)if(g[v].length>=3){const k=vs.find(x=>x!==v);if(k)out.push({cards:[...g[v].slice(0,3),g[k][0]],r:RANK[v]})}
if(type==='t3_2')for(const v of vs)if(g[v].length>=3){const k=vs.find(x=>x!==v&&g[x].length>=2);if(k)out.push({cards:[...g[v].slice(0,3),...g[k].slice(0,2)],r:RANK[v]})}
if(type==='straight')for(let i=0;i<=vs.length-5;i++){const seg=vs.slice(i,i+5);if(RANK[seg[4]]===RANK[seg[0]]+4&&RANK[seg[0]]<=12){const cards=[];seg.forEach(v=>cards.push(g[v][0]));out.push({cards,r:RANK[seg[0]],len:5})}}
if(type==='pstraight')for(let i=0;i<=vs.length-3;i++){const seg=vs.slice(i,i+3);if(RANK[seg[2]]===RANK[seg[0]]+2&&RANK[seg[0]]<=12){const cards=[];seg.forEach(v=>cards.push(g[v][0],g[v][1]));out.push({cards,r:RANK[seg[0]],len:3})}}
return out}
function aiTurn(){if(over)return;const h=hands[seat];
if(!current||current.pass||current.seat===seat){const types=['single','pair','triple','t3_1','t3_2','pstraight','straight','bomb','rocket'];let pick=null;for(const t of types){const cs=combosOfType(h,t);if(cs.length){pick=cs[0];break}}
if(!pick){const g={};for(const c of h)g[c.v]=(g[c.v]||0)+1;const bv=Object.keys(g).find(v=>g[v]===4);if(bv)pick={cards:h.filter(c=>c.v===bv).slice(0,4)}}
if(!pick&&h.filter(c=>c.v==='小王'||c.v==='大王').length===2)pick={cards:h.filter(c=>c.v==='小王'||c.v==='大王')};
if(pick){pick.t=classify(pick.cards).t;pick.seat=seat;hands[seat]=hands[seat].filter(c=>!pick.cards.includes(c));current=pick;passCnt=0}}
else{const t=current.t;let pick=null;const cs=combosOfType(h,t);for(const c of cs){if(c.r>current.r){pick=c;break}}
if(!pick){const g={};for(const c of h)g[c.v]=(g[c.v]||0)+1;const bv=Object.keys(g).find(v=>g[v]===4);if(bv)pick={cards:h.filter(c=>c.v===bv).slice(0,4)}}
if(!pick&&h.filter(c=>c.v==='小王'||c.v==='大王').length===2)pick={cards:h.filter(c=>c.v==='小王'||c.v==='大王')};
if(pick){pick.t=classify(pick.cards).t;pick.seat=seat;hands[seat]=hands[seat].filter(c=>!pick.cards.includes(c));current=pick;passCnt=0}
else{current={pass:true,seat:seat};passCnt++}}
renderLast();renderSeats();checkWin();if(over)return;
if(passCnt>=2){current=null;passCnt=0}
seat=(seat+1)%3;renderSeats();if(seat===0){btnPlay.style.display='inline-block';btnPass.style.display='inline-block';renderHand()}else setTimeout(aiTurn,700)}
function checkWin(){for(let i=0;i<3;i++)if(!hands[i].length){over=true;const names=['你','左家','右家'];msg.textContent=names[i]+'（'+(landlord===i?'地主':'农民')+'）获胜！';document.querySelector('.over').classList.add('show');btnPlay.style.display='none';btnPass.style.display='none';return}}
btnPlay.onclick=play;btnPass.onclick=()=>{if(over||seat!==0||bidding||!current||current.pass)return;current={pass:true,seat:0};passCnt++;sel.clear();renderHand();renderLast();if(passCnt>=2){current=null;passCnt=0}seat=1;renderSeats();setTimeout(aiTurn,700)};
function restart(){init()}
init();

</script></body></html>
