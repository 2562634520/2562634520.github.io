<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎡 转盘</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🎡 转盘</h1><div class="score">分数 <b id="sc">0</b> · 最佳 <b id="bs">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=420*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let angle,vAng,score,best,alive,raf,spinning;
const segs=[100,500,200,0,1000,50,300,0];
const colors=['#d64545','#5a8faf','#7aaa55','#d9a08f','#b02a2a','#4a6a8f','#6a9a45','#c97070'];
function rset(){angle=0;vAng=0;score=0;best=parseInt(localStorage.spinwheelBest||0);document.getElementById('bs').textContent=best;spinning=false;alive=true;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,420);ctx.save();ctx.translate(180,220);ctx.rotate(angle);segs.forEach((v,i)=>{ctx.fillStyle=colors[i];ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,110,i*Math.PI/4,(i+1)*Math.PI/4);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.save();ctx.rotate(i*Math.PI/4+Math.PI/8);ctx.fillText(v,40,-5);ctx.restore()});ctx.restore();ctx.fillStyle='#ffd9c8';ctx.beginPath();ctx.moveTo(180,100);ctx.lineTo(170,120);ctx.lineTo(190,120);ctx.closePath();ctx.fill();
if(spinning){angle+=vAng;vAng*=.985;if(vAng<.01){spinning=false;const i=Math.floor((Math.PI*2-(angle%(Math.PI*2)))/(Math.PI/4))%8;score+=segs[i];localStorage.setItem('spinwheelBest',Math.max(parseInt(localStorage.getItem('spinwheelBest')||0),score));document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);document.getElementById('sc').textContent=score}}
raf=requestAnimationFrame(loop)}
function spin(){if(spinning)return;vAng=.5+Math.random()*.3;spinning=true}
function restart(){rset()}
cv.addEventListener('pointerdown',spin);
rset();
</script></body></html>
