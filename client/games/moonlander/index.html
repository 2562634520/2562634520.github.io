<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🌙 月球着陆</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🌙 月球着陆</h1><div class="score">燃料 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=360*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let lander,vx,vy,fuel,score,alive,raf,tick;
function rset(){lander={x:180,y:50};vx=0;vy=0;fuel=200;score=0;tick=0;alive=true;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){if(!alive)return;tick++;lander.x+=vx;lander.y+=vy;vy+=.05;if(lander.x<10||lander.x>350)vx*=-1;
if(lander.y>310){if(Math.abs(vy)<2&&Math.abs(vx)<3){score=Math.floor(fuel*10);{document.getElementById('msg').textContent='燃料 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('moonlanderBest',Math.max(parseInt(localStorage.getItem('moonlanderBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}else{{document.getElementById('msg').textContent='坠毁 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('moonlanderBest',Math.max(parseInt(localStorage.getItem('moonlanderBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}}
if(fuel<=0){{document.getElementById('msg').textContent='燃料 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('moonlanderBest',Math.max(parseInt(localStorage.getItem('moonlanderBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}
document.getElementById('sc').textContent=fuel;
ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,360);ctx.fillStyle='#3a2c2f';ctx.fillRect(0,310,360,50);ctx.fillStyle='#b02a2a';ctx.fillRect(lander.x-10,lander.y-15,20,15);ctx.fillStyle='#ffd9c8';ctx.fillRect(lander.x-3,lander.y-10,6,5);ctx.fillStyle='#d9a08f';ctx.fillRect(50,50,260,15);ctx.fillStyle='hsl(20,70%,50%)';ctx.fillRect(50,50,fuel*260/200,15);raf=requestAnimationFrame(loop)}
function restart(){rset()}
cv.addEventListener('pointerdown',e=>{if(alive&&fuel>0){fuel--;vy-=0.2;const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(360/r.width);lander.x=x}});
rset();
</script></body></html>
