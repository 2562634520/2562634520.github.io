<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>颜色辨识</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}
.word{font-size:min(16vw,64px);font-weight:900;letter-spacing:.08em;user-select:none;min-height:80px;display:grid;place-items:center}
.ask{font-size:14px;color:#d9a08f}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(90vw,380px)}
.btn{border:0;border-radius:14px;height:58px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;text-shadow:0 1px 3px #0008;transition:.15s}
.btn:active{transform:scale(.95)}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn2{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
</style></head><body>
<div class="wrap"><h1>🌈 颜色辨识</h1><div class="score">得分 <b id="sc">0</b> · 剩余 <span id="tm">30</span> 秒</div>
<div class="ask" id="ask"></div><div class="word" id="word"></div>
<div class="btns" id="btns"></div><div class="hint">题目：按“文字含义”或“文字颜色”选择</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn2" onclick="restart()">再来一局</button></div></div>
<script>
const COLORS={红:'#e04a3a',绿:'#2e8b57',蓝:'#3a6fd8',黄:'#d9a52b',紫:'#8e44ad',橙:'#e07b39'};
const names=Object.keys(COLORS);let score=0,time=30,timer,mode,word,wordColor;
function restart(){score=0;time=30;document.getElementById('sc').textContent=0;document.getElementById('tm').textContent=30;document.querySelector('.over').classList.remove('show');next();clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('tm').textContent=time;if(time<=0){clearInterval(timer);document.getElementById('msg').textContent='最终得分 '+score;document.querySelector('.over').classList.add('show')}},1000)}
function next(){mode=Math.random()<.5?'mean':'color';document.getElementById('ask').textContent=mode==='mean'?'请选择【文字含义】对应的颜色':'请选择【文字颜色】对应的颜色';
word=names[Math.random()*names.length|0];wordColor=names[Math.random()*names.length|0];
const el=document.getElementById('word');el.textContent=word;el.style.color=COLORS[wordColor];
const opts=[wordColor];while(opts.length<4){const c=names[Math.random()*names.length|0];if(!opts.includes(c))opts.push(c)}
for(let i=opts.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[opts[i],opts[j]]=[opts[j],opts[i]]}
const box=document.getElementById('btns');box.innerHTML='';
opts.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='btn';b.style.background=COLORS[c];b.textContent=c;b.onclick=()=>pick(c);box.appendChild(b)})}
function pick(c){const ok=mode==='mean'?c===word:c===wordColor;
if(ok){score+=10;document.getElementById('sc').textContent=score;next()}else{time=Math.max(0,time-2);document.getElementById('tm').textContent=time;next()}}
restart();
</script></body></html>
