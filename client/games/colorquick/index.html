<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎨 快速颜色</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🎨 快速颜色</h1><div class="score">得分 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=420*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let target,grid,score,alive,raf,timer;
const colors=['#d64545','#5a8faf','#7aaa55','#d9a08f'];
function rset(){target=Math.floor(Math.random()*4);grid=Array(16).fill(0).map(()=>Math.floor(Math.random()*4));grid[Math.floor(Math.random()*16)]=target;score=0;timer=0;alive=true;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,420);for(let i=0;i<16;i++){const r=Math.floor(i/4),c=i%4;ctx.fillStyle=colors[grid[i]];ctx.fillRect(50+c*70,100+r*70,60,60)}
ctx.fillStyle='#ffd9c8';ctx.font='13px sans-serif';ctx.fillText('找出所有 '+['红','蓝','绿','橙'][target]+' 色块',80,80);
timer++;if(timer>1800){alive=false;{document.getElementById('msg').textContent='得分 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('colorquickBest',Math.max(parseInt(localStorage.getItem('colorquickBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}
document.getElementById('sc').textContent=score;raf=requestAnimationFrame(loop)}
function tap(e){const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(360/r.width);const y=(e.clientY-r.top)*(420/r.height);const c=Math.floor((x-50)/70),rr=Math.floor((y-100)/70);if(c<0||c>3||rr<0||rr>3)return;const i=rr*4+c;if(grid[i]===target){score+=10;grid[i]=-1;timer=Math.max(0,timer-30);if(grid.every(v=>v!==target))rset()}}
function restart(){rset()}
cv.addEventListener('pointerdown',tap);
rset();
</script></body></html>
