<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🏰 投石车</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>🏰 投石车</h1><canvas id="cv"></canvas>
<div class="hint">在画布上向后拖动（蓄力）再松手发射 · 剩余石块 <b id="ammo">8</b> · 先砸穿城墙再摧毁城堡</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function size(){W=Math.min(innerWidth-24,460);H=Math.floor(W*.62);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
let stones=[],wall=[],blocks=[],over=false,drag=false,power=0,angle=50,ammo=8;
function init(){stones=[];wall=[];blocks=[];for(let i=0;i<3;i++)wall.push({x:W*.45+i*10,y:H-30-(i+1)*16,w:10,h:16,hp:1});
for(let i=0;i<3;i++)for(let j=0;j<3;j++)blocks.push({x:W*.62+j*24,y:40+i*20,w:22,h:18,hp:1});
ammo=8;over=false;power=0;document.getElementById('ammo').textContent=ammo;draw()}
function launch(){if(over||power<8||ammo<=0)return;ammo--;document.getElementById('ammo').textContent=ammo;const a=angle*Math.PI/180,s=power*.18;stones.push({x:66,y:H-40,vx:Math.cos(a)*s,vy:-Math.sin(a)*s,r:7});requestAnimationFrame(step)}
function step(){if(!stones.length){if(ammo<=0&&blocks.some(b=>b.hp>0)){over=true;msg.textContent='石块用完了';document.querySelector('.over').classList.add('show')}if(blocks.every(b=>b.hp<=0)){over=true;msg.textContent='城墙攻破，你赢了！';document.querySelector('.over').classList.add('show')}draw();return}
for(const s of stones){s.x+=s.vx;s.y+=s.vy;s.vy+=.16;if(s.y>H-34){s.y=H-34;s.vy*=-.45;s.vx*=.7}if(s.x>W||s.x<0){s.dead=true}
for(const k of wall){if(k.hp>0&&s.x>k.x-5&&s.x<k.x+15&&s.y>k.y&&s.y<k.y+k.h){k.hp--;s.dead=true;s.vy=-Math.abs(s.vy)*.6;break}}
for(const k of blocks){if(k.hp>0&&s.x>k.x&&s.x<k.x+k.w&&s.y>k.y&&s.y<k.y+k.h){k.hp--;s.dead=true;s.vy=-Math.abs(s.vy)*.55;break}}}
stones=stones.filter(s=>!s.dead);draw();requestAnimationFrame(step)}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a1417');g.addColorStop(1,'#150d0f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#1d1213';ctx.fillRect(0,H-30,W,30);
ctx.fillStyle='#6b4a3f';ctx.fillRect(50,H-40,34,10);ctx.fillStyle='#c96f4a';ctx.fillRect(66,H-66,8,28);ctx.fillStyle='#d9a08f';ctx.beginPath();ctx.arc(66,H-70,9,0,7);ctx.fill();
for(const k of wall){ctx.fillStyle=k.hp>0?'#8f6a4a':'#3a2a22';ctx.fillRect(k.x,k.y,k.w,k.h);ctx.strokeStyle='#0006';ctx.strokeRect(k.x+.5,k.y+.5,k.w-1,k.h-1)}
for(const k of blocks){ctx.fillStyle=k.hp>0?'#a0522d':'#3a2a22';ctx.fillRect(k.x,k.y,k.w,k.h);ctx.strokeStyle='#0006';ctx.strokeRect(k.x+.5,k.y+.5,k.w-1,k.h-1)}
for(const s of stones){ctx.fillStyle='#777';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();ctx.strokeStyle='#bbb';ctx.stroke()}
if(drag){ctx.strokeStyle='#ffd9c8';ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(66,H-40);ctx.lineTo(66-drag.dx*2,H-40-drag.dy*2);ctx.stroke();ctx.setLineDash([])}
ctx.fillStyle='#8f7f7b';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('投石车 · 剩余石块 '+ammo+' · 向后拖动瞄准发射',W/2,H-8)}
cv.addEventListener('mousedown',e=>{if(over)return;const r=cv.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top,dx:0,dy:0}});
cv.addEventListener('mousemove',e=>{if(!drag)return;const r=cv.getBoundingClientRect();drag.dx=e.clientX-r.left-drag.x;drag.dy=e.clientY-r.top-drag.y;angle=Math.max(20,Math.min(75,50+(-drag.dy)/3));draw()});
cv.addEventListener('mouseup',()=>{if(!drag)return;power=Math.hypot(drag.dx,drag.dy);drag=false;launch()});
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0],r=cv.getBoundingClientRect();drag={x:t.clientX-r.left,y:t.clientY-r.top,dx:0,dy:0}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0],r=cv.getBoundingClientRect();if(!drag)return;drag.dx=t.clientX-r.left-drag.x;drag.dy=t.clientY-r.top-drag.y;angle=Math.max(20,Math.min(75,50+(-drag.dy)/3));draw()},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(!drag)return;power=Math.hypot(drag.dx,drag.dy);drag=false;launch()},{passive:false});
function restart(){document.querySelector('.over').classList.remove('show');init()}
init();

</script></body></html>
