<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>纸牌接龙</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#1a2418,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:20px;letter-spacing:.16em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f;display:flex;gap:18px}
#bd{position:relative;width:min(96vw,440px);height:min(64vh,420px);background:#120e11;border:2px solid #2a5a3a88;border-radius:14px;box-shadow:0 0 24px #2a5a3a2e;overflow:hidden}
.col{position:absolute;top:8px;bottom:8px;width:22%;background:#0d1810;border:1px dashed #2a5a3a55;border-radius:8px}
.foundation{position:absolute;top:8px;width:22%;height:52px;background:#0d1810;border:1px solid #2a5a3a77;border-radius:8px;display:grid;place-items:center;font-size:11px;color:#4a7a5a}
.card{position:absolute;width:22%;height:52px;border-radius:7px;background:#f4ead8;color:#1a1a1a;display:grid;place-items:center;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 2px 6px #0008;user-select:none;z-index:2}
.card.red{color:#b02a2a}
.card.face-down{background:linear-gradient(135deg,#7a2a2a,#4a1a1a);color:#ffd9c8;font-size:20px}
.stock{position:absolute;left:8px;top:8px;width:22%;height:52px;background:#3a2224;border-radius:7px;display:grid;place-items:center;cursor:pointer;font-size:22px;border:1px solid #b02a2a66}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #2a5a3a88;border-radius:16px;padding:24px 34px}
.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:14px auto 0;padding:9px 28px;border:0;border-radius:999px;background:linear-gradient(135deg,#2a5a3a,#3a8a4a);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
</style></head><body>
<div class="wrap"><h1>🃏 纸牌接龙</h1><div class="info"><span>翻牌堆 <b id="stockLeft">24</b></span><span>已归位 <b id="done">0</b>/4</span></div><div id="bd"></div><div class="hint">点击牌堆翻牌 · 点击牌移到同花色基础堆</div></div>
<div class="over"><div class="panel"><b>🎉 全部接龙完成！</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const SUITS=['♠','♥','♦','♣'];const bd=document.getElementById('bd');let stock=[],foundations=[[],[],[],[]],waste=[],cols=[];let done=0;
function restart(){done=0;document.getElementById('stockLeft').textContent=24;document.getElementById('done').textContent=0;document.querySelector('.over').classList.remove('show');let deck=[];for(let s of SUITS)for(let v=1;v<=13;v++)deck.push({s,v});for(let i=deck.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}cols=Array.from({length:4},()=>[]);for(let i=0;i<4;i++){cols[i]=deck.splice(0,6)}stock=deck;foundations=SUITS.map(()=>[]);render()}
function render(){bd.innerHTML='';for(let i=0;i<4;i++){let c=document.createElement('div');c.className='col';c.style.left=(4+i*24.5)+'%';bd.appendChild(c)}for(let i=0;i<4;i++){let f=document.createElement('div');f.className='foundation';f.style.left=(4+i*24.5)+'%';f.innerHTML=foundations[i].length?foundations[i][foundations[i].length-1].s:'A';bd.appendChild(f)}let st=document.createElement('div');st.className='stock';st.textContent='🃏';st.onclick=drawStock;bd.appendChild(st);for(let i=0;i<4;i++){let col=cols[i];for(let j=0;j<col.length;j++){let card=col[j],d=document.createElement('div');d.className='card'+(card.s==='♥'||card.s==='♦'?' red':'')+(j<col.length-1?' face-down':'');d.textContent=j<col.length-1?'🂠':card.s+card.v;d.style.left=(4+i*24.5)+'%';d.style.top=(8+j*20)+'px';if(j===col.length-1)d.onclick=()=>tryFoundation(i);bd.appendChild(d)}}}
function drawStock(){if(!stock.length)return;let c=stock.pop();let col=cols[Math.random()*4|0];col.push(c);document.getElementById('stockLeft').textContent=stock.length;render()}
function tryFoundation(i){let col=cols[i],card=col[col.length-1],si=SUITS.indexOf(card.s),f=foundations[si];if(!f.length&&card.v===1||f.length&&card.v===f[f.length-1].v+1){f.push(card);col.pop();if(!col.length){cols.splice(i,1);cols.push([])}done++;document.getElementById('done').textContent=done;render();if(done>=4)setTimeout(()=>document.querySelector('.over').classList.add('show'),200)}}
restart();
</script></body></html>
