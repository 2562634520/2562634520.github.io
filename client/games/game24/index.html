<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>24 点</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}
.cards{display:flex;gap:10px}
.card{width:min(20vw,86px);aspect-ratio:2/3;border-radius:12px;background:linear-gradient(145deg,#fff,#e8e2dc);color:#8e2b28;display:grid;place-items:center;font-size:min(11vw,44px);font-weight:900;box-shadow:0 8px 24px #b02a2a33}
.inp{width:min(92vw,420px);display:flex;gap:8px}
input{flex:1;min-width:0;border:1px solid #b02a2a66;border-radius:12px;background:#171215;color:#ffd9c8;padding:13px 14px;font-size:16px;outline:0}
input:focus{border-color:#d64545}
.go{border:0;border-radius:12px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;padding:0 22px;font-size:15px;font-weight:700;cursor:pointer}
.msg{min-height:22px;font-size:14px;color:#d9a08f}
.hint{font-size:11px;color:#8f7f7b}
</style></head><body>
<div class="wrap"><h1>🧮 24 点</h1><div class="score">已完成 <b id="n">0</b> 局 · 连续 <span id="streak">0</span></div>
<div class="cards" id="cards"></div>
<div class="inp"><input id="exp" placeholder="例如 (8-6/3)*4" inputmode="text" autocomplete="off"><button class="go" onclick="check()">计算</button></div>
<div class="msg" id="msg"></div><div class="hint">四张牌用 + - × ÷ 和括号凑出 24，每张牌用一次</div></div>
<script>
let nums=[],n=0,streak=0;
const cards=document.getElementById('cards'),msg=document.getElementById('msg'),exp=document.getElementById('exp');
function deal(){nums=[];for(let i=0;i<4;i++)nums.push(1+Math.random()*13|0);render();msg.textContent='';exp.value='';exp.focus()}
function render(){cards.innerHTML='';nums.forEach(v=>{const d=document.createElement('div');d.className='card';d.textContent=v;cards.appendChild(d)})}
function check(){const s=exp.value.trim().replace(/x/gi,'*').replace(/÷/g,'/').replace(/×/g,'*');
if(!s){msg.textContent='请输入算式';return}
const used=[];
for(const ch of s){if(/[0-9]/.test(ch)){const n=+ch;if(!nums.includes(n)||used.filter(u=>u===n).length>=nums.filter(x=>x===n).length){msg.textContent='⚠️ 数字必须使用发到的牌';return}used.push(n)}}
let val;try{val=Function('"use strict";return('+s+')')()}catch(e){msg.textContent='算式格式不正确';return}
if(Math.abs(val-24)<1e-6){n++;streak++;document.getElementById('n').textContent=n;document.getElementById('streak').textContent=streak;msg.textContent='✅ 正确！24 点达成，下一局';setTimeout(deal,900)}
else{streak=0;document.getElementById('streak').textContent=0;msg.textContent='❌ 结果是 '+Math.round(val*100)/100+'，再来一次'}}
exp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
deal();
</script></body></html>
