<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎴 疯狂八点</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🎴 疯狂八点</h1><div class="score">轮数 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=360*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let hand,topCard,currentSuit,score,alive,raf;
function rset(){hand=[];for(let i=0;i<7;i++)hand.push({n:Math.floor(Math.random()*13)+2,s:Math.floor(Math.random()*4)});topCard={n:8,s:Math.floor(Math.random()*4)};currentSuit=topCard.s;score=0;alive=true;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,360);ctx.fillStyle='#5a8faf';ctx.fillRect(150,150,60,90);ctx.fillStyle='#ffd9c8';ctx.font='bold 24px sans-serif';ctx.fillText(topCard.n===1?'A':topCard.n===11?'J':topCard.n===12?'Q':topCard.n===13?'K':topCard.n, 165, 195);hand.forEach((c,i)=>{ctx.fillStyle='#b02a2a';ctx.fillRect(30+i*45, 270, 40, 70);ctx.fillStyle='#ffd9c8';ctx.font='12px sans-serif';ctx.fillText(c.n===1?'A':c.n, 38+i*45, 290);ctx.fillText(['♠','♥','♦','♣'][c.s], 50+i*45, 330)});raf=requestAnimationFrame(loop)}
function restart(){rset()}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(360/r.width);const idx=Math.floor((x-30)/45);if(idx>=0&&idx<hand.length&&alive){const c=hand[idx];if(c.n===8||c.s===currentSuit){topCard=c;currentSuit=c.s;hand.splice(idx,1);score++;document.getElementById('sc').textContent=score;if(!hand.length){{document.getElementById('msg').textContent='完成 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('crazyeightsBest',Math.max(parseInt(localStorage.getItem('crazyeightsBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}}}});
rset();
</script></body></html>
