<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🁢 多米诺</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🁢 多米诺</h1><div class="score">玩家 <b id="sc">0</b> · 电脑 <b id="bs">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=480*dpr;cv.height=360*dpr;cv.style.width=Math.min(480,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let pieces,table,turn,score,bscore,alive,raf;
function rset(){pieces=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)pieces.push([i,j]);pieces.sort(()=>Math.random()-.5);table=[[3,3]];turn=0;score=0;bscore=7;alive=true;document.getElementById('sc').textContent=0;document.getElementById('bs').textContent=bscore;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function play(side){if(!alive||turn)return;const v=table[side][side===0?0:1];for(let i=0;i<pieces.length;i++){if(pieces[i][0]===v){table[side===0?'unshift':'push'](pieces[i]);pieces.splice(i,1);score++;turn=1;setTimeout(ai,500);return}if(pieces[i][1]===v){table[side===0?'unshift':'push']([pieces[i][1],pieces[i][0]]);pieces.splice(i,1);score++;turn=1;setTimeout(ai,500);return}}}
function ai(){if(!turn)return;const v=table[table.length-1][1];for(let i=0;i<pieces.length;i++){if(pieces[i][0]===v||pieces[i][1]===v){table.push(pieces[i]);pieces.splice(i,1);bscore--;turn=0;if(bscore<=0){{document.getElementById('msg').textContent='胜 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('dominoBest',Math.max(parseInt(localStorage.getItem('dominoBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}return}}{document.getElementById('msg').textContent='胜 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('dominoBest',Math.max(parseInt(localStorage.getItem('dominoBest')||0),score));document.querySelector('.over').classList.add('show');alive=false}}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,480,360);ctx.fillStyle='#3a2c2f';ctx.fillRect(0,180,480,40);table.forEach((p,i)=>{ctx.fillStyle='#b02a2a';ctx.fillRect(240-p[0]*8+i*5,180-p[1]*4,16,40);ctx.fillStyle='#ffd9c8';ctx.fillRect(240-p[0]*8+i*5+6,180-p[1]*4+8,4,4);ctx.fillRect(240-p[0]*8+i*5+6,180-p[1]*4+28,4,4)});ctx.fillStyle='#d9a08f';ctx.font='14px sans-serif';ctx.fillText('牌 '+pieces.length,20,50);ctx.fillText('出左',20,310);ctx.fillText('出右',420,310);raf=requestAnimationFrame(loop)}
function restart(){rset()}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(480/r.width);play(x<240?0:1)});
rset();
</script></body></html>
