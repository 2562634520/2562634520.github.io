<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🧸 抓娃娃机</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>🧸 抓娃娃机</h1><canvas id="cv"></canvas>
<div class="info">得分 <b id="sc">0</b> / 60 · 剩余次数 <b id="coin">5</b></div>
<div class="hint">移动爪子到娃娃上方，点击下降抓取 · 抓到 +10 分</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function size(){W=Math.min(innerWidth-24,400);H=Math.floor(W*1.2);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
let over=false,toys=[],claw={x:0,y:0,state:'idle'},score=0,coin=5,tick=0;
const COLORS=['#d64545','#e8a13c','#57c96e','#4a9ede','#9b6be0','#e8d53c'];
function init(){over=false;toys=[];for(let i=0;i<6;i++)toys.push({x:45+Math.random()*(W-90),y:150+Math.random()*(H-220),r:13,c:COLORS[i],grabbed:false});claw={x:W/2,y:40,state:'idle'};score=0;coin=5;tick=0;document.getElementById('sc').textContent='0';document.querySelector('.over').classList.remove('show');draw()}
cv.addEventListener('pointermove',e=>{if(claw.state!=='idle')return;const r=cv.getBoundingClientRect();claw.x=Math.max(25,Math.min(W-25,e.clientX-r.left))});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(claw.state!=='idle')return;const r=cv.getBoundingClientRect();claw.x=Math.max(25,Math.min(W-25,e.touches[0].clientX-r.left))},{passive:false});
cv.addEventListener('pointerdown',()=>{if(over||claw.state!=='idle')return;if(coin<=0)return;coin--;claw.state='down'});
function step(){tick++;
if(claw.state==='down'){claw.y+=2;if(claw.y>=H-100){claw.state='grab';const t=toys.find(v=>!v.grabbed&&Math.abs(v.x-claw.x)<34&&v.y>claw.y-20&&v.y<claw.y+80);if(t){t.grabbed=true;t.oy=t.y}claw.state='up'}}
else if(claw.state==='up'){claw.y-=2;const t=toys.find(v=>v.grabbed);if(t){t.x=claw.x;t.y=claw.y+55}if(claw.y<=40){if(t){score+=10;document.getElementById('sc').textContent=score;t.grabbed=false;t.y=H-40}t.y=claw.y+55;claw.state='idle';if(score>=60){over=true;msg.textContent='抓满 6 个娃娃，太厉害了！';document.querySelector('.over').classList.add('show')}}}
draw();requestAnimationFrame(step)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#1c0f12';ctx.fillRect(0,0,W,H);ctx.fillStyle='#2a1a1c';ctx.fillRect(10,110,W-20,H-140);ctx.strokeStyle='#b02a2a66';ctx.strokeRect(10,110,W-20,H-140);
for(const t of toys){if(t.grabbed)continue;ctx.fillStyle=t.c;ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,7);ctx.fill();ctx.fillStyle='#0b090c';ctx.beginPath();ctx.arc(t.x-4,t.y-4,2.2,0,7);ctx.arc(t.x+4,t.y-4,2.2,0,7);ctx.fill()}
ctx.strokeStyle='#8a8a8a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(claw.x,10);ctx.lineTo(claw.x,claw.y);ctx.stroke();ctx.strokeStyle='#ffd9c8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(claw.x-18,claw.y+20);ctx.lineTo(claw.x,claw.y);ctx.lineTo(claw.x+18,claw.y+20);ctx.stroke();
ctx.fillStyle='#ffd9c8';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText('得分 '+score+' / 60',12,24);ctx.textAlign='right';ctx.fillText('次数 '+coin,W-12,24)}
function restart(){init()}
let running=false;function loop(){if(running)return;running=true;step()}
init();

</script></body></html>
