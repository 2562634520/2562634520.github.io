<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>⚡ 反应圆点</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>⚡ 反应圆点</h1><div class="score">反应 <b id="sc">0</b> · 最佳 <b id="bs">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=420*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let state,score,best,alive,raf,timer,waitT;
function rset(){state='wait';score=0;best=parseInt(localStorage.reactiondotsBest||0);document.getElementById('bs').textContent=best;timer=0;waitT=Math.random()*90+60;alive=true;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);setTimeout(()=>{alive=false;{document.getElementById('msg').textContent='平均 '+Math.floor(score/Math.max(1,score/100));document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),Math.floor(score/Math.max(1,score/100)));localStorage.setItem('reactiondotsBest',Math.max(parseInt(localStorage.getItem('reactiondotsBest')||0),Math.floor(score/Math.max(1,score/100))));document.querySelector('.over').classList.add('show');alive=false}ms},30000);requestAnimationFrame(loop)}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,420);if(state==='wait'){ctx.fillStyle='#b02a2a';ctx.beginPath();ctx.arc(180,220,30,0,Math.PI*2);ctx.fill()}else if(state==='ready'){ctx.fillStyle='#7aaa55';ctx.beginPath();ctx.arc(180,220,30,0,Math.PI*2);ctx.fill()}else if(state==='tooEarly'){ctx.fillStyle='#d9a08f';ctx.font='14px sans-serif';ctx.fillText('太早了！',150,220)}
document.getElementById('sc').textContent=score;timer++;if(state==='wait'&&timer>waitT)state='ready';
raf=requestAnimationFrame(loop)}
function tap(e){if(!alive)return;if(state==='ready'){score=Math.max(score,100);state='wait';timer=0;waitT=Math.random()*90+60}else if(state==='wait'){state='tooEarly';setTimeout(()=>state='wait',500)}}
function restart(){rset()}
cv.addEventListener('pointerdown',tap);
rset();
</script></body></html>
