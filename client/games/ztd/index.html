<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🧟 僵尸塔防</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>🧟 僵尸塔防</h1><canvas id="cv"></canvas>
<div class="info">击杀 <b id="sc">0</b> · 生命 <b id="lv">10</b> · 波次 <b id="wv">1</b></div>
<div class="hint">点击僵尸射击消灭它们 · 守住 5 波僵尸进攻</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function size(){W=Math.min(innerWidth-24,460);H=Math.floor(W*.68);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
let over=false,win=false,score=0,life=10,zs=[],towers=[],tick=0,wave=1,spawnLeft=0;
function init(){over=false;win=false;score=0;life=10;zs=[];towers=[{x:W*.3,y:H-55},{x:W*.55,y:H-55},{x:W*.8,y:H-55}];tick=0;wave=1;spawnLeft=3;document.getElementById('sc').textContent='0';document.getElementById('lv').textContent='10';document.getElementById('wv').textContent='1';document.querySelector('.over').classList.remove('show');loop()}
function spawn(){zs.push({x:W+30,y:H-48,hp:2,spd:1+wave*.12,dead:false})}
cv.addEventListener('pointerdown',e=>{if(over)return;const r=cv.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;const hit=zs.find(z=>z.hp>0&&Math.hypot(x-z.x,y-z.y)<22);if(hit){hit.hp--;if(hit.hp<=0){score++;document.getElementById('sc').textContent=score;hit.dead=true}}});
function step(){if(over)return;tick++;
if(spawnLeft>0&&tick%70===0){spawn();spawnLeft--}
if(spawnLeft<=0&&!zs.some(z=>z.hp>0)){wave++;spawnLeft=2+wave*2;document.getElementById('wv').textContent=wave;if(wave>5){over=true;win=true;msg.textContent='守住 5 波，胜利！得分 '+score;document.querySelector('.over').classList.add('show')}}
for(const z of zs){z.x-=z.spd;if(z.x<20){life--;document.getElementById('lv').textContent=life;z.dead=true;if(life<=0){over=true;msg.textContent='僵尸进村了！得分 '+score;document.querySelector('.over').classList.add('show')}}}
zs=zs.filter(z=>!z.dead);draw();requestAnimationFrame(step)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#12100e';ctx.fillRect(0,0,W,H);ctx.fillStyle='#2a3a2a';ctx.fillRect(0,H-40,W,40);ctx.strokeStyle='#5a5a3a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,H-60);ctx.lineTo(W,H-60);ctx.stroke();
for(const z of zs){if(z.dead)continue;ctx.fillStyle=z.hp>1?'#4a8a4a':'#57a057';ctx.beginPath();ctx.arc(z.x,z.y-10,12,0,7);ctx.arc(z.x-10,z.y+2,10,0,7);ctx.arc(z.x+10,z.y+2,10,0,7);ctx.fill();ctx.fillStyle='#b02a2a';ctx.beginPath();ctx.arc(z.x-4,z.y-12,2.5,0,7);ctx.arc(z.x+4,z.y-12,2.5,0,7);ctx.fill()}
for(const t of towers){ctx.fillStyle='#8a5a3a';ctx.beginPath();ctx.arc(t.x,t.y,14,0,7);ctx.fill();ctx.fillStyle='#ffd9c8';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('塔',t.x,t.y+4)}
ctx.fillStyle='#ffd9c8';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText('击杀 '+score,12,24);ctx.textAlign='center';ctx.fillText('第 '+wave+' 波',W/2,24);ctx.textAlign='right';ctx.fillText('生命 '+life,W-12,24)}
function restart(){init()}
let running=false;function loop(){if(running)return;running=true;step()}
init();

</script></body></html>
