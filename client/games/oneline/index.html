<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>✏️ 一笔画</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>✏️ 一笔画</h1><canvas id="cv"></canvas>
<div class="info">连线 <b id="sc">0</b> / 待定</div>
<div class="hint">沿已有线段依次点击节点，一笔连完所有点 · 错点会重置</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,points=[],path=[],edges=new Set();
function size(){W=Math.min(innerWidth-24,400);H=Math.floor(W*.9);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
function init(){points=[];path=[];edges=new Set();const N=4+Math.floor(Math.random()*3);for(let i=0;i<N;i++){let p;do{p={x:50+Math.random()*(W-100),y:50+Math.random()*(H-100)}}while(points.some(q=>Math.hypot(p.x-q.x,p.y-q.y)<55));points.push(p)}
for(let i=0;i<N-1;i++){const a=points[i],b=points[i+1];edges.add(i+','+(i+1))}
for(let i=0;i<N;i++){const j=Math.floor(Math.random()*N);if(i!==j&&!edges.has(i+','+j)&&!edges.has(j+','+i))edges.add(i+','+j)}
document.getElementById('sc').textContent='0';document.querySelector('.over').classList.remove('show');draw()}
cv.addEventListener('pointerdown',e=>{if(document.querySelector('.over').classList.contains('show'))return;const r=cv.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;let bi=-1,bd=1e9;points.forEach((p,i)=>{const d=Math.hypot(x-p.x,y-p.y);if(d<bd){bd=d;bi=i}});if(bi<0||bd>28)return;
if(path.length&&path[path.length-1]===bi){return}
if(!path.length){path=[bi];draw();return}
const last=path[path.length-1];if(!edges.has(last+','+bi)&&!edges.has(bi+','+last))return;
if(path.includes(bi)){path=[bi];draw();return}
path.push(bi);document.getElementById('sc').textContent=path.length-1;draw();if(path.length===points.length){document.querySelector('.over').classList.add('show');msg.textContent='一笔画完成！'}});
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#14101a';ctx.fillRect(0,0,W,H);
for(const e of edges){const[a,b]=e.split(',').map(Number);ctx.strokeStyle='#4a3a5a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(points[a].x,points[a].y);ctx.lineTo(points[b].x,points[b].y);ctx.stroke()}
for(let i=0;i<path.length-1;i++){ctx.strokeStyle='#d64545';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(points[path[i]].x,points[path[i]].y);ctx.lineTo(points[path[i+1]].x,points[path[i+1]].y);ctx.stroke()}
points.forEach((p,i)=>{ctx.fillStyle=path.includes(i)?'#d64545':'#8a6a9a';ctx.beginPath();ctx.arc(p.x,p.y,10,0,7);ctx.fill();ctx.fillStyle='#ffd9c8';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText(i+1,p.x,p.y+4)});
ctx.fillStyle='#ffd9c8';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText('连线 '+path.length+' / '+points.length,12,24)}
function restart(){init()}
init();

</script></body></html>
