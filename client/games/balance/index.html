<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>平衡滚球</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,'PingFang SC',sans-serif;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#ffd9c8;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{font-size:19px;margin:10px 0 4px;letter-spacing:2px}
.hint{font-size:12px;opacity:.7;margin-bottom:6px}
canvas{background:#12141c;border:1px solid #5a2424;border-radius:12px;max-width:96vw;max-height:68vh;touch-action:none}
.bar{font-size:13px;margin:8px 0}
.over{position:fixed;inset:0;background:rgba(10,6,8,.86);display:none;align-items:center;justify-content:center;z-index:9}
.over.show{display:flex}
.panel{text-align:center;padding:26px 38px;background:#1a0f12;border:1px solid #b02a2a;border-radius:16px}
.panel h2{font-size:24px;color:#ff6b6b;margin-bottom:8px}
.panel p{font-size:14px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 28px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;border:none;border-radius:999px;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.96)}
</style></head><body>
<h1>⚖️ 平衡滚球</h1><div class="hint">拖动/方向键倾斜平台 · 让球滚到绿色终点 · 别掉进洞</div>
<canvas id="c" width="360" height="480"></canvas>
<div class="bar">关卡 <b id="lv">1</b>/3 · 用时 <b id="tm">0</b> 秒</div>
<div class="over" id="over"><div class="panel"><h2 id="t"></h2><p id="s"></p><button class="btn" onclick="again()">再来一局</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=360,H=480;
const LEVELS=[
  {walls:[[0,200,W,14],[0,340,W,14]],holes:[[180,270]],start:[40,150],end:[300,390],step:1},
  {walls:[[80,150,W-80,14],[0,300,W,14],[40,420,W-120,14]],holes:[[260,230],[120,360]],start:[40,90],end:[280,450],step:2},
  {walls:[[0,120,W,14],[140,260,W-140,14],[0,390,W,14]],holes:[[80,190],[280,320]],start:[40,60],end:[300,440],step:3}
];
let level=0,tiltX=0,tiltY=0,bx=40,by=150,bvx=0,bvy=0,time=0,run=true;
function setup(){level=0;tiltX=0;tiltY=0;bx=40;by=150;bvx=0;bvy=0;time=0;run=true}
function tick(){
  if(!run)return;
  time+=.016;document.getElementById('tm').textContent=time|0;
  bvx+=tiltX*.18;bvy+=tiltY*.18;bvx*=.98;bvy*=.98;
  bx+=bvx;by+=bvy;
  const L=LEVELS[level];
  if(bx<10){bx=10;bvx=0}if(bx>W-10){bx=W-10;bvx=0}if(by<10){by=10;bvy=0}if(by>H-10){by=H-10;bvy=0}
  L.walls.forEach(w=>{
    if(bx+10>w[0]&&bx-10<w[0]+w[2]&&by+10>w[1]&&by-10<w[1]+w[3]){
      const ol=[bx+10-w[0],w[0]+w[2]-(bx-10),by+10-w[1],w[1]+w[3]-(by-10)];
      const min=Math.min(...ol),i=ol.indexOf(min);
      if(i===0){bx=w[0]-10;bvx=Math.abs(bvx)*.4}
      if(i===1){bx=w[0]+w[2]+10;bvx=-Math.abs(bvx)*.4}
      if(i===2){by=w[1]-10;bvy=Math.abs(bvy)*.4}
      if(i===3){by=w[1]+w[3]+10;bvy=-Math.abs(bvy)*.4}
    }
  });
  L.holes.forEach(h=>{
    if(Math.hypot(bx-h[0],by-h[1])<18){run=false;show('🕳 掉进洞里','第 '+(level+1)+' 关失败 · 用时 '+time|0+' 秒')}
  });
  if(Math.hypot(bx-L.end[0],by-L.end[1])<22){
    if(level>=2){run=false;show('🎉 全部通关！','总用时 '+time|0+' 秒')}
    else{level++;bx=40;by=60+(level-1)*30;bvx=0;bvy=0;document.getElementById('lv').textContent=(level+1)+'/3'}
  }
  draw();
}
function draw(){
  ctx.fillStyle='#12141c';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(tiltX*.02);ctx.rotate(tiltY*.02);ctx.translate(-W/2,-H/2);
  const L=LEVELS[level];
  L.walls.forEach(w=>{ctx.fillStyle='#3a2a3a';ctx.fillRect(w[0],w[1],w[2],w[3])});
  L.holes.forEach(h=>{ctx.fillStyle='#000';ctx.beginPath();ctx.arc(h[0],h[1],14,0,7);ctx.fill()});
  ctx.fillStyle='#57c785';ctx.fillRect(L.end[0]-14,L.end[1]-14,28,28);
  ctx.strokeStyle='#d64545';ctx.strokeRect(L.end[0]-14,L.end[1]-14,28,28);
  ctx.fillStyle='#ffd9c8';ctx.beginPath();ctx.arc(bx,by,9,0,7);ctx.fill();
  ctx.restore();
  ctx.fillStyle='#ffd9c8';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('拖动屏幕倾斜平台',180,H-8);
}
let tx=0,ty=0;
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();tx=e.clientX-r.left;ty=e.clientY-r.top});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;tiltX=Math.max(-1,Math.min(1,(x-tx)/60));tiltY=Math.max(-1,Math.min(1,(y-ty)/60))});
cv.addEventListener('pointerup',()=>{tiltX=0;tiltY=0});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')tiltX=-1;if(e.key==='ArrowRight')tiltX=1;if(e.key==='ArrowUp')tiltY=-1;if(e.key==='ArrowDown')tiltY=1});
window.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key))tiltX=0;if(['ArrowUp','ArrowDown'].includes(e.key))tiltY=0});
function show(t,s){document.getElementById('t').textContent=t;document.getElementById('s').textContent=s;document.getElementById('over').classList.add('show')}
function again(){document.getElementById('over').classList.remove('show');setup()}
setup();setInterval(tick,16);
</script></body></html>
