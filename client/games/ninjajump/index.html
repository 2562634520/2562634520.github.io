<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🥷 忍者跳</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🥷 忍者跳</h1><div class="score">高度 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=360*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let player,plat,score,alive,raf,tick,jumpV;
function rset(){player={x:180,y:280};plat=[{x:140,y:300,w:80,h:10}];score=0;tick=0;alive=true;jumpV=0;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){if(!alive)return;tick++;jumpV+=0.5;player.y+=jumpV;if(player.y>320){{document.getElementById('msg').textContent='高度 '+Math.floor(score);document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),Math.floor(score));localStorage.setItem('ninjajumpBest',Math.max(parseInt(localStorage.getItem('ninjajumpBest')||0),Math.floor(score)));document.querySelector('.over').classList.add('show');alive=false};return}
plat.forEach(p=>{if(player.x+15>p.x&&player.x-15<p.x+p.w&&player.y+15>p.y&&player.y-15<p.y+p.h){player.y=p.y-15;jumpV=-12;score++}});plat=plat.filter(p=>p.x>-100);if(tick%20===0)plat.push({x:Math.random()*300+30,y:Math.random()*150+150,w:80,h:10});plat.forEach(p=>{p.x-=2});
document.getElementById('sc').textContent=Math.floor(score);
ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,360);ctx.fillStyle='#b02a2a';plat.forEach(p=>ctx.fillRect(p.x,p.y,p.w,p.h));ctx.fillStyle='#5a8faf';ctx.fillRect(player.x-15,player.y-15,30,30);ctx.fillStyle='#ffd9c8';ctx.fillRect(player.x-5,player.y-10,10,8);raf=requestAnimationFrame(loop)}
function move(e){const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(360/r.width);player.x=x}
function restart(){rset()}
cv.addEventListener('pointermove',move);
rset();
</script></body></html>
