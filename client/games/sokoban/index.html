<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>推箱子</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:20px;letter-spacing:.16em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f;display:flex;gap:18px}
#bd{display:grid;background:#120e11;border:2px solid #b02a2a66;border-radius:12px;padding:8px;box-shadow:0 0 24px #b02a2a2e;gap:2px}
.cell{width:34px;height:34px;display:grid;place-items:center;font-size:22px;border-radius:5px}
@media(max-width:380px){.cell{width:28px;height:28px;font-size:18px}}
.wall{background:#3a2224}
.floor{background:#1d1416}
.goal{background:#3a2a12}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:24px 34px}
.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:10px auto 0;padding:9px 28px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
</style></head><body>
<div class="wrap"><h1>📦 推箱子</h1><div class="info"><span>关卡 <b id="lv">1</b></span><span>步数 <b id="mv">0</b></span></div><div id="bd"></div><div class="hint">滑动/方向键推箱子到目标点</div></div>
<div class="over"><div class="panel"><b id="msg">过关！</b><button class="btn" onclick="next()">下一关</button></div></div>
<script>
const LEVELS=['##########|#        #|#  .     #|#  $     #|#        #|#   @    #|#        #|##########','##########|#        #|# .      #|#  $     #|# . $  . #|#    @   #|#        #|##########','##########|#        #|#        #|# $$  .. #|#    @   #|#        #|#        #|##########'];
const bd=document.getElementById('bd');let lv=0,mv=0,grid=[],px=0,py=0;
function load(n){lv=n%LEVELS.length;mv=0;grid=LEVELS[lv].split('|').map(r=>r.split(''));for(let y=0;y<grid.length;y++)for(let x=0;x<grid[y].length;x++){if(grid[y][x]==='@'){px=x;py=y;grid[y][x]=' '}}document.getElementById('lv').textContent=lv+1;document.getElementById('mv').textContent=0;document.querySelector('.over').classList.remove('show');render()}
function render(){bd.innerHTML='';bd.style.gridTemplateColumns=`repeat(${grid[0].length},auto)`;for(let y=0;y<grid.length;y++)for(let x=0;x<grid[y].length;x++){let c=document.createElement('div');c.className='cell';let v=grid[y][x];if(v==='#')c.className+=' wall';else if(v==='.')c.className+=' goal';else if(v===' ')c.className+=' floor';c.textContent=v==='#'?'':x===px&&y===py?'🧍':v==='$'?'📦':v==='.'?'⭐':v==='*'?'⭐':'';bd.appendChild(c)}}
function tryMove(dx,dy){let nx=px+dx,ny=py+dy;if(grid[ny][nx]==='#')return;if(grid[ny][nx]==='$'||grid[ny][nx]==='*'){let bx=nx+dx,by=ny+dy;if(grid[by][bx]==='#'||grid[by][bx]==='$'||grid[by][bx]==='*')return;grid[by][bx]=grid[by][bx]==='.'?'*':'$'}let target=grid[ny][nx];grid[py][px]=grid[py][px]==='@'?' ':grid[py][px];px=nx;py=ny;mv++;document.getElementById('mv').textContent=mv;if(target==='.'||target==='*')grid[py][px]='@';else grid[py][px]='@';render();if(!grid.some(r=>r.includes('$'))){document.getElementById('msg').textContent='🎉 过关！';document.querySelector('.over').classList.add('show')}}
addEventListener('keydown',e=>{let k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(k)tryMove(k[0],k[1])});
let sx=0,sy=0;
bd.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
bd.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)<14)return;if(Math.abs(dx)>Math.abs(dy))tryMove(Math.sign(dx),0);else tryMove(0,Math.sign(dy))});
function next(){load(lv+1)}
load(0);
</script></body></html>
