<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🔢 数独X</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🔢 数独X</h1><div class="score">完成 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=360*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let grid,score,alive,raf;
function rset(){grid=Array.from({length:9},(_,r)=>Array.from({length:9},(_,c)=>Math.random()<0.5?(r+c)%9+1:0));score=0;alive=true;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,360);for(let r=0;r<9;r++)for(let c=0;c<9;c++){ctx.fillStyle=grid[r][c]?'#b02a2a':'#171215';ctx.fillRect(30+c*34,30+r*34,30,30);if(grid[r][c]){ctx.fillStyle='#ffd9c8';ctx.font='bold 16px sans-serif';ctx.fillText(grid[r][c],40+c*34,52+r*34)}}
raf=requestAnimationFrame(loop)}
function restart(){rset()}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(360/r.width);const y=(e.clientY-r.top)*(360/r.height);const c=Math.floor((x-30)/34),rr=Math.floor((y-30)/34);if(c>=0&&c<9&&rr>=0&&rr<9&&alive){grid[rr][c]=grid[rr][c]===9?1:grid[rr][c]+1;let full=true;for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(!grid[r][c])full=false;score=full?81:0;document.getElementById('sc').textContent=score;if(full){{document.getElementById('msg').textContent='完成 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('sudokuxBest',Math.max(parseInt(localStorage.getItem('sudokuxBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}}});
rset();
</script></body></html>
