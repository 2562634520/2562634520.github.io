<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎲 Yahtzee</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🎲 Yahtzee</h1><div class="score">总分 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=360*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let dice,rollsLeft,score,alive,raf,hold;
function rset(){dice=[1,1,1,1,1];rollsLeft=3;hold=[false,false,false,false,false];score=0;alive=true;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,360);ctx.fillStyle='#ffd9c8';ctx.font='14px sans-serif';ctx.fillText('剩余 '+rollsLeft,20,30);ctx.fillText('总分 '+score,200,30);dice.forEach((d,i)=>{ctx.fillStyle=hold[i]?'#b02a2a':'#171215';ctx.fillRect(40+i*60, 100, 50, 50);ctx.fillStyle='#ffd9c8';ctx.font='bold 24px sans-serif';ctx.fillText(d, 60+i*60, 135)});ctx.fillStyle='#d9a08f';ctx.font='12px sans-serif';ctx.fillText('点击锁定/取消 · 下方掷骰', 80, 230);ctx.fillStyle='#b02a2a';ctx.fillRect(80,250,200,40);ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.fillText('掷骰子', 150, 275);raf=requestAnimationFrame(loop)}
function restart(){rset()}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(360/r.width);const y=(e.clientY-r.top)*(360/r.height);if(!alive)return;if(y>100&&y<150){const idx=Math.floor((x-40)/60);if(idx>=0&&idx<5){hold[idx]=!hold[idx]}}else if(y>250&&rollsLeft>0){for(let i=0;i<5;i++)if(!hold[i])dice[i]=Math.floor(Math.random()*6)+1;rollsLeft--;if(!rollsLeft){score+=dice.reduce((a,b)=>a+b,0);document.getElementById('sc').textContent=score;if(score>=80){{document.getElementById('msg').textContent='总分 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('yahtzeeBest',Math.max(parseInt(localStorage.getItem('yahtzeeBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}rollsLeft=3;hold=[false,false,false,false,false]}}});
rset();
</script></body></html>
