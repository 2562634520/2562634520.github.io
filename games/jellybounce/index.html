<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🍮 果冻弹跳</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>🍮 果冻弹跳</h1><canvas id="cv"></canvas>
<div class="info">得分 <b id="sc">0</b> · 最高 <b id="best">0</b></div>
<div class="hint">点击给果冻加力弹跳，踩中红色跳板得分，别落地</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function size(){W=Math.min(innerWidth-24,400);H=Math.floor(W*1.35);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
let over=false,score=0,best=0,ball={x:0,y:0,vy:0},pads=[],t=0,spawnT=0,star={x:0,y:0,on:false};
function init(){over=false;score=0;ball={x:W/2,y:120,vy:0};pads=[];t=0;spawnT=40;star={x:0,y:0,on:false};document.getElementById('sc').textContent='0';document.querySelector('.over').classList.remove('show');loop()}
cv.addEventListener('pointerdown',()=>{if(over)return;ball.vy=Math.max(ball.vy,-13)});
function spawnPad(){pads.push({x:20+Math.random()*(W-70),y:-20,w:52+Math.random()*38})}
function step(){if(over)return;t++;spawnT--;if(spawnT<=0){spawnPad();spawnT=42}
ball.vy+=.42;ball.y+=ball.vy;
for(const p of pads){p.y+=2.4;if(!p.hit&&ball.vy>0&&ball.y+12>=p.y&&ball.y+12<=p.y+12&&ball.x>=p.x&&ball.x<=p.x+p.w){ball.vy=-11.5;p.hit=true;score++;document.getElementById('sc').textContent=score;if(score>best)best=score}}
pads=pads.filter(p=>p.y<H+30);
if(!star.on&&Math.random()<.003)star={x:20+Math.random()*(W-40),y:-20,on:true};if(star.on){star.y+=2.6;if(Math.hypot(ball.x-star.x,ball.y-star.y)<22){score+=5;document.getElementById('sc').textContent=score;star.on=false}if(star.y>H+20)star.on=false}
if(ball.y>H-16){over=true;msg.textContent='落地了！得分 '+score;document.querySelector('.over').classList.add('show');return}
if(ball.y<12){ball.y=12;ball.vy=Math.abs(ball.vy)*.8}
draw();requestAnimationFrame(step)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#1c0f12';ctx.fillRect(0,0,W,H);
for(const p of pads){ctx.fillStyle=p.hit?'#4a6a9e':'#d64545';ctx.beginPath();ctx.roundRect?ctx.roundRect(p.x,p.y,p.w,12,6):ctx.rect(p.x,p.y,p.w,12);ctx.fill()}
if(star.on){ctx.fillStyle='#ffc93c';ctx.beginPath();ctx.arc(star.x,star.y,10,0,7);ctx.fill()}
const g=ctx.createRadialGradient(ball.x-5,ball.y-5,3,ball.x,ball.y,15);g.addColorStop(0,'#ff9b78');g.addColorStop(1,'#d64545');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(ball.x,ball.y,13,15,0,0,7);ctx.fill();
ctx.fillStyle='#ffd9c8';ctx.font='bold 16px sans-serif';ctx.textAlign='left';ctx.fillText('得分 '+score,12,24);ctx.textAlign='right';ctx.fillText('最高 '+best,W-12,24)}
function restart(){init()}
let running=false;function loop(){if(running)return;running=true;step()}
init();

</script></body></html>
