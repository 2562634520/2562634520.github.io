<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>贪吃蛇</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;height:auto;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
</style></head><body>
<div class="wrap"><h1>🐍 贪吃蛇</h1><div class="score">得分 <b id="sc">0</b> · 记录 <span id="best">0</span></div><canvas id="cv"></canvas><div class="hint">滑动 / 方向键控制 · 触屏直接滑</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let N=20,cell=0,dpr=Math.min(devicePixelRatio||1,2);
function size(){const s=Math.min(innerWidth-24,innerHeight-190,460);cv.style.width=s+'px';cv.style.height=s+'px';cv.width=s*dpr;cv.height=s*dpr;cell=s/N;ctx.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener('resize',size);
let snake,dir,nextDir,food,score,best=+localStorage.getItem('emeng_snake')||0,timer,alive;
function restart(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir=dir;score=0;alive=true;clearInterval(timer);timer=setInterval(step,130);food=randFood();document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');draw()}
function randFood(){let p;do{p={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p}
function step(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y))return die();
snake.unshift(head);
if(head.x===food.x&&head.y===food.y){score++;document.getElementById('sc').textContent=score;if(score>best){best=score;localStorage.setItem('emeng_snake',best);document.getElementById('best').textContent=best}food=randFood()}else snake.pop();
draw()}
function die(){alive=false;clearInterval(timer);document.getElementById('msg').textContent='得分 '+score;document.querySelector('.over').classList.add('show')}
function draw(){ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#120e11';ctx.fillRect(0,0,cv.width,cv.height);
ctx.fillStyle='#d64545';ctx.beginPath();ctx.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*0.32,0,7);ctx.fill();
snake.forEach((s,i)=>{ctx.fillStyle=i?'#8e2b28':'#e05a4e';const r=Math.max(1,cell*0.12);ctx.beginPath();ctx.roundRect(s.x*cell+r,s.y*cell+r,cell-2*r,cell-2*r,r);ctx.fill()})}
document.addEventListener('keydown',e=>{const k=e.key;if(k.startsWith('Arrow')){e.preventDefault();if(k==='ArrowUp'&&dir.y!==1)nextDir={x:0,y:-1};if(k==='ArrowDown'&&dir.y!==-1)nextDir={x:0,y:1};if(k==='ArrowLeft'&&dir.x!==1)nextDir={x:-1,y:0};if(k==='ArrowRight'&&dir.x!==-1)nextDir={x:1,y:0}}});
let ts;cv.addEventListener('touchstart',e=>{ts=e.touches[0]}, {passive:true});cv.addEventListener('touchmove',e=>{e.preventDefault();if(!ts)return;const dx=e.touches[0].clientX-ts.clientX,dy=e.touches[0].clientY-ts.clientY;if(Math.hypot(dx,dy)>18){if(Math.abs(dx)>Math.abs(dy))nextDir=dx>0&&dir.x!==-1?{x:1,y:0}:dx<0&&dir.x!==1?{x:-1,y:0}:nextDir;else nextDir=dy>0&&dir.y!==-1?{x:0,y:1}:dy<0&&dir.y!==1?{x:0,y:-1}:nextDir;ts=e.touches[0]}},{passive:false});
restart();
</script></body></html>
