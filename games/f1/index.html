<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>极速F1</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,'PingFang SC',sans-serif;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#ffd9c8;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{font-size:19px;margin:10px 0 4px;letter-spacing:2px}
.hint{font-size:12px;opacity:.7;margin-bottom:6px}
canvas{background:#151820;border:1px solid #5a2424;border-radius:12px;max-width:96vw;max-height:68vh;touch-action:none}
.btns{display:flex;gap:10px;margin:8px 0}
.btn2{width:90px;padding:11px 0;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer}
.btn2:active{transform:scale(.95)}
.bar{font-size:13px}
.over{position:fixed;inset:0;background:rgba(10,6,8,.86);display:none;align-items:center;justify-content:center;z-index:9}
.over.show{display:flex}
.panel{text-align:center;padding:26px 38px;background:#1a0f12;border:1px solid #b02a2a;border-radius:16px}
.panel h2{font-size:24px;color:#ff6b6b;margin-bottom:8px}
.panel p{font-size:14px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 28px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;border:none;border-radius:999px;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.96)}
</style></head><body>
<h1>🏎 极速F1</h1><div class="hint">左右换道超车 · 吃到氮气加速 · 跑得越远越好</div>
<canvas id="c" width="360" height="480"></canvas>
<div class="btns"><button class="btn2" id="left">⬅ 左道</button><button class="btn2" id="right">右道 ➡</button></div>
<div class="bar">速度 <b id="sp">0</b> km/h · 距离 <b id="ds">0</b> 米 · 超车 <b id="ov">0</b></div>
<div class="over" id="over"><div class="panel"><h2 id="t"></h2><p id="s"></p><button class="btn" onclick="again()">再来一局</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=360,H=480;
let lane=1,speed=60,dist=0,overtakes=0,cars=[],run=true,nitro=0;
function setup(){lane=1;speed=60;dist=0;overtakes=0;cars=[];run=true;nitro=0}
function bind(id,k){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();move(k)})}
function move(k){if(!run)return;if(k==='l'&&lane>0)lane--;if(k==='r'&&lane<2)lane++}
document.getElementById('left').addEventListener('pointerdown',e=>{e.preventDefault();move('l')});
document.getElementById('right').addEventListener('pointerdown',e=>{e.preventDefault();move('r')});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move('l');if(e.key==='ArrowRight')move('r')});
function tick(){
  if(!run)return;
  speed=Math.min(280,60+dist/10+(nitro>0?80:0));
  if(nitro>0)nitro--;
  dist+=speed/18;document.getElementById('ds').textContent=dist|0;
  document.getElementById('sp').textContent=speed|0;
  if(Math.random()<.012)cars.push({lane:Math.floor(Math.random()*3),y:-40,passed:false,kind:Math.random()<.25?'nitro':'car'});
  cars.forEach(c=>c.y+=speed/35);
  cars=cars.filter(c=>c.y<H+40);
  cars.forEach(c=>{
    if(!c.passed&&c.y>200){c.passed=true;overtakes++;document.getElementById('ov').textContent=overtakes}
    if(c.kind!=='nitro'&&c.y>250&&c.y<310&&c.lane===lane){run=false;show('💥 追尾了','跑了 '+dist|0+' 米 · 超车 '+overtakes)}
    if(c.kind==='nitro'&&c.y>260&&c.y<300&&c.lane===lane){nitro=90;c.y=999}
  });
  draw();
}
function draw(){
  ctx.fillStyle='#151820';ctx.fillRect(0,0,W,H);
  const off=dist*1.5%120;
  ctx.strokeStyle='#555';ctx.lineWidth=2;
  [0,1,2].forEach(i=>{const x=60+i*120;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()});
  ctx.setLineDash([24,24]);ctx.strokeStyle='#ccc';
  ctx.beginPath();ctx.moveTo(120,off);ctx.lineTo(120,off-120);ctx.moveTo(240,off);ctx.lineTo(240,off-120);ctx.stroke();
  ctx.setLineDash([]);
  cars.forEach(c=>{
    const x=60+c.lane*120;
    if(c.kind==='nitro'){ctx.fillStyle='#ffd700';ctx.fillRect(x-10,c.y-8,20,16);ctx.fillStyle='#ff6b6b';ctx.fillRect(x-14,c.y-12,6,24);ctx.fillRect(x+8,c.y-12,6,24)}
    else{ctx.fillStyle=c.lane===lane?'#b02a2a':'#4a6a9a';ctx.fillRect(x-14,c.y-16,28,32);ctx.fillStyle='#222';ctx.fillRect(x-14,c.y-14,28,10);ctx.fillRect(x-10,c.y+10,7,7);ctx.fillRect(x+3,c.y+10,7,7)}
  });
  const x=60+lane*120;
  ctx.fillStyle='#d64545';ctx.fillRect(x-14,250,28,44);
  ctx.fillStyle='#ffd9c8';ctx.fillRect(x-10,254,20,12);
  ctx.fillStyle='#222';ctx.fillRect(x-13,262,26,6);ctx.fillRect(x-11,268,6,12);ctx.fillRect(x+5,268,6,12);
  ctx.fillStyle='#ffd9c8';ctx.font='11px sans-serif';ctx.textAlign='center';
  ctx.fillText('你的赛车',x,308);
}
function show(t,s){document.getElementById('t').textContent=t;document.getElementById('s').textContent=s;document.getElementById('over').classList.add('show')}
function again(){document.getElementById('over').classList.remove('show');setup()}
setup();setInterval(tick,16);
</script></body></html>
