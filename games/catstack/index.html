<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐱 叠猫</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🐱 叠猫</h1><div class="score">高度 <b id="sc">0</b> · 最佳 <b id="bs">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=420*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let cats,score,best,alive,raf,dropping,dx;
function rset(){cats=[];for(let i=0;i<6;i++)cats.push({x:180,y:400-i*30,w:50,h:24,vy:0});score=0;dropping=true;dx=1.2;alive=true;best=parseInt(localStorage.getItem('catstackBest')||0);document.getElementById('bs').textContent=best;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,420);cats.forEach((c,i)=>{ctx.fillStyle=i===0?'#b02a2a':'#d9a08f';ctx.fillRect(c.x,c.y,c.w,c.h);ctx.fillStyle='#0c0a0d';ctx.fillRect(c.x+18,c.y+5,4,4);ctx.fillRect(c.x+28,c.y+5,4,4)});if(dropping){cats[0].x+=dx;if(cats[0].x<10||cats[0].x>300)dx=-dx}
raf=requestAnimationFrame(loop)}
function drop(){if(!alive||!dropping)return;cats[0].y-=28;cats.unshift({x:Math.random()*300+10,y:cats[0].y,w:50,h:24});cats.splice(8);score++;document.getElementById('sc').textContent=score;if(cats[0].y<60){alive=false;{document.getElementById('msg').textContent='叠到 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('catstackBest',Math.max(parseInt(localStorage.getItem('catstackBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}
dropping=true}
function restart(){rset()}
cv.addEventListener('pointerdown',drop);
rset();
</script></body></html>
