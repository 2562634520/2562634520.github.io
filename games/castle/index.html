<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🏰 城堡防御</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🏰 城堡防御</h1><div class="score">得分 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=480*dpr;cv.height=360*dpr;cv.style.width=Math.min(480,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let castle,enemies,towers,arrows,score,alive,raf,tick;
function rset(){castle={hp:100};enemies=[];towers=[];arrows=[];score=0;tick=0;alive=true;towers.push({x:120,y:200});towers.push({x:360,y:200});document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){if(!alive)return;tick++;if(tick%60===0)enemies.push({x:480,y:200+Math.random()*40,hp:30});enemies.forEach(e=>{e.x-=1;if(e.x<60){castle.hp-=10;e.hp=0;if(castle.hp<=0){{document.getElementById('msg').textContent='得分 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('castleBest',Math.max(parseInt(localStorage.getItem('castleBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}}});enemies=enemies.filter(e=>e.hp>0);towers.forEach(t=>{if(tick%30===0&&enemies.length){const e=enemies.reduce((a,b)=>a.x<b.x?a:b);if(Math.abs(t.x-e.x)<200)arrows.push({x:t.x,y:t.y,tx:e.x,ty:e.y})}});arrows.forEach(a=>{const d=Math.hypot(a.tx-a.x,a.ty-a.y);a.x+=(a.tx-a.x)/d*6;a.y+=(a.ty-a.y)/d*6;for(const e of enemies)if(Math.hypot(e.x-a.x,e.y-a.y)<10){e.hp-=20;score+=10;arrows.splice(arrows.indexOf(a),1);break}});arrows=arrows.filter(a=>a.x>0&&a.x<480);
document.getElementById('sc').textContent=score;
ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,480,360);ctx.fillStyle='#3a2c2f';ctx.fillRect(40,180,40,40);ctx.fillStyle=castle.hp>50?'#8b0000':'#ff4500';ctx.fillRect(40,220,40,40);ctx.fillStyle='#d9a08f';ctx.font='13px sans-serif';ctx.fillText('HP '+castle.hp,40,280);towers.forEach(t=>{ctx.fillStyle='#b02a2a';ctx.fillRect(t.x-10,t.y-10,20,20)});enemies.forEach(e=>{ctx.fillStyle='#5a8faf';ctx.fillRect(e.x-8,e.y-8,16,16);ctx.fillStyle='#fff';ctx.fillRect(e.x-8,e.y-12,e.hp/30*16,2)});arrows.forEach(a=>{ctx.fillStyle='#ffd9c8';ctx.fillRect(a.x-1,a.y-1,3,3)});raf=requestAnimationFrame(loop)}
function restart(){rset()}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();towers.push({x:(e.clientX-r.left)*(480/r.width),y:(e.clientY-r.top)*(360/r.height)})});
rset();
</script></body></html>
