<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>无尽跑酷</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,'PingFang SC',sans-serif;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#ffd9c8;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{font-size:19px;margin:10px 0 4px;letter-spacing:2px}
.hint{font-size:12px;opacity:.7;margin-bottom:6px}
canvas{background:#171421;border:1px solid #5a2424;border-radius:12px;max-width:96vw;max-height:68vh;touch-action:none}
.bar{font-size:13px;margin:8px 0}
.over{position:fixed;inset:0;background:rgba(10,6,8,.86);display:none;align-items:center;justify-content:center;z-index:9}
.over.show{display:flex}
.panel{text-align:center;padding:26px 38px;background:#1a0f12;border:1px solid #b02a2a;border-radius:16px}
.panel h2{font-size:24px;color:#ff6b6b;margin-bottom:8px}
.panel p{font-size:14px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 28px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;border:none;border-radius:999px;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.96)}
</style></head><body>
<h1>🏃 无尽跑酷</h1><div class="hint">点击/空格跳跃（可二段跳）· 躲避障碍</div>
<canvas id="c" width="360" height="480"></canvas>
<div class="bar">距离 <b id="ds">0</b> 米 · 最佳 <b id="best">0</b> 米</div>
<div class="over" id="over"><div class="panel"><h2 id="t"></h2><p id="s"></p><button class="btn" onclick="again()">再来一局</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=360,H=480;
let y=0,vy=0,jumps=0,dist=0,speed=6,obs=[],run=true,best=+(localStorage.getItem('runnerBest')||0);
document.getElementById('best').textContent=best;
function setup(){y=0;vy=0;jumps=0;dist=0;speed=6;obs=[];run=true}
function jump(){if(!run)return;if(y===0){vy=-11;jumps=1}else if(jumps<2){vy=-10;jumps++}}
function tick(){
  if(!run)return;
  speed=6+dist/160;dist+=speed/12;document.getElementById('ds').textContent=dist|0;
  vy+=.55;y+=vy;if(y>0){y=0;vy=0;jumps=0}
  if(Math.random()<.018)obs.push({x:W+20,w:16+Math.random()*14,h:22+Math.random()*22,air:Math.random()<.3});
  obs.forEach(o=>o.x-=speed);
  obs=obs.filter(o=>o.x>-30);
  obs.forEach(o=>{
    const px=60,py=H-78-y;
    if(!o.air&&px+16>o.x&&px-16<o.x+o.w&&py+34>H-78-o.h){end()}
    if(o.air&&px+16>o.x&&px-16<o.x+o.w&&py<H-168&&py+34>H-168+o.h){end()}
  });
  draw();
}
function end(){
  run=false;
  const d=dist|0;
  if(d>best){best=d;localStorage.setItem('runnerBest',best);document.getElementById('best').textContent=best}
  show('💥 撞到了','跑了 '+d+' 米 · 最佳 '+best+' 米');
}
function draw(){
  ctx.fillStyle='#171421';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#333';for(let i=0;i<W;i+=40){const x=(i-dist*3)%(W+40)-20;ctx.beginPath();ctx.moveTo(x,H-80);ctx.lineTo(x,H-20);ctx.stroke()}
  ctx.fillStyle='#3a2a2f';ctx.fillRect(0,H-80,W,80);
  const px=60,py=H-78-y;
  ctx.fillStyle='#ffd9c8';ctx.fillRect(px-12,py-28,24,28);
  ctx.fillStyle='#ffd9c8';ctx.beginPath();ctx.arc(px,py-32,11,0,7);ctx.fill();
  ctx.fillStyle='#b02a2a';ctx.fillRect(px-16,py-6,6,6);ctx.fillRect(px+10,py-6,6,6);
  ctx.fillStyle='#222';ctx.fillRect(px-12,py,24,7);ctx.fillRect(px-8,py+5,6,10);ctx.fillRect(px+2,py+5,6,10);
  obs.forEach(o=>{
    ctx.fillStyle=o.air?'#8a6a3a':'#b02a2a';
    if(o.air)ctx.fillRect(o.x,H-168+o.h-o.h,o.w,o.h);
    else ctx.fillRect(o.x,H-80-o.h,o.w,o.h);
  });
}
cv.addEventListener('pointerdown',jump);
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump()}});
function show(t,s){document.getElementById('t').textContent=t;document.getElementById('s').textContent=s;document.getElementById('over').classList.add('show')}
function again(){document.getElementById('over').classList.remove('show');setup()}
setup();setInterval(tick,16);
</script></body></html>
