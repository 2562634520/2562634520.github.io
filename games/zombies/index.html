<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>丧尸围城</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,'PingFang SC',sans-serif;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#ffd9c8;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{font-size:19px;margin:10px 0 4px;letter-spacing:2px}
.hint{font-size:12px;opacity:.7;margin-bottom:6px}
canvas{background:#101614;border:1px solid #5a2424;border-radius:12px;max-width:96vw;max-height:68vh;touch-action:none}
.bar{font-size:13px;margin:8px 0}
.over{position:fixed;inset:0;background:rgba(10,6,8,.86);display:none;align-items:center;justify-content:center;z-index:9}
.over.show{display:flex}
.panel{text-align:center;padding:26px 38px;background:#1a0f12;border:1px solid #b02a2a;border-radius:16px}
.panel h2{font-size:24px;color:#ff6b6b;margin-bottom:8px}
.panel p{font-size:14px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 28px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;border:none;border-radius:999px;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.96)}
</style></head><body>
<h1>🧟 丧尸围城</h1><div class="hint">点击射击丧尸 · 守住 60 秒</div>
<canvas id="c" width="360" height="480"></canvas>
<div class="bar">击杀 <b id="kl">0</b> · 生命 <b id="hp">100</b> · 剩余 <b id="tm">60</b> 秒</div>
<div class="over" id="over"><div class="panel"><h2 id="t"></h2><p id="s"></p><button class="btn" onclick="again()">再来一局</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=360,H=480;
let zs=[],hp=100,kills=0,time=60,run=true,bullets=[],spawn=0;
function setup(){zs=[];hp=100;kills=0;time=60;run=true;bullets=[];spawn=0}
function tick(){
  if(!run)return;
  time-=.016;if(time<=0){time=0;run=false;show('🏰 守住了！','击杀 '+kills+' 只丧尸')}
  document.getElementById('tm').textContent=Math.ceil(time);
  spawn++;
  if(spawn>Math.max(25,80-time*1.2)){spawn=0;const side=Math.random()<.5;
    zs.push({x:side?0:W,y:40+Math.random()*(H-80),hp:2,sp:Math.random()*.6+.6});}
  zs.forEach(z=>{const dx=180-z.x,dy=250-z.y,d=Math.hypot(dx,dy)||1;z.x+=dx/d*z.sp;z.y+=dy/d*z.sp});
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--});
  bullets=bullets.filter(b=>b.life>0);
  bullets.forEach(b=>{zs.forEach(z=>{if(Math.hypot(z.x-b.x,z.y-b.y)<16){z.hp--;b.life=0}})});
  zs=zs.filter(z=>z.hp>0?true:(kills++,document.getElementById('kl').textContent=kills,false));
  zs.forEach(z=>{if(Math.hypot(z.x-180,z.y-250)<26){hp=Math.max(0,hp-15);document.getElementById('hp').textContent=hp;z.x=z.x<180?-40:W+40;if(hp<=0){run=false;show('🧟 被包围了','坚持了 '+(60-Math.ceil(time))+' 秒 · 击杀 '+kills)}}});
  draw();
}
function draw(){
  ctx.fillStyle='#101614';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#b02a2a';ctx.fillRect(150,220,60,60);
  ctx.fillStyle='#ffd9c8';ctx.fillRect(162,232,36,36);ctx.fillRect(160,222,8,8);ctx.fillRect(192,222,8,8);
  ctx.strokeStyle='#5a6a5a';ctx.lineWidth=3;ctx.strokeRect(140,210,80,80);
  zs.forEach(z=>{
    ctx.fillStyle='#4a8a5a';ctx.fillRect(z.x-9,z.y-9,18,18);
    ctx.fillStyle='#b02a2a';ctx.fillRect(z.x-4,z.y-6,3,3);ctx.fillRect(z.x+1,z.y-6,3,3);
    ctx.fillStyle=z.hp>1?'#8ac89a':'#c8e8d0';ctx.fillRect(z.x-10,z.y-16,20*Math.max(0,z.hp)/2,3);
  });
  bullets.forEach(b=>{ctx.fillStyle='#ffe9a8';ctx.beginPath();ctx.arc(b.x,b.y,3,0,7);ctx.fill()});
}
cv.addEventListener('pointerdown',e=>{
  if(!run)return;
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const dx=x-180,dy=y-250,d=Math.hypot(dx,dy)||1;
  bullets.push({x:180,y:250,vx:dx/d*9,vy:dy/d*9,life:50});
});
function show(t,s){document.getElementById('t').textContent=t;document.getElementById('s').textContent=s;document.getElementById('over').classList.add('show')}
function again(){document.getElementById('over').classList.remove('show');setup()}
setup();setInterval(tick,16);
</script></body></html>
