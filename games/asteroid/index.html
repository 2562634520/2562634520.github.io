<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>陨石追击</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,'PingFang SC',sans-serif;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#ffd9c8;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{font-size:19px;margin:10px 0 4px;letter-spacing:2px}
.hint{font-size:12px;opacity:.7;margin-bottom:6px}
canvas{background:#171421;border:1px solid #5a2424;border-radius:12px;max-width:96vw;max-height:70vh;touch-action:none}
.bar{font-size:13px;margin:8px 0}
.over{position:fixed;inset:0;background:rgba(10,6,8,.86);display:none;align-items:center;justify-content:center;z-index:9}
.over.show{display:flex}
.panel{text-align:center;padding:26px 38px;background:#1a0f12;border:1px solid #b02a2a;border-radius:16px}
.panel h2{font-size:24px;color:#ff6b6b;margin-bottom:8px}
.panel p{font-size:14px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 28px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;border:none;border-radius:999px;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.96)}
</style></head><body>
<h1>☄️ 陨石追击</h1><div class="hint">移动战机躲避陨石 · 点击射击 · 击碎陨石得分</div>
<canvas id="c" width="360" height="440"></canvas>
<div class="bar">得分 <b id="score">0</b> · 生命 <b id="life">3</b></div>
<div class="over" id="over"><div class="panel"><h2 id="t"></h2><p id="s"></p><button class="btn" onclick="again()">再来一局</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=360,H=440;
let px=W/2,py=H-50,bullets=[],rocks=[],score=0,life=3,run=true,shoot=0;
function setup(){px=W/2;py=H-50;bullets=[];rocks=[];score=0;life=3;run=true}
function fire(){if(!run)return;bullets.push({x:px,y:py-22});shoot=1}
function tick(){if(!run)return;
if(Math.random()<.02)rocks.push({x:20+Math.random()*(W-40),y:-16,r:12+Math.random()*14,vy:2+Math.random()*1.6,vx:(Math.random()-.5)*1.2});
rocks.forEach(r=>{r.y+=r.vy;r.x+=r.vx});
bullets.forEach(b=>b.y-=7);
for(let b of bullets)for(let r of rocks){
if(Math.abs(b.x-r.x)<r.r+4&&Math.abs(b.y-r.y)<r.r+4){b.dead=true;r.dead=true;score+=10;
if(r.r>18){rocks.push({x:r.x,y:r.y,r:12,vy:r.vy+1,vx:-1.5});rocks.push({x:r.x,y:r.y,r:12,vy:r.vy+1,vx:1.5})}}}
for(let r of rocks){if(Math.abs(r.x-px)<r.r+12&&Math.abs(r.y-py)<r.r+14){r.dead=true;life--;document.getElementById('life').textContent=life;
if(life<=0){run=false;show('💥 战机坠毁','得分 '+score);return}}}
bullets=bullets.filter(b=>!b.dead&&b.y>0);rocks=rocks.filter(r=>!r.dead&&r.y<H+30);
document.getElementById('score').textContent=score;draw()}
function draw(){ctx.fillStyle='#171421';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#ffd9c8';ctx.font='18px sans-serif';ctx.textAlign='center';
rocks.forEach(r=>{ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.y*.05);ctx.fillStyle='#8a6a3a';ctx.beginPath();ctx.moveTo(0,-r.r);ctx.lineTo(r.r*.8,-r.r*.3);ctx.lineTo(r.r*.5,r.r*.8);ctx.lineTo(-r.r*.5,r.r*.8);ctx.lineTo(-r.r*.8,-r.r*.3);ctx.closePath();ctx.fill();ctx.restore()});
bullets.forEach(b=>{ctx.fillStyle='#ffd9c8';ctx.fillRect(b.x-2,b.y-8,4,12)});
ctx.fillStyle='#d64545';ctx.beginPath();ctx.moveTo(px,py-24);ctx.lineTo(px-16,py+14);ctx.lineTo(px,py+4);ctx.lineTo(px+16,py+14);ctx.closePath();ctx.fill()}
cv.addEventListener('pointermove',e=>{let r=cv.getBoundingClientRect();px=Math.max(16,Math.min(W-16,(e.clientX-r.left)*(W/r.width)));py=Math.max(30,Math.min(H-30,(e.clientY-r.top)*(H/r.height)))});
cv.addEventListener('pointerdown',fire);
function show(t,s){document.getElementById('t').textContent=t;document.getElementById('s').textContent=s;document.getElementById('over').classList.add('show')}
function again(){document.getElementById('over').classList.remove('show');setup()}
again();setInterval(tick,16);
</script></body></html>
