<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>拳击擂台</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,'PingFang SC',sans-serif;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#ffd9c8;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{font-size:19px;margin:10px 0 4px;letter-spacing:2px}
.hint{font-size:12px;opacity:.7;margin-bottom:6px}
canvas{background:#1b1114;border:1px solid #5a2424;border-radius:12px;max-width:96vw;max-height:66vh;touch-action:none}
.bar{font-size:13px;margin:8px 0;text-align:center}
.btns{display:flex;gap:10px}
.btn2{width:130px;padding:12px 0;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;border:none;border-radius:12px;font-size:15px;cursor:pointer}
.btn2:active{transform:scale(.96)}
.over{position:fixed;inset:0;background:rgba(10,6,8,.86);display:none;align-items:center;justify-content:center;z-index:9}
.over.show{display:flex}
.panel{text-align:center;padding:26px 38px;background:#1a0f12;border:1px solid #b02a2a;border-radius:16px}
.panel h2{font-size:24px;color:#ff6b6b;margin-bottom:8px}
.panel p{font-size:14px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 28px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;border:none;border-radius:999px;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.96)}
</style></head><body>
<h1>🥊 拳击擂台</h1><div class="hint">45 秒击倒对手 · 点【出拳】进攻 · 对手出拳时点【闪避】</div>
<canvas id="c" width="360" height="440"></canvas>
<div class="btns"><button class="btn2" id="punch">👊 出拳</button><button class="btn2" id="dodge">💨 闪避</button></div>
<div class="bar">剩余 <b id="tm">45</b> 秒 · 你命中 <b id="hits">0</b> 拳</div>
<div class="over" id="over"><div class="panel"><h2 id="t"></h2><p id="s"></p><button class="btn" onclick="again()">再来一局</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=360,H=440;
let php=100,ehp=100,time=45,hits=0,run=true,punchCd=0,atkCd=0,dodging=false,atkWind=0,flash=0;
function setup(){php=100;ehp=100;time=45;hits=0;run=true;punchCd=0;atkCd=0;dodging=false;atkWind=0;flash=0;document.getElementById('tm').textContent=45;document.getElementById('hits').textContent=0}
function tick(){
  if(!run)return;
  time-=.016;if(time<=0){time=0;run=false;show(ehp<=php?'🥊 你赢了！':'😅 点数惜败','你命中 '+hits+' 拳，对手血量 '+Math.max(0,ehp|0)+'%');return}
  document.getElementById('tm').textContent=Math.ceil(time);
  punchCd--;atkCd--;flash--;
  if(atkCd<=0&&php>0){
    atkWind=22;atkCd=45+Math.random()*35;
  }
  if(atkWind>0){
    atkWind--;
    if(atkWind===0&&!dodging){php=Math.max(0,php-8+Math.random()*7)}
  }
  dodging=false;
  draw();
}
document.getElementById('punch').addEventListener('pointerdown',()=>{
  if(!run||punchCd>0)return;punchCd=18;flash=6;
  if(atkWind>0&&!dodging){ehp-=18;hits++;document.getElementById('hits').textContent=hits;atkWind=0}
  else ehp-=6;
  if(ehp<=0){run=false;show('🥊 KO！你赢了！','你命中 '+hits+' 拳')}
});
document.getElementById('dodge').addEventListener('pointerdown',()=>{if(run)dodging=true});
function draw(){
  ctx.fillStyle='#1b1114';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#8a3a3a';ctx.lineWidth=3;ctx.strokeRect(8,8,W-16,H-16);
  ctx.strokeStyle='#5a2424';for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(8,i*H/5);ctx.lineTo(W-8,i*H/5);ctx.stroke()}
  drawFighter(90,320,'#ffd9c8','你',dodging);
  drawFighter(280,320,'#e0342e','对手',atkWind>0);
  ctx.fillStyle='#ffd9c8';ctx.font='12px sans-serif';ctx.textAlign='center';
  ctx.fillText('你',90,420);ctx.fillText('对手',280,420);
  hpBar(20,30,php,'#57c785');hpBar(20,52,ehp,'#e0342e');
  if(flash>0){ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(0,0,W,H)}
}
function drawFighter(x,y,c,label,attacking){
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,24,0,7);ctx.fill();
  ctx.fillStyle='#221417';ctx.fillRect(x-10,y+20,20,34);
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(x-14,y-16,8,0,7);ctx.fill();ctx.beginPath();ctx.arc(x+14,y-16,8,0,7);ctx.fill();
  if(attacking){ctx.strokeStyle='#ff6b6b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y+12);ctx.lineTo(x+45,y-8);ctx.stroke()}
}
function hpBar(x,y,v,color){
  ctx.fillStyle='#3a2226';ctx.fillRect(x,y,140,14);
  ctx.fillStyle=color;ctx.fillRect(x,y,140*Math.max(0,v)/100,14);
  ctx.strokeStyle='#fff6';ctx.strokeRect(x,y,140,14);
}
function show(t,s){document.getElementById('t').textContent=t;document.getElementById('s').textContent=s;document.getElementById('over').classList.add('show')}
function again(){document.getElementById('over').classList.remove('show');setup()}
setup();setInterval(tick,16);
</script></body></html>
