<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎯 射击打靶</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>🎯 射击打靶</h1><canvas id="cv"></canvas>
<div class="info">得分 <b id="sc">0</b> · 子弹 <b id="bl">12</b></div>
<div class="hint">点击射击靶子 · 别打蓝色好人 · 红色大靶 +5 小靶 +10</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function size(){W=Math.min(innerWidth-24,440);H=Math.floor(W*.7);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
let over=false,score=0,bullets=12,targets=[],tick=0,aim={x:W/2,y:H/2};
function init(){over=false;score=0;bullets=12;targets=[];tick=0;aim={x:W/2,y:H/2};document.getElementById('sc').textContent='0';document.getElementById('bl').textContent='12';document.querySelector('.over').classList.remove('show');loop()}
function spawn(){const r=Math.random();if(r<.6)targets.push({x:40+Math.random()*(W-80),y:40+Math.random()*(H-90),r:16+Math.random()*12,life:160,bad:false});else if(r<.8)targets.push({x:40+Math.random()*(W-80),y:40+Math.random()*(H-90),r:12,bad:true,life:120})}
cv.addEventListener('pointermove',e=>{if(over)return;const r=cv.getBoundingClientRect();aim.x=e.clientX-r.left;aim.y=e.clientY-r.top});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(over)return;const r=cv.getBoundingClientRect();aim.x=e.touches[0].clientX-r.left;aim.y=e.touches[0].clientY-r.top},{passive:false});
cv.addEventListener('pointerdown',()=>{if(over||bullets<=0)return;bullets--;document.getElementById('bl').textContent=bullets;let hit=false;for(const tg of targets){if(tg.dead)continue;if(Math.hypot(aim.x-tg.x,aim.y-tg.y)<tg.r+8){if(tg.bad){over=true;msg.textContent='打到好人，游戏结束！得分 '+score;document.querySelector('.over').classList.add('show')}else{score+=tg.r>22?5:10;document.getElementById('sc').textContent=score}tg.dead=true;hit=true;break}}
if(!hit&&targets.length&&!targets.some(t=>t.bad&&!t.dead&&Math.hypot(aim.x-t.x,aim.y-t.y)<t.r+8)){}draw()});
function step(){if(over)return;tick++;if(tick%42===0)spawn();for(const tg of targets){if(!tg.dead)tg.life--}targets=targets.filter(t=>!t.dead&&t.life>0);
if(bullets<=0&&targets.every(t=>t.dead)){over=true;msg.textContent='子弹用完，得分 '+score;document.querySelector('.over').classList.add('show')}
draw();requestAnimationFrame(step)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#18120f';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#5a2b2b';ctx.lineWidth=2;ctx.strokeRect(2,2,W-4,H-4);
for(const tg of targets){if(tg.dead)continue;if(tg.bad){ctx.fillStyle='#4a9ede';ctx.beginPath();ctx.arc(tg.x,tg.y,tg.r,0,7);ctx.fill();ctx.fillStyle='#ffd9c8';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('好人',tg.x,tg.y+4)}else{ctx.fillStyle='#b02a2a';ctx.beginPath();ctx.arc(tg.x,tg.y,tg.r,0,7);ctx.fill();ctx.fillStyle='#ffd9c8';ctx.beginPath();ctx.arc(tg.x,tg.y,tg.r*.6,0,7);ctx.fill();ctx.fillStyle='#d64545';ctx.beginPath();ctx.arc(tg.x,tg.y,tg.r*.25,0,7);ctx.fill()}}
ctx.strokeStyle='#ffd9c8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(aim.x-12,aim.y);ctx.lineTo(aim.x+12,aim.y);ctx.moveTo(aim.x,aim.y-12);ctx.lineTo(aim.x,aim.y+12);ctx.stroke();
ctx.fillStyle='#ffd9c8';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText('得分 '+score,12,24);ctx.textAlign='right';ctx.fillText('子弹 '+bullets,W-12,24)}
function restart(){init()}
let running=false;function loop(){if(running)return;running=true;step()}
init();

</script></body></html>
