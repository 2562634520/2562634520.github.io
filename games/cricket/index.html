<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🏏 板球对决</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🏏 板球对决</h1><div class="score">得分 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=480*dpr;cv.height=360*dpr;cv.style.width=Math.min(480,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let ball,bat,score,alive,raf,tick;
function rset(){ball=null;bat={x:240};score=0;tick=0;alive=true;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){if(!alive)return;tick++;if(tick%80===0&&!ball)ball={x:240,y:0,vx:Math.random()*4-2,vy:2};
if(ball){ball.vy+=.2;ball.x+=ball.vx;ball.y+=ball.vy;if(ball.y>320){if(Math.abs(ball.x-bat.x)<40){const power=Math.abs(ball.vx)+2;ball.vy=-6-power;ball.vx=Math.random()*6-3;score+=Math.floor(power*2);if(score>=50){{document.getElementById('msg').textContent='得分 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('cricketBest',Math.max(parseInt(localStorage.getItem('cricketBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}}else ball=null}if(ball.y>400)ball=null}
document.getElementById('sc').textContent=score;
ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,480,360);ctx.fillStyle='#3a2c2f';ctx.fillRect(0,340,480,20);ctx.fillStyle='#d9a08f';ctx.fillRect(bat.x-30,bat.y-5,60,5);if(ball){ctx.fillStyle='#b02a2a';ctx.beginPath();ctx.arc(ball.x,ball.y,8,0,7);ctx.fill()}raf=requestAnimationFrame(loop)}
function restart(){rset()}
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();bat.x=(e.clientX-r.left)*(480/r.width)});
rset();
</script></body></html>
