<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🫧 泡泡危机</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🫧 泡泡危机</h1><div class="score">得分 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=480*dpr;cv.height=360*dpr;cv.style.width=Math.min(480,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let player,arrows,balls,score,alive,raf;
function rset(){player={x:240};arrows=[];balls=[];score=0;alive=true;for(let i=0;i<10;i++){const r=20+Math.random()*30;balls.push({x:Math.random()*440+20,y:Math.random()*150,r})}document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){if(!alive)return;arrows.forEach(a=>a.y-=8);arrows=arrows.filter(a=>a.y>0);balls.forEach(b=>{b.x+=Math.sin(b.y/30)*b.r/30;b.y+=b.r/200;if(b.y>360){{document.getElementById('msg').textContent='得分 '+Math.floor(score);document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),Math.floor(score));localStorage.setItem('bubbletroubleBest',Math.max(parseInt(localStorage.getItem('bubbletroubleBest')||0),Math.floor(score)));document.querySelector('.over').classList.add('show');alive=false};return}for(let i=arrows.length-1;i>=0;i--){const a=arrows[i];if(Math.hypot(a.x-b.x,a.y-b.y)<b.r){b.r-=5;if(b.r<10){score+=5;balls.splice(balls.indexOf(b),1);if(balls.length===0)for(let j=0;j<15;j++)balls.push({x:Math.random()*440+20,y:Math.random()*150,r:10+Math.random()*30})}arrows.splice(i,1);break}}});
score+=0.1;document.getElementById('sc').textContent=Math.floor(score);
ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,480,360);balls.forEach(b=>{ctx.fillStyle='hsla('+(b.r*6)+',60%,50%,.7)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.stroke()});arrows.forEach(a=>{ctx.fillStyle='#ffd9c8';ctx.fillRect(a.x-2,a.y,4,12)});ctx.fillStyle='#b02a2a';ctx.fillRect(player.x-15,335,30,20);raf=requestAnimationFrame(loop)}
function restart(){rset()}
function shoot(x){player.x=x;arrows.push({x,y:325})}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();shoot((e.clientX-r.left)*(480/r.width))});
rset();
</script></body></html>
