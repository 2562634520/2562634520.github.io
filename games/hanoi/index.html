<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>汉诺塔</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}
.board{display:flex;gap:8px;width:min(96vw,460px);align-items:flex-end;justify-content:center;padding-top:8px}
.rod{flex:1;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;padding:8px 6px 0;min-height:240px;cursor:pointer;border-top:3px solid transparent;border-radius:0 0 12px 12px;transition:.18s}
.rod.sel{border-color:#d64545;background:#b02a2a14}
.rod:after{content:'';width:100%;height:8px;background:#8f3029;border-radius:4px;margin-top:auto}
.disc{height:26px;border-radius:7px;box-shadow:inset 0 -4px 8px #0004}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
</style></head><body>
<div class="wrap"><h1>🥢 汉诺塔</h1><div class="score">步数 <b id="mv">0</b> · 最少 <span id="min">31</span> 步</div>
<div class="board" id="board"></div><div class="hint">点选柱子取盘，再点另一根柱子放下 · 大盘不能压小盘</div></div>
<div class="over"><div class="panel"><b id="msg">通关！</b><button class="btn" onclick="start()">再来一局</button></div></div>
<script>
const N=5,DISCS=Array.from({length:N},(_,i)=>N-i);
const COLORS=['#e05a4e','#c0392b','#8e2b28','#b8860b','#d9a52b'];
let rods=[],sel=-1,moves=0;
const board=document.getElementById('board');
function start(){rods=[DISCS.slice(),[],[]];sel=-1;moves=0;document.querySelector('.over').classList.remove('show');sync();render()}
function sync(){document.getElementById('mv').textContent=moves}
function render(){board.innerHTML='';rods.forEach((r,i)=>{const d=document.createElement('div');d.className='rod'+(i===sel?' sel':'');d.onclick=()=>tap(i);r.forEach(disc=>{const b=document.createElement('div');b.className='disc';b.style.width=(18+disc*15)+'%';b.style.background=COLORS[disc-1];d.appendChild(b)});board.appendChild(d)})}
function tap(i){if(sel<0){if(rods[i].length){sel=i;render()}return}
if(sel===i){sel=-1;render();return}
const src=rods[sel],dst=rods[i];
if(!dst.length||dst[dst.length-1]>src[src.length-1]){dst.push(src.pop());moves++;sel=-1;sync();render();checkWin()}
else{sel=-1;render()}}
function checkWin(){if(rods[2].length===N){document.getElementById('msg').textContent='用 '+moves+' 步通关！'+(moves<=31?'（最优！）':'');document.querySelector('.over').classList.add('show')}}
start();
</script></body></html>
