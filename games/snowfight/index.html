<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>❄️ 打雪仗</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>❄️ 打雪仗</h1><canvas id="cv"></canvas>
<div class="info">得分 <b id="sc">0</b> · 生命 <b id="lv">5</b></div>
<div class="hint">移动鼠标瞄准，点击发射雪球消灭雪人</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function size(){W=Math.min(innerWidth-24,440);H=Math.floor(W*.78);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
let over=false,score=0,life=5,aim={x:0,y:0},balls=[],enemy=[],tick=0,t=0;
function init(){over=false;score=0;life=5;aim={x:W/2,y:H-90};balls=[];enemy=[];tick=0;t=0;document.getElementById('sc').textContent='0';document.getElementById('lv').textContent='5';document.querySelector('.over').classList.remove('show');loop()}
cv.addEventListener('pointermove',e=>{if(over)return;const r=cv.getBoundingClientRect();aim.x=e.clientX-r.left;aim.y=e.clientY-r.top});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(over)return;const r=cv.getBoundingClientRect();aim.x=e.touches[0].clientX-r.left;aim.y=e.touches[0].clientY-r.top},{passive:false});
cv.addEventListener('pointerdown',()=>{if(over)return;const a=Math.atan2(aim.y-(H-70),aim.x-(W/2));balls.push({x:W/2,y:H-70,vx:Math.cos(a)*9,vy:Math.sin(a)*9})});
function step(){if(over)return;t++;tick++;if(tick%55===0){const ex=50+Math.random()*(W-100);enemy.push({x:ex,y:30,hp:2,vx:0,t:0})}
for(const e of enemy){e.t+=.02;e.x+=Math.sin(e.t)*1.4;if(Math.random()<.008)enemy.push({x:e.x,y:e.y+30,hp:1,vx:0,t:0})}
for(const b of balls){b.x+=b.vx;b.y+=b.vy;b.vy+=.12;for(const e of enemy){if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<18){e.hp--;b.dead=true;if(e.hp<=0){score++;document.getElementById('sc').textContent=score}break}}}
balls=balls.filter(b=>!b.dead&&b.x>-20&&b.x<W+20&&b.y<H+20);
for(const e of enemy){if(e.hp>0&&e.y>H-95&&Math.abs(e.x-W/2)<30){life--;document.getElementById('lv').textContent=life;e.hp=0;if(life<=0){over=true;msg.textContent='被雪球击中！得分 '+score;document.querySelector('.over').classList.add('show')}}}
enemy=enemy.filter(e=>e.hp>0&&e.y<H+50);
draw();requestAnimationFrame(step)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#10141c';ctx.fillRect(0,0,W,H);ctx.fillStyle='#e8f4ff';ctx.fillRect(0,H-40,W,40);ctx.strokeStyle='#8a9ab0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,H-70);ctx.lineTo(W,H-70);ctx.stroke();
for(const e of enemy){if(e.hp<=0)continue;ctx.fillStyle='#8fa8c8';ctx.beginPath();ctx.arc(e.x,e.y-8,10,0,7);ctx.arc(e.x-9,e.y+4,10,0,7);ctx.arc(e.x+9,e.y+4,10,0,7);ctx.fill()}
for(const b of balls){ctx.fillStyle='#dfeaf5';ctx.beginPath();ctx.arc(b.x,b.y,6,0,7);ctx.fill()}
ctx.fillStyle='#b02a2a';ctx.beginPath();ctx.arc(W/2,H-55,18,0,7);ctx.fill();ctx.fillStyle='#ffd9c8';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('你',W/2,H-50);
ctx.fillStyle='#ffd9c8';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText('得分 '+score,12,24);ctx.textAlign='right';ctx.fillText('生命 '+life,W-12,24)}
function restart(){init()}
let running=false;function loop(){if(running)return;running=true;step()}
init();

</script></body></html>
