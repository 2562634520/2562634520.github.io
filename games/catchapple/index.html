<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🍎 接苹果</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>🍎 接苹果</h1><canvas id="cv"></canvas>
<div class="info">得分 <b id="sc">0</b> · 生命 <b id="lv">3</b></div>
<div class="hint">移动篮子接苹果 · 金色苹果 +5 · 别接棕色烂苹果</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function size(){W=Math.min(innerWidth-24,400);H=Math.floor(W*1.2);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
let over=false,score=0,lives=3,basket={x:0},items=[],tick=0,level=1;
function init(){over=false;score=0;lives=3;basket={x:W/2};items=[];tick=0;level=1;document.getElementById('sc').textContent='0';document.getElementById('lv').textContent='3';document.querySelector('.over').classList.remove('show');loop()}
function spawn(){const r=Math.random();const kind=r<.72?'apple':(r<.88?'gold':'rot');items.push({x:15+Math.random()*(W-30),y:-18,vy:2.2+Math.random()*1.4+level*.15,kind,dead:false})}
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();basket.x=e.clientX-r.left});
cv.addEventListener('touchmove',e=>{e.preventDefault();const r=cv.getBoundingClientRect();basket.x=e.touches[0].clientX-r.left},{passive:false});
function step(){if(over)return;tick++;if(tick%32===0)spawn();
for(const it of items){it.y+=it.vy;if(it.y>H-62&&Math.abs(it.x-basket.x)<48){if(it.kind==='apple'){score+=1;document.getElementById('sc').textContent=score}else if(it.kind==='gold'){score+=5;document.getElementById('sc').textContent=score}else{lives--;document.getElementById('lv').textContent=lives;if(lives<=0){over=true;msg.textContent='接住烂苹果！得分 '+score;document.querySelector('.over').classList.add('show')}}it.dead=true}if(it.y>H+20)it.dead=true}
items=items.filter(i=>!i.dead);if(score>=level*15)level++;
draw();requestAnimationFrame(step)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#142010';ctx.fillRect(0,0,W,H);
for(const it of items){if(it.dead)continue;if(it.kind==='apple'){ctx.fillStyle='#d64545';ctx.beginPath();ctx.arc(it.x,it.y,13,0,7);ctx.fill();ctx.fillStyle='#57c96e';ctx.beginPath();ctx.moveTo(it.x,it.y-12);ctx.lineTo(it.x+7,it.y-20);ctx.lineTo(it.x-4,it.y-17);ctx.fill()}else if(it.kind==='gold'){ctx.fillStyle='#ffc93c';ctx.beginPath();ctx.arc(it.x,it.y,13,0,7);ctx.fill();ctx.fillStyle='#ffd9c8';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('5',it.x,it.y+4)}else{ctx.fillStyle='#7a5a3a';ctx.beginPath();ctx.arc(it.x,it.y,13,0,7);ctx.fill()}}
const bx=basket.x;ctx.fillStyle='#b8860b';ctx.fillRect(bx-46,H-66,92,12);ctx.fillStyle='#e8a13c';ctx.fillRect(bx-42,H-54,84,22);ctx.strokeStyle='#8f5a00';ctx.strokeRect(bx-42,H-54,84,22);
ctx.fillStyle='#ffd9c8';ctx.font='bold 16px sans-serif';ctx.textAlign='left';ctx.fillText('得分 '+score,12,24);ctx.textAlign='right';ctx.fillText('生命 '+lives,W-12,24)}
function restart(){init()}
let running=false;function loop(){if(running)return;running=true;step()}
init();

</script></body></html>
