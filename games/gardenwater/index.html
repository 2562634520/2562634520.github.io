<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🌷 浇花</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🌷 浇花</h1><div class="score">花朵 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=420*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let flowers,water,score,alive,raf;
function rset(){flowers=[];for(let i=0;i<9;i++)flowers.push({x:60+i%3*110,y:140+Math.floor(i/3)*100,w:60,h:60,grow:0,wilted:false});water=100;score=0;alive=true;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,420);flowers.forEach(f=>{ctx.fillStyle=f.wilted?'#5a3a1a':'#7aaa55';ctx.fillRect(f.x+25,f.y+50,10,20);ctx.fillStyle=f.wilted?'#666':'#d64545';ctx.beginPath();ctx.arc(f.x+30,f.y+30+f.grow,15+f.grow/3,0,Math.PI*2);ctx.fill();f.grow=Math.min(8,f.grow+(water>30?.05:-.03));if(f.grow>=8&&!f.wilted){score++;f.wilted=true;setTimeout(()=>{f.grow=0;f.wilted=false},1500)}});
ctx.fillStyle='#ffd9c8';ctx.font='11px sans-serif';ctx.fillText('水: '+Math.floor(water)+'%',15,30);ctx.fillText('点击加水 / 长按洒水',15,46);water=Math.max(0,water-.02);
if(water<=0){alive=false;{document.getElementById('msg').textContent='开花 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('gardenwaterBest',Math.max(parseInt(localStorage.getItem('gardenwaterBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}
raf=requestAnimationFrame(loop)}
function addWater(){water=Math.min(100,water+5)}
function restart(){rset()}
cv.addEventListener('pointerdown',addWater);
rset();
</script></body></html>
