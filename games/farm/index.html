<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>开心农场</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,'PingFang SC',sans-serif;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#ffd9c8;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{font-size:19px;margin:10px 0 4px;letter-spacing:2px}
.hint{font-size:12px;opacity:.7;margin-bottom:6px}
.wrap{width:96vw;max-width:420px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;justify-content:space-between;font-size:13px}
.plots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plot{aspect-ratio:1;background:linear-gradient(145deg,#3a2a1a,#241507);border:1px solid #6a4a2e;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;cursor:pointer;text-align:center;gap:2px}
.plot b{font-size:26px}
.shop{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seed{width:88px;padding:6px 2px;background:linear-gradient(145deg,#3a2424,#241517);border:1px solid #6a2e2e;border-radius:10px;text-align:center;font-size:12px;cursor:pointer}
.seed b{display:block;font-size:20px}
.over{position:fixed;inset:0;background:rgba(10,6,8,.86);display:none;align-items:center;justify-content:center;z-index:9}
.over.show{display:flex}
.panel{text-align:center;padding:26px 38px;background:#1a0f12;border:1px solid #b02a2a;border-radius:16px}
.panel h2{font-size:24px;color:#ff6b6b;margin-bottom:8px}
.panel p{font-size:14px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 28px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;border:none;border-radius:999px;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.96)}
</style></head><body>
<h1>🌾 开心农场</h1><div class="hint">买种子播种 → 等待生长 → 收获金币 → 目标 100 金币</div>
<div class="wrap">
  <div class="bar"><span>🪙 <b id="coins">20</b></span><span>目标 100 金币</span></div>
  <div class="plots" id="plots"></div>
  <div class="shop" id="shop"></div>
</div>
<div class="over" id="over"><div class="panel"><h2 id="t"></h2><p id="s"></p><button class="btn" onclick="again()">再来一局</button></div></div>
<script>
const SEEDS=[
{name:'🥕 萝卜',cost:5,grow:5,sell:12,icon:'🥕'},
{name:'🌽 玉米',cost:8,grow:8,sell:20,icon:'🌽'},
{name:'🍉 西瓜',cost:12,grow:12,sell:32,icon:'🍉'}];
let coins=20,plots=Array(9).fill(null),tickN=0,run=true;
function render(){document.getElementById('coins').textContent=coins;
let p=document.getElementById('plots');p.innerHTML='';
plots.forEach((pl,i)=>{let d=document.createElement('div');d.className='plot';
if(!pl)d.innerHTML='<span style="opacity:.45">空地块</span>';
else if(pl.stage===0){d.innerHTML='<b>🌱</b>'+pl.seed.name;d.onclick=()=>water(i)}
else if(pl.stage===1){d.innerHTML='<b>🌿</b>成长中…'+pl.left+'s'}
else{d.innerHTML='<b>'+pl.seed.icon+'</b>成熟！';d.onclick=()=>harvest(i)}
p.appendChild(d)});
let s=document.getElementById('shop');s.innerHTML='';
SEEDS.forEach((sd,i)=>{let d=document.createElement('div');d.className='seed';d.innerHTML='<b>'+sd.icon+'</b>'+sd.name+'<br>💰'+sd.cost;
d.onclick=()=>buy(i);s.appendChild(d)})}
function buy(i){let sd=SEEDS[i];let idx=plots.findIndex(x=>!x);if(idx<0)return;if(coins<sd.cost)return;coins-=sd.cost;
plots[idx]={seed:sd,stage:0};render()}
function water(i){let pl=plots[i];if(!pl||pl.stage!==0)return;pl.stage=1;pl.left=pl.seed.grow;render()}
function harvest(i){let pl=plots[i];if(!pl||pl.stage!==2)return;coins+=pl.seed.sell;plots[i]=null;render();
if(coins>=100){run=false;show('🎉 丰收大户','金币达到 '+coins+'，农场经营成功')}}
function tick(){tickN++;
plots.forEach(pl=>{if(pl&&pl.stage===1){pl.left-=1;if(pl.left<=0)pl.stage=2}});
render()}
function show(t,s){document.getElementById('t').textContent=t;document.getElementById('s').textContent=s;document.getElementById('over').classList.add('show')}
function again(){document.getElementById('over').classList.remove('show');coins=20;plots=Array(9).fill(null);run=true}
render();setInterval(tick,1000);
</script></body></html>
