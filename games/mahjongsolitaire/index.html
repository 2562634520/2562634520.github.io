<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🀄 麻将接龙</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🀄 麻将接龙</h1><div class="score">消牌 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=480*dpr;cv.height=360*dpr;cv.style.width=Math.min(480,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let tiles,score,alive,raf;
function rset(){const suits=['一','二','三','四','五','六','七','八','九'];tiles=[];for(let i=0;i<36;i++){tiles.push({sym:suits[i%9],x:30+(i%12)*35,y:30+Math.floor(i/12)*50,free:true,selected:false,removed:false});if(i>=12)tiles[tiles.length-1].free=false}score=0;alive=true;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,480,360);tiles.forEach((t)=>{if(!t.removed){ctx.fillStyle=t.selected?'#b02a2a':t.free?'#d9a08f':'#5a3a35';ctx.fillRect(t.x,t.y,30,40);ctx.strokeStyle='#3a2c2f';ctx.strokeRect(t.x,t.y,30,40);ctx.fillStyle='#0c0a0d';ctx.font='18px sans-serif';ctx.fillText(t.sym,t.x+6,t.y+28)}});ctx.fillStyle='#ffd9c8';ctx.font='14px sans-serif';ctx.fillText('消除 '+score,20,350);raf=requestAnimationFrame(loop)}
function restart(){rset()}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(480/r.width);const y=(e.clientY-r.top)*(360/r.height);const sel=[];tiles.forEach((t,i)=>{if(!t.removed&&t.free&&x>=t.x&&x<=t.x+30&&y>=t.y&&y<=t.y+40)sel.push(i)});if(sel.length){const i=sel[0];tiles[i].selected=!tiles[i].selected;const ss=tiles.filter(t=>t.selected&&!t.removed);if(ss.length===2){if(ss[0].sym===ss[1].sym){ss.forEach(t=>t.removed=true);tiles.forEach(t=>t.selected=false);score+=2;if(tiles.every(t=>t.removed)){{document.getElementById('msg').textContent='消除 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('mahjongsolitaireBest',Math.max(parseInt(localStorage.getItem('mahjongsolitaireBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}}else{tiles.forEach(t=>t.selected=false)}}}});
rset();
</script></body></html>
