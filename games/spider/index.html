<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🕷️ 蜘蛛纸牌</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🕷️ 蜘蛛纸牌</h1><div class="score">完牌 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=420*dpr;cv.height=360*dpr;cv.style.width=Math.min(420,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let cols,score,alive,raf;
function rset(){cols=Array(10).fill(0).map((_,i)=>{const n=Math.min(5+i,Math.floor(5+i*1.5));const arr=[];for(let j=0;j<n;j++)arr.push(Math.floor(Math.random()*4));return arr});score=0;alive=true;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function isComplete(c){if(c.length<13)return false;const groups={};for(let i=c.length-1;i>=0;i--){const v=c[i];groups[v]=(groups[v]||0)+1;if(groups[v]>=13){c.splice(i,14);return true}}return false}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,420,360);cols.forEach((c,i)=>{c.forEach((v,j)=>{ctx.fillStyle=['#b02a2a','#5a8faf','#d9a08f','#8b0000'][v];ctx.fillRect(10+i*40,20+j*15,36,12);ctx.strokeStyle='#3a2c2f';ctx.strokeRect(10+i*40,20+j*40,36,12)})});ctx.fillStyle='#ffd9c8';ctx.font='14px sans-serif';ctx.fillText('完 '+score,20,350);raf=requestAnimationFrame(loop)}
function restart(){rset()}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(420/r.width);const col=Math.floor((x-10)/40);if(col>=0&&col<10&&isComplete(cols[col])){score++;document.getElementById('sc').textContent=score;if(score>=5){{document.getElementById('msg').textContent='完牌 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('spiderBest',Math.max(parseInt(localStorage.getItem('spiderBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}}});
rset();
</script></body></html>
