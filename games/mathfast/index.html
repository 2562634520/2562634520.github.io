<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>口算冲刺</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
h1{font-size:22px;letter-spacing:.16em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f;display:flex;gap:20px}
#q{font-size:min(13vw,58px);font-weight:800;color:#ffd9c8;letter-spacing:.05em}
#ans{width:min(74vw,300px);padding:13px 18px;font-size:26px;background:#171215;border:2px solid #b02a2a77;border-radius:14px;color:#fff;outline:none;text-align:center}
#ans:focus{border-color:#d64545;box-shadow:0 0 18px #b02a2a44}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 38px}
.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:14px auto 0;padding:9px 28px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
</style></head><body>
<div class="wrap"><h1>➕ 口算冲刺</h1><div class="info"><span>得分 <b id="sc">0</b></span><span>时间 <b id="tm">30</b>s</span></div><div id="q"></div><input id="ans" inputmode="numeric" placeholder="答案" autocomplete="off"><div class="hint">30 秒答对越多越好 · 回车提交</div></div>
<div class="over"><div class="panel"><b>得分 <span id="finalsc">0</span></b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const q=document.getElementById('q'),ans=document.getElementById('ans');let score=0,time=30,timer=null,result=0;
function restart(){score=0;time=30;ans.value='';ans.disabled=false;document.getElementById('sc').textContent=0;document.getElementById('tm').textContent=30;document.querySelector('.over').classList.remove('show');clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('tm').textContent=time;if(time<=0){clearInterval(timer);ans.disabled=true;document.getElementById('finalsc').textContent=score;document.querySelector('.over').classList.add('show')}},1000);next();ans.focus()}
function next(){let op=['+','-','×'][Math.random()*3|0],a=1+Math.random()*20|0,b=1+Math.random()*20|0;if(op==='-'&&b>a)[a,b]=[b,a];if(op==='×'){a=2+Math.random()*9|0;b=2+Math.random()*9|0}result=op==='+'?a+b:op==='-'?a-b:a*b;q.textContent=a+' '+op+' '+b+' = ?';ans.value=''}
ans.addEventListener('keydown',e=>{if(e.key==='Enter'){if(parseInt(ans.value)===result){score++;document.getElementById('sc').textContent=score}next()}});
restart();
</script></body></html>
