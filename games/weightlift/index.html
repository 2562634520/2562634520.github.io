<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🏋️ 举重挑战</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>🏋️ 举重挑战</h1><canvas id="cv"></canvas>
<div class="info">得分 <b id="sc">0</b> · 轮次 <b id="rd">1</b></div>
<div class="hint">点击让杠铃上升，再点击锁定 · 对准灰色杠铃片接住</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function size(){W=Math.min(innerWidth-24,420);H=Math.floor(W*1.05);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
let over=false,power=0,target=0,targets=[],round=1,score=0,tick=0,bar={y:0},state='rise';
function init(){over=false;power=0;target=0;targets=[];round=1;score=0;tick=0;bar={y:H-100};state='rise';document.getElementById('sc').textContent='0';document.getElementById('rd').textContent='1';document.querySelector('.over').classList.remove('show');loop()}
function makeTargets(){targets=[];for(let i=0;i<5;i++)targets.push({x:40+Math.random()*(W-100),y:70+i*70,r:14,hit:false})}
cv.addEventListener('pointerdown',()=>{if(over)return;if(state==='rise'){state='hold';target=bar.y}else if(state==='hold'){state='rise'}});
function step(){if(over)return;tick++;
if(state==='rise'){bar.y-=2.2;if(bar.y<50){state='hold';target=bar.y}}else if(state==='hold'){bar.y+=1.8;if(bar.y>=H-100){state='rise'}}
if(bar.y>H-120){power=0;state='rise'}
for(const tg of targets){if(!tg.hit&&Math.abs(bar.y-tg.y)<26&&Math.abs(W/2-tg.x)<40){tg.hit=true;power++;score+=10;document.getElementById('sc').textContent=score}}
if(power>=5){round++;power=0;document.getElementById('rd').textContent=round;makeTargets();if(round>8){over=true;msg.textContent='全部杠铃片举起！得分 '+score;document.querySelector('.over').classList.add('show')}}
draw();requestAnimationFrame(step)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#181012';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#5a2b2b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,H-100);ctx.lineTo(W,H-100);ctx.stroke();
for(const tg of targets){ctx.fillStyle=tg.hit?'#4a6a9e':'#8a8a8a';ctx.beginPath();ctx.arc(tg.x,tg.y,tg.r,0,7);ctx.fill();ctx.strokeStyle='#0b090c';ctx.beginPath();ctx.arc(tg.x,tg.y,tg.r,0,7);ctx.stroke()}
ctx.fillStyle='#b02a2a';ctx.fillRect(W/2-70,bar.y-12,140,14);ctx.fillStyle='#d64545';ctx.fillRect(W/2-88,bar.y-8,18,22);ctx.fillRect(W/2+70,bar.y-8,18,22);ctx.fillStyle='#8a8a8a';ctx.fillRect(W/2-8,bar.y+2,16,90);
ctx.fillStyle='#ffd9c8';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText('得分 '+score,12,24);ctx.textAlign='center';ctx.fillText(state==='rise'?'上升中 · 点击锁定':'锁定中 · 点击再上升',W/2,24);ctx.textAlign='right';ctx.fillText('第 '+round+' 轮',W-12,24)}
function restart(){init()}
let running=false;function loop(){if(running)return;running=true;step()}
init();makeTargets();

</script></body></html>
