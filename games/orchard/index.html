<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🍑 果园采摘</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>🍑 果园采摘</h1><canvas id="cv"></canvas>
<div class="info">采摘 <b id="sc">0</b> / 30 · 时间 <b id="tm">45</b> 秒</div>
<div class="hint">移动篮子接住掉落的果实 · 金色果实 +3</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function size(){W=Math.min(innerWidth-24,430);H=Math.floor(W*.8);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
let over=false,score=0,tree=[],basket={x:0},tick=0,target=30,time=45,start=0,timer=null;
function init(){over=false;score=0;tree=[];basket={x:W/2};tick=0;target=30;time=45;start=Date.now();document.getElementById('sc').textContent='0';document.querySelector('.over').classList.remove('show');if(timer)clearInterval(timer);timer=setInterval(()=>{time=45-Math.floor((Date.now()-start)/1000);if(time<=0){clearInterval(timer);over=true;msg.textContent='时间到！采到 '+score+' 个';document.querySelector('.over').classList.add('show')}},1000);loop()}
function spawn(){const n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++)tree.push({x:40+Math.random()*(W-80),y:-16,vy:1.6+Math.random()*1.8,kind:Math.random()<.8?'fruit':'gold',dead:false})}
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();basket.x=e.clientX-r.left});
cv.addEventListener('touchmove',e=>{e.preventDefault();const r=cv.getBoundingClientRect();basket.x=e.touches[0].clientX-r.left},{passive:false});
function step(){if(over)return;tick++;if(tick%34===0)spawn();
for(const f of tree){f.y+=f.vy;if(f.y>H-64&&Math.abs(f.x-basket.x)<50){score+=f.kind==='gold'?3:1;document.getElementById('sc').textContent=score;f.dead=true;if(score>=target){clearInterval(timer);over=true;msg.textContent='采够 30 个，果园丰收！';document.querySelector('.over').classList.add('show')}}if(f.y>H+20)f.dead=true}
tree=tree.filter(f=>!f.dead);draw();requestAnimationFrame(step)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#101a0e';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#2a4a2a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,H-60);ctx.lineTo(W,H-60);ctx.stroke();
for(const f of tree){if(f.dead)continue;if(f.kind==='gold'){ctx.fillStyle='#ffc93c';ctx.beginPath();ctx.arc(f.x,f.y,9,0,7);ctx.fill()}else{ctx.fillStyle='#d64545';ctx.beginPath();ctx.arc(f.x,f.y,10,0,7);ctx.fill();ctx.fillStyle='#57c96e';ctx.beginPath();ctx.moveTo(f.x,f.y-9);ctx.lineTo(f.x+5,f.y-15);ctx.lineTo(f.x-4,f.y-13);ctx.fill()}}
const bx=basket.x;ctx.fillStyle='#7a4a2b';ctx.fillRect(bx-40,H-66,80,12);ctx.fillStyle='#b8860b';ctx.fillRect(bx-34,H-54,68,16);
ctx.fillStyle='#ffd9c8';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText('采摘 '+score+' / 30',12,24);ctx.textAlign='right';ctx.fillText('时间 '+time,W-12,24)}
function restart(){init()}
let running=false;function loop(){if(running)return;running=true;step()}
init();

</script></body></html>
