<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🔮 弹珠碰撞</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>🔮 弹珠碰撞</h1><canvas id="cv"></canvas>
<div class="info">得分 <b id="sc">0</b> / 70</div>
<div class="hint">从红色弹珠向后拖动瞄准，松开发射撞向蓝色珠子</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function size(){W=Math.min(innerWidth-24,440);H=Math.floor(W*.75);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
let over=false,score=0,balls=[],targets=[],drag=false,sx=0,sy=0,dx=0,dy=0,tick=0;
function init(){over=false;score=0;balls=[{x:W/2,y:H-50,vx:0,vy:0}];targets=[];for(let i=0;i<7;i++)targets.push({x:40+Math.random()*(W-80),y:80+Math.random()*(H-220),r:12,hit:false});tick=0;document.getElementById('sc').textContent='0';document.querySelector('.over').classList.remove('show');draw()}
cv.addEventListener('pointerdown',e=>{if(over||balls.some(b=>Math.hypot(b.vx,b.vy)>.5))return;const r=cv.getBoundingClientRect();sx=e.clientX-r.left;sy=e.clientY-r.top;drag=true;dx=0;dy=0});
addEventListener('pointermove',e=>{if(!drag)return;const r=cv.getBoundingClientRect();dx=e.clientX-r.left-sx;dy=e.clientY-r.top-sy;draw()});
addEventListener('pointerup',()=>{if(!drag)return;drag=false;const d=Math.hypot(dx,dy);if(d<10)return;const p=Math.min(1,d/110);balls[0].vx=-(dx/d)*p*11;balls[0].vy=-(dy/d)*p*11;tick=0});
function step(){tick++;for(const b of balls){b.x+=b.vx;b.y+=b.vy;if(b.x<10||b.x>W-10)b.vx*=-1;if(b.y<10)b.vy*=-1;if(b.y>H-10){b.vy*=-.7;b.y=H-10}
for(const tg of targets){if(!tg.hit&&Math.hypot(b.x-tg.x,b.y-tg.y)<tg.r+10){tg.hit=true;score+=10;document.getElementById('sc').textContent=score}}}
for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<24){const nx=dx/d||0,ny=dy/d||0;const ov=(24-d)/2;a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;const dvx=b.vx-a.vx,dvy=b.vy-a.vy,dot=dvx*nx+dvy*ny;a.vx+=nx*dot;b.vx-=nx*dot;a.vy+=ny*dot;b.vy-=ny*dot}}
if(!balls.some(b=>Math.hypot(b.vx,b.vy)>.3)&&targets.every(t=>t.hit)){over=true;msg.textContent='全部击中！得分 '+score;document.querySelector('.over').classList.add('show')}
draw();requestAnimationFrame(step)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#141018';ctx.fillRect(0,0,W,H);
for(const tg of targets){if(tg.hit)continue;ctx.fillStyle='#4a9ede';ctx.beginPath();ctx.arc(tg.x,tg.y,tg.r,0,7);ctx.fill();ctx.fillStyle='#fff6';ctx.beginPath();ctx.arc(tg.x-3,tg.y-3,4,0,7);ctx.fill()}
for(const b of balls){const g=ctx.createRadialGradient(b.x-4,b.y-4,2,b.x,b.y,11);g.addColorStop(0,'#ff9b78');g.addColorStop(1,'#b02a2a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,10,0,7);ctx.fill()}
if(drag){ctx.strokeStyle='#ffd9c855';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(W/2,H-50);ctx.lineTo(W/2-dx*3,H-50-dy*3);ctx.stroke();ctx.setLineDash([])}
ctx.fillStyle='#ffd9c8';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText('得分 '+score+' / 70',12,24)}
function restart(){init()}
init();setInterval(step,16);

</script></body></html>
