<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🏃 火柴人跑酷</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🏃 火柴人跑酷</h1><div class="score">距离 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=360*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let player,obs,score,alive,raf,tick,jumpV,onGround;
function rset(){player={x:80,y:280};obs=[];score=0;tick=0;alive=true;jumpV=0;onGround=true;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){if(!alive)return;tick++;score+=0.1;if(tick%40===0)obs.push({x:360,y:280,w:Math.random()*20+15,h:Math.random()*30+20});obs.forEach(o=>{o.x-=4+score/100});obs=obs.filter(o=>o.x>-50);if(!onGround){jumpV+=0.8;player.y+=jumpV;if(player.y>=280){player.y=280;onGround=true;jumpV=0}}
if(obs.some(o=>player.x+10>o.x&&player.x-10<o.x+o.w&&player.y+30>o.y)){{document.getElementById('msg').textContent='距离 '+Math.floor(score);document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),Math.floor(score));localStorage.setItem('stickmanrunBest',Math.max(parseInt(localStorage.getItem('stickmanrunBest')||0),Math.floor(score)));document.querySelector('.over').classList.add('show');alive=false};return}
document.getElementById('sc').textContent=Math.floor(score);
ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,360);ctx.fillStyle='#3a2c2f';ctx.fillRect(0,310,360,50);ctx.fillStyle='#b02a2a';obs.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));ctx.fillStyle='#ffd9c8';ctx.strokeStyle='#ffd9c8';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,8,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(player.x,player.y+8);ctx.lineTo(player.x,player.y+30);ctx.stroke();ctx.beginPath();ctx.moveTo(player.x,player.y+15);ctx.lineTo(player.x-10,player.y+25);ctx.moveTo(player.x,player.y+15);ctx.lineTo(player.x+10,player.y+25);ctx.stroke();raf=requestAnimationFrame(loop)}
function jump(){if(onGround&&alive){jumpV=-12;onGround=false}}
function restart(){rset()}
cv.addEventListener('pointerdown',jump);
rset();
</script></body></html>
