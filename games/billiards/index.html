<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>台球大师</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,'PingFang SC',sans-serif;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#ffd9c8;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{font-size:19px;margin:10px 0 4px;letter-spacing:2px}
.hint{font-size:12px;opacity:.7;margin-bottom:6px}
canvas{background:#123;border:1px solid #5a2424;border-radius:12px;max-width:96vw;max-height:68vh;touch-action:none;cursor:crosshair}
.bar{font-size:13px;margin:8px 0}
.over{position:fixed;inset:0;background:rgba(10,6,8,.86);display:none;align-items:center;justify-content:center;z-index:9}
.over.show{display:flex}
.panel{text-align:center;padding:26px 38px;background:#1a0f12;border:1px solid #b02a2a;border-radius:16px}
.panel h2{font-size:24px;color:#ff6b6b;margin-bottom:8px}
.panel p{font-size:14px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 28px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;border:none;border-radius:999px;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.96)}
</style></head><body>
<h1>🎱 台球大师</h1><div class="hint">拖拽白球瞄准后松手击球 · 8 杆内清完 6 颗红球</div>
<canvas id="c" width="360" height="500"></canvas>
<div class="bar">已进球 <b id="sc">0</b> / 6 · 已用杆数 <b id="st">0</b> / 8</div>
<div class="over" id="over"><div class="panel"><h2 id="t"></h2><p id="s"></p><button class="btn" onclick="again()">再来一局</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=360,H=500;
const pockets=[[10,10],[W-10,10],[10,H-10],[W-10,H-10]];
let balls=[],shots=0,score=0,run=true,aim=null;
function setup(){
  balls=[];shots=0;score=0;run=true;
  balls.push({x:90,y:H-80,vx:0,vy:0,r:9,c:'#f5f5f5',name:'白球'});
  const reds=[[250,120],[270,100],[270,140],[290,80],[290,120],[290,160]];
  reds.forEach(p=>balls.push({x:p[0],y:p[1],vx:0,vy:0,r:9,c:'#e0342e',name:'红球'}));
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function collide(a,b){
  const d=dist(a,b),min=a.r+b.r;
  if(d>=min||d===0)return;
  const nx=(b.x-a.x)/d,ny=(b.y-a.y)/d,overlap=(min-d)/2;
  a.x-=nx*overlap;a.y-=ny*overlap;b.x+=nx*overlap;b.y+=ny*overlap;
  const dvx=b.vx-a.vx,dvy=b.vy-a.vy,dot=dvx*nx+dvy*ny;
  if(dot<0)return;
  const imp=dot/2;
  a.vx+=imp*nx;a.vy+=imp*ny;b.vx-=imp*nx;b.vy-=imp*ny;
}
function tick(){
  if(!run)return;
  balls.forEach(b=>{
    b.x+=b.vx;b.y+=b.vy;b.vx*=.985;b.vy*=.985;
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.75}
    if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.75}
    if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.75}
    if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.75}
  });
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++)collide(balls[i],balls[j]);
  balls.forEach(b=>{
    pockets.forEach(p=>{
      if(dist(b,p)<14){
        if(b.name==='红球'){score++;document.getElementById('sc').textContent=score}
        balls.splice(balls.indexOf(b),1);
      }
    });
  });
  const moving=balls.some(b=>Math.hypot(b.vx,b.vy)>.2);
  if(!moving&&!balls.some(b=>b.name==='红球')){
    run=false;show(score===6?'🎉 完美清台！':'✅ 过关！','进球 '+score+' 颗，用了 '+shots+' 杆');
  }else if(!moving&&shots>=8){
    run=false;show('😅 杆数用尽','进球 '+score+' 颗，再试一次');
  }
  draw();
}
function draw(){
  ctx.fillStyle='#0f1f2e';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#2e5f6f';ctx.lineWidth=2;ctx.strokeRect(4,4,W-8,H-8);
  pockets.forEach(p=>{ctx.fillStyle='#0a1118';ctx.beginPath();ctx.arc(p.x,p.y,13,0,7);ctx.fill();ctx.stroke()});
  balls.forEach(b=>{ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.strokeStyle='#0008';ctx.stroke()});
  if(aim){
    const w=balls[0];
    ctx.strokeStyle='#ffd9c8';ctx.setLineDash([6,6]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(w.x,w.y);ctx.lineTo(w.x-aim.vx*22,w.y-aim.vy*22);ctx.stroke();ctx.setLineDash([]);
  }
}
let dragging=false;
cv.addEventListener('pointerdown',e=>{
  if(!run)return;
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,w=balls[0];
  const d=Math.hypot(x-w.x,y-w.y);
  if(d<60){dragging=true;aim={x0:x,y0:y,vx:0,vy:0}}
});
cv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,w=balls[0];
  let dx=x-w.x,dy=y-w.y,d=Math.hypot(dx,dy)||1;d=Math.min(d,120);
  aim.vx=-dx/d*d/8;aim.vy=-dy/d*d/8;
});
cv.addEventListener('pointerup',()=>{
  if(!dragging)return;
  const w=balls[0];w.vx=aim.vx*3.2;w.vy=aim.vy*3.2;shots++;
  document.getElementById('st').textContent=shots;
  dragging=false;aim=null;
});
function show(t,s){document.getElementById('t').textContent=t;document.getElementById('s').textContent=s;document.getElementById('over').classList.add('show')}
function again(){document.getElementById('over').classList.remove('show');setup()}
setup();setInterval(tick,16);
</script></body></html>
