<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>乒乓对战</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:14px;color:#d9a08f}.score b{color:#ffd9c8;font-size:17px}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b;text-align:center;line-height:1.7}
.mode{display:flex;gap:8px;margin-bottom:2px}.mode button{padding:5px 13px;border:1px solid #b02a2a66;border-radius:999px;background:#1d1416;color:#d9a08f;font-size:12px;cursor:pointer}.mode button.on{background:#b02a2a;color:#fff}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
</style></head><body>
<div class="wrap"><h1>🏓 乒乓对战</h1>
<div class="mode"><button id="m0" class="on" onclick="setMode(0)">人机</button><button id="m1" onclick="setMode(1)">双人</button></div>
<div class="score">玩家 <b id="p1">0</b> : <b id="p2">0</b> 电脑</div><canvas id="cv"></canvas>
<div class="hint">鼠标/手指拖右拍 · 双人：W/S 或 ↑/↓ 控制左拍</div></div>
<div class="over"><div class="panel"><b id="msg">本局结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);
const W=420,H=280;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=Math.min(W,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let mode=0,p1y,p2y,bx,by,bvx,bvy,s1,s2,alive,raf;
function restart(){p1y=H/2-30;p2y=H/2-30;s1=0;s2=0;serve();alive=true;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function serve(){bx=W/2;by=H/2;bvx=(Math.random()<.5?1:-1)*3.4;bvy=(Math.random()-.5)*3}
function setMode(m){mode=m;document.getElementById('m0').classList.toggle('on',m===0);document.getElementById('m1').classList.toggle('on',m===1);restart()}
function loop(){if(!alive)return;
if(mode===0){const target=by-30;p2y+=(target-p2y)*.07}else if(keyU){p1y-=4}else if(keyD){p1y+=4}
by+=bvy;bx+=bvx;
if(by<6||by>H-6)bvy*=-1;
if(bx<24&&by>p1y&&by<p1y+60){bx=24;bvx=Math.abs(bvx)*1.05;bvy+=(by-p1y-30)*.06}
if(bx>W-24&&by>p2y&&by<p2y+60){bx=W-24;bvx=-Math.abs(bvx)*1.05;bvy+=(by-p2y-30)*.06}
if(bx<-20){s2++;if(s2>=7)return win(2);serve()}if(bx>W+20){s1++;if(s1>=7)return win(1);serve()}
document.getElementById('p1').textContent=s1;document.getElementById('p2').textContent=s2;
ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#33262a';ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle='#d9a08f';ctx.fillRect(10,p1y,10,60);ctx.fillStyle='#ffd9c8';ctx.fillRect(W-20,p2y,10,60);
ctx.fillStyle='#e05a4e';ctx.beginPath();ctx.arc(bx,by,7,0,7);ctx.fill();
raf=requestAnimationFrame(loop)}
function win(w){alive=false;document.getElementById('msg').textContent='玩家 '+(w===1?'胜':'负')+'！';document.querySelector('.over').classList.add('show')}
let keyU=false,keyD=false;document.addEventListener('keydown',e=>{if(e.key==='w'||e.key==='W'||e.key==='ArrowUp'){keyU=true;e.preventDefault()}if(e.key==='s'||e.key==='S'||e.key==='ArrowDown'){keyD=true;e.preventDefault()}});document.addEventListener('keyup',e=>{if(e.key==='w'||e.key==='W'||e.key==='ArrowUp')keyU=false;if(e.key==='s'||e.key==='S'||e.key==='ArrowDown')keyD=false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const r=cv.getBoundingClientRect();p2y=(e.touches[0].clientY-r.top)*H/r.height-30},{passive:false});
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();p2y=(e.clientY-r.top)*H/r.height-30});
restart();
</script></body></html>
