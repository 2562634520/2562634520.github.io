<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐟 捕鱼达人</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🐟 捕鱼达人</h1><div class="score">得分 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=480*dpr;cv.height=360*dpr;cv.style.width=Math.min(480,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let fishes,coins,score,alive,raf,tick;
function rset(){fishes=[];coins=[];score=0;tick=0;alive=true;for(let i=0;i<10;i++)spawn();document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function spawn(){const types=[{r:8,col:'#d9a08f',pts:1},{r:14,col:'#b02a2a',pts:3},{r:20,col:'#8b0000',pts:5},{r:30,col:'#5a8faf',pts:10}];const t=types[Math.floor(Math.random()*types.length)];fishes.push({x:Math.random()>0.5?-30:510,y:Math.random()*340,vx:Math.random()>0.5?1:-1,r:t.r,col:t.col,pts:t.pts})}
function loop(){if(!alive)return;tick++;if(tick%40===0)spawn();fishes.forEach(f=>{f.x+=f.vx;f.y+=Math.sin(tick/10+f.r)*1.5});fishes=fishes.filter(f=>f.x>-50&&f.x<530);coins.forEach(c=>{c.y-=1;c.t--;if(c.t<=0)coins.splice(coins.indexOf(c),1)});
document.getElementById('sc').textContent=score;
ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,480,360);ctx.fillStyle='rgba(176,42,42,.1)';for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(0,200+i*40);ctx.lineTo(480,200+i*40);ctx.lineTo(480,220+i*40);ctx.lineTo(0,220+i*40);ctx.fill()}
fishes.forEach(f=>{ctx.fillStyle=f.col;ctx.beginPath();ctx.ellipse(f.x,f.y,f.r,f.r/2,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(f.x-f.r/3,f.y-3,3,3)});
coins.forEach(c=>{ctx.fillStyle='#ffd9c8';ctx.font='bold 12px sans-serif';ctx.fillText('+'+c.v,c.x,c.y)});raf=requestAnimationFrame(loop)}
function restart(){rset()}
function cast(x,y){let c=null;for(const f of fishes)if(Math.hypot(f.x-x,f.y-y)<f.r+5){c=f;break}if(c){score+=c.pts;coins.push({x:c.x,y:c.y,v:c.pts,t:60});fishes.splice(fishes.indexOf(c),1);if(score>=30){{document.getElementById('msg').textContent='得分 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('catchfishBest',Math.max(parseInt(localStorage.getItem('catchfishBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}}}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();cast((e.clientX-r.left)*(480/r.width),(e.clientY-r.top)*(360/r.height))});
rset();
</script></body></html>
