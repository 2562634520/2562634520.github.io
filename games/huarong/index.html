<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>华容道</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:20px;letter-spacing:.16em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f;display:flex;gap:18px}
#bd{position:relative;background:#120e11;border:3px solid #b02a2a88;border-radius:10px;padding:4px;box-shadow:0 0 24px #b02a2a2e;width:min(92vw,340px);aspect-ratio:1.25}
.piece{position:absolute;display:grid;place-items:center;background:linear-gradient(135deg,#3a2224,#241a1c);border:1px solid #b02a2a66;border-radius:6px;font-weight:700;color:#ffd9c8;cursor:pointer;user-select:none;transition:left .12s,top .12s;touch-action:none}
.piece.hero{background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:24px 34px}
.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:14px auto 0;padding:9px 28px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
</style></head><body>
<div class="wrap"><h1>🎮 华容道</h1><div class="info"><span>步数 <b id="mv">0</b></span><span>目标：曹操到出口</span></div><div id="bd"></div><div class="hint">点选方块后点空位移动</div></div>
<div class="over"><div class="panel"><b>🎉 曹操出逃成功！</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const bd=document.getElementById('bd');let pieces=[],moves=0,sel=null,CW,CH;
const INIT=[{name:'曹操',x:1,y:0,w:2,h:2,hero:true},{name:'张飞',x:0,y:0,w:1,h:2},{name:'关羽',x:1,y:2,w:2,h:1},{name:'赵云',x:3,y:0,w:1,h:2},{name:'马超',x:0,y:2,w:1,h:2},{name:'黄忠',x:3,y:2,w:1,h:2},{name:'兵1',x:0,y:4,w:1,h:1},{name:'兵2',x:1,y:3,w:1,h:1},{name:'兵3',x:2,y:3,w:1,h:1},{name:'兵4',x:3,y:4,w:1,h:1}];
function restart(){moves=0;sel=null;document.getElementById('mv').textContent=0;document.querySelector('.over').classList.remove('show');pieces=INIT.map(p=>({...p}));render()}
function render(){bd.innerHTML='';let w=bd.clientWidth/4,h=bd.clientHeight/5;for(let p of pieces){let d=document.createElement('div');d.className='piece'+(p.hero?' hero':'');d.style.left=(p.x*w)+'px';d.style.top=(p.y*h)+'px';d.style.width=(p.w*w-3)+'px';d.style.height=(p.h*h-3)+'px';d.textContent=p.name;d.addEventListener('pointerdown',e=>{e.stopPropagation();select(p)});bd.appendChild(d)}}
function select(p){sel=p;render();document.querySelectorAll('.piece').forEach((el,i)=>{if(pieces[i]===p)el.style.borderColor='#ffd9c8';el.style.zIndex=pieces[i]===p?2:1})}
function tryMove(p,dx,dy){let nx=p.x+dx,ny=p.y+dy;if(nx<0||ny<0||nx+p.w>4||ny+p.h>5)return false;for(let o of pieces){if(o===p)continue;if(nx<o.x+o.w&&nx+p.w>o.x&&ny<o.y+o.h&&ny+p.h>o.y)return false}p.x=nx;p.y=ny;moves++;document.getElementById('mv').textContent=moves;render();if(p.hero&&p.y===3&&p.x===1)setTimeout(()=>document.querySelector('.over').classList.add('show'),150);return true}
bd.addEventListener('pointerdown',e=>{if(!sel)return;let r=bd.getBoundingClientRect(),x=(e.clientX-r.left)/(r.width/4)|0,y=(e.clientY-r.top)/(r.height/5)|0;let dx=x-sel.x,dy=y-sel.y;if(dx===0&&dy===0)return;let absX=Math.abs(dx),absY=Math.abs(dy);if(absX&&absY)return;let step=Math.max(absX,absY);for(let i=0;i<step;i++){if(!tryMove(sel,Math.sign(dx),Math.sign(dy)))break}});
addEventListener('keydown',e=>{if(!sel)return;let k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(k)tryMove(sel,k[0],k[1])});
restart();
</script></body></html>
