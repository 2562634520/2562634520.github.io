<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🪃 弹弓射击</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🪃 弹弓射击</h1><div class="score">得分 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=480*dpr;cv.height=360*dpr;cv.style.width=Math.min(480,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let ball,targets,score,alive,raf,tick,slingshot;
function rset(){ball=null;targets=[];score=0;tick=0;alive=true;slingshot={x:60,y:300};document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){if(!alive)return;tick++;if(tick%60===0)targets.push({x:Math.random()*360+120,y:Math.random()*250+30,r:Math.random()*15+15});
if(ball){ball.vy+=.4;ball.x+=ball.vx;ball.y+=ball.vy;if(ball.y>340)ball=null;targets=targets.filter(t=>{if(Math.hypot(t.x-ball.x,t.y-ball.y)<t.r+10){score+=10;return false}return true})}
if(score>=100){{document.getElementById('msg').textContent='得分 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('rubberbandBest',Math.max(parseInt(localStorage.getItem('rubberbandBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}
document.getElementById('sc').textContent=score;
ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,480,360);ctx.fillStyle='#3a2c2f';ctx.fillRect(0,340,480,20);ctx.fillStyle='#8b0000';ctx.fillRect(slingshot.x-5,slingshot.y-30,10,40);targets.forEach(t=>{ctx.fillStyle='#d9a08f';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,7);ctx.fill()});if(ball){ctx.fillStyle='#b02a2a';ctx.beginPath();ctx.arc(ball.x,ball.y,8,0,7);ctx.fill()}raf=requestAnimationFrame(loop)}
function aim(x,y){if(!ball&&alive){const dx=x-slingshot.x,dy=y-slingshot.y;ball={x:slingshot.x,y:slingshot.y,vx:dx*0.1,vy:dy*0.1}}}
function restart(){rset()}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();aim((e.clientX-r.left)*(480/r.width),(e.clientY-r.top)*(360/r.height))});
rset();
</script></body></html>
