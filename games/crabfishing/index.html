<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🦀 螃蟹钓鱼</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>🦀 螃蟹钓鱼</h1><canvas id="cv"></canvas>
<div class="info">得分 <b id="sc">0</b> · 生命 <b id="lv">5</b></div>
<div class="hint">移动螃蟹接住小鱼得分 · 别接灰色水雷</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function size(){W=Math.min(innerWidth-24,420);H=Math.floor(W*1.1);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
let over=false,score=0,lives=5,crab={x:0},fish=[],tick=0;
function init(){over=false;score=0;lives=5;crab={x:W/2};fish=[];tick=0;document.getElementById('sc').textContent='0';document.getElementById('lv').textContent='5';document.querySelector('.over').classList.remove('show');loop()}
function spawn(){const r=Math.random();fish.push({x:20+Math.random()*(W-40),y:-20,vy:2+Math.random()*2.5,r:r<.7?12:16,bad:r>.82,dead:false})}
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();crab.x=e.clientX-r.left});
cv.addEventListener('touchmove',e=>{e.preventDefault();const r=cv.getBoundingClientRect();crab.x=e.touches[0].clientX-r.left},{passive:false});
function step(){if(over)return;tick++;if(tick%30===0)spawn();
for(const f of fish){f.y+=f.vy;if(f.y>H-70&&Math.abs(f.x-crab.x)<52){if(f.bad){lives--;document.getElementById('lv').textContent=lives;if(lives<=0){over=true;msg.textContent='接到水雷！得分 '+score;document.querySelector('.over').classList.add('show')}}else{score++;document.getElementById('sc').textContent=score}f.dead=true}if(f.y>H+20)f.dead=true}
fish=fish.filter(f=>!f.dead);draw();requestAnimationFrame(step)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#12202a';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#2a4a5a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,H-60);ctx.lineTo(W,H-60);ctx.stroke();
for(const f of fish){if(f.dead)continue;if(f.bad){ctx.fillStyle='#4a4a4a';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill();ctx.strokeStyle='#666';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(f.x-8,f.y-10);ctx.lineTo(f.x+8,f.y-6);ctx.stroke()}else{ctx.fillStyle='#e8a13c';ctx.beginPath();ctx.moveTo(f.x-f.r,f.y);ctx.quadraticCurveTo(f.x,f.y-f.r*1.6,f.x+f.r,f.y);ctx.quadraticCurveTo(f.x,f.y+f.r*1.6,f.x-f.r,f.y);ctx.fill();ctx.fillStyle='#0b090c';ctx.beginPath();ctx.arc(f.x+f.r*.3,f.y-2,2.5,0,7);ctx.fill()}}
const bx=crab.x;ctx.fillStyle='#d64545';ctx.beginPath();ctx.ellipse(bx,H-55,42,20,0,0,7);ctx.fill();ctx.fillStyle='#ffd9c8';ctx.beginPath();ctx.arc(bx-24,H-70,7,0,7);ctx.arc(bx+24,H-70,7,0,7);ctx.fill();ctx.strokeStyle='#ffd9c8';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(bx-42,H-55);ctx.lineTo(bx-58,H-45);ctx.moveTo(bx+42,H-55);ctx.lineTo(bx+58,H-45);ctx.stroke();
ctx.fillStyle='#ffd9c8';ctx.font='bold 16px sans-serif';ctx.textAlign='left';ctx.fillText('得分 '+score,12,24);ctx.textAlign='right';ctx.fillText('生命 '+lives,W-12,24)}
function restart(){init()}
let running=false;function loop(){if(running)return;running=true;step()}
init();

</script></body></html>
