<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐔 鸡舍收蛋</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>🐔 鸡舍收蛋</h1><canvas id="cv"></canvas>
<div class="info">收蛋 <b id="sc">0</b> / 20 · 时间 <b id="tm">40</b> 秒</div>
<div class="hint">鸡蛋在鸡舍间跳动时点击收集 · 40 秒收满 20 个</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function size(){W=Math.min(innerWidth-24,440);H=Math.floor(W*.7);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
let over=false,score=0,eggs=[],tick=0,target=20,time=40,start=0,timer=null;
function init(){over=false;score=0;eggs=[];tick=0;target=20;time=40;start=Date.now();document.getElementById('sc').textContent='0';document.querySelector('.over').classList.remove('show');if(timer)clearInterval(timer);timer=setInterval(()=>{time=40-Math.floor((Date.now()-start)/1000);if(time<=0){clearInterval(timer);over=true;msg.textContent='时间到！收到 '+score+' 个蛋';document.querySelector('.over').classList.add('show')}},1000);loop()}
function spawn(){const hx=Math.floor(Math.random()*3);eggs.push({x:40+hx*140,y:H-110,vy:0,t:0,dead:false})}
cv.addEventListener('pointerdown',e=>{if(over)return;const r=cv.getBoundingClientRect();const x=e.clientX-r.left;let best=-1,bd=1e9;eggs.forEach((g,i)=>{const d=Math.hypot(x-g.x,g.y);if(d<bd){bd=d;best=i}});if(best>=0&&bd<46&&!eggs[best].dead){eggs[best].dead=true;score++;document.getElementById('sc').textContent=score;if(score>=target){clearInterval(timer);over=true;msg.textContent='收到 20 个蛋，鸡舍丰收！';document.querySelector('.over').classList.add('show')}}});
function step(){if(over)return;tick++;if(tick%30===0)spawn();
for(const g of eggs){g.t++;g.y+=Math.sin(g.t*.08)*1.2;if(g.y<40)g.dead=true;if(g.t>140)g.dead=true}
eggs=eggs.filter(g=>!g.dead);draw();requestAnimationFrame(step)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#161208';ctx.fillRect(0,0,W,H);ctx.fillStyle='#3a2a18';ctx.fillRect(0,H-70,W,70);
for(let i=0;i<3;i++){const x=40+i*140;ctx.fillStyle='#5a3a1a';ctx.fillRect(x-24,H-120,48,52);ctx.fillStyle='#d64545';ctx.beginPath();ctx.moveTo(x,H-120);ctx.lineTo(x-18,H-140);ctx.lineTo(x+18,H-140);ctx.fill()}
for(const g of eggs){if(g.dead)continue;ctx.fillStyle='#e8dcd5';ctx.beginPath();ctx.ellipse(g.x,g.y,9,12,0,0,7);ctx.fill();ctx.strokeStyle='#c9a05a';ctx.stroke()}
ctx.fillStyle='#ffd9c8';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText('收蛋 '+score+' / 20',12,24);ctx.textAlign='right';ctx.fillText('时间 '+time,W-12,24)}
function restart(){init()}
let running=false;function loop(){if(running)return;running=true;step()}
init();

</script></body></html>
