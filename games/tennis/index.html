<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>网球对决</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,'PingFang SC',sans-serif;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#ffd9c8;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{font-size:19px;margin:10px 0 4px;letter-spacing:2px}
.hint{font-size:12px;opacity:.7;margin-bottom:6px}
canvas{background:#1b4d3a;border:1px solid #5a2424;border-radius:12px;max-width:96vw;max-height:68vh;touch-action:none}
.bar{font-size:13px;margin:8px 0}
.over{position:fixed;inset:0;background:rgba(10,6,8,.86);display:none;align-items:center;justify-content:center;z-index:9}
.over.show{display:flex}
.panel{text-align:center;padding:26px 38px;background:#1a0f12;border:1px solid #b02a2a;border-radius:16px}
.panel h2{font-size:24px;color:#ff6b6b;margin-bottom:8px}
.panel p{font-size:14px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 28px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;border:none;border-radius:999px;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.96)}
</style></head><body>
<h1>🎾 网球对决</h1><div class="hint">左右移动球拍接球 · 先得 7 分获胜</div>
<canvas id="c" width="360" height="500"></canvas>
<div class="bar">你 <b id="ps">0</b> : <b id="as">0</b> 电脑</div>
<div class="over" id="over"><div class="panel"><h2 id="t"></h2><p id="s"></p><button class="btn" onclick="again()">再来一局</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=360,H=500;
let px=180,ax=180,bx=180,by=250,bvx=0,bvy=0,ps=0,as=0,speed=5,run=true;
function setup(){px=180;ax=180;bx=180;by=250;bvx=0;bvy=0;ps=0;as=0;speed=5;run=true;serve()}
function serve(){bx=180;by=250;const dir=Math.random()<.5?-1:1;bvx=dir*(2+Math.random()*2);bvy=dir*(2.5+Math.random()*1.5)}
function tick(){
  if(!run)return;
  ax+=Math.sign(bx-ax)*Math.min(5,Math.abs(bx-ax));
  bx+=bvx;by+=bvy;
  if(bx<8){bx=8;bvx=Math.abs(bvx)}
  if(bx>W-8){bx=W-8;bvx=-Math.abs(bvx)}
  if(by<38&&Math.abs(bx-ax)<34){bvy=Math.abs(bvy)*1.08;bvx+=(bx-ax)*.12;speed=Math.min(11,Math.abs(bvy));serveAfterHit()}
  if(by>H-38&&Math.abs(bx-px)<34){bvy=-Math.abs(bvy)*1.08;bvx+=(bx-px)*.12;speed=Math.min(11,Math.abs(bvy))}
  if(by<10){ps++;document.getElementById('ps').textContent=ps;if(ps>=7){run=false;show('🏆 你赢了！','比分 '+ps+' : '+as)}else serve()}
  if(by>H-10){as++;document.getElementById('as').textContent=as;if(as>=7){run=false;show('😔 电脑获胜','比分 '+ps+' : '+as)}else serve()}
  draw();
}
function serveAfterHit(){}
function draw(){
  ctx.fillStyle='#1b4d3a';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#e8fff0';ctx.lineWidth=2;ctx.strokeRect(10,10,W-20,H-20);
  ctx.beginPath();ctx.moveTo(10,250);ctx.lineTo(W-10,250);ctx.stroke();
  ctx.beginPath();ctx.moveTo(10,118);ctx.lineTo(W-10,118);ctx.stroke();
  ctx.beginPath();ctx.moveTo(10,382);ctx.lineTo(W-10,382);ctx.stroke();
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(bx,by,7,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(ax-34,28,68,10);ctx.fillRect(px-34,H-38,68,10);
  ctx.fillStyle='#ffd9c8';ctx.font='12px sans-serif';ctx.textAlign='center';
  ctx.fillText('电脑',180,22);ctx.fillText('你',180,H-10);
}
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();px=Math.max(34,Math.min(W-34,e.clientX-r.left))});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();px=Math.max(34,Math.min(W-34,e.clientX-r.left))});
function show(t,s){document.getElementById('t').textContent=t;document.getElementById('s').textContent=s;document.getElementById('over').classList.add('show')}
function again(){document.getElementById('over').classList.remove('show');setup()}
setup();setInterval(tick,16);
</script></body></html>
