<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>打字大师</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;max-width:620px;margin:0 auto}
h1{font-size:22px;letter-spacing:.16em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f;display:flex;gap:20px}
.word{font-size:min(9vw,42px);font-weight:800;letter-spacing:.12em;color:#ffd9c8;min-height:1.2em}
.typed{color:#8fd98f}
.input{width:min(88vw,420px);padding:13px 18px;font-size:18px;background:#171215;border:2px solid #b02a2a77;border-radius:12px;color:#fff;outline:none;text-align:center;letter-spacing:.08em}
.input:focus{border-color:#d64545;box-shadow:0 0 18px #b02a2a44}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 38px}
.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:14px auto 0;padding:9px 28px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
</style></head><body>
<div class="wrap"><h1>⌨️ 打字大师</h1><div class="info"><span>得分 <b id="sc">0</b></span><span>时间 <b id="tm">30</b>s</span></div><div class="word" id="word"></div><input class="input" id="inp" placeholder="输入上方单词" autocomplete="off"><div class="hint">30 秒内打对越多越好</div></div>
<div class="over"><div class="panel"><b>得分 <span id="finalsc">0</span></b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const WORDS=['apple','music','light','quick','brave','storm','cloud','river','dream','magic','rocket','smile','orange','planet','window','school','flower','coffee','pencil','garden','winter','silver','golden','summer','bright','shadow','spirit','wonder','friend','future'];
const inp=document.getElementById('inp'),word=document.getElementById('word');let score=0,time=30,cur='',timer=null;
function restart(){score=0;time=30;inp.value='';inp.disabled=false;document.getElementById('sc').textContent=0;document.getElementById('tm').textContent=30;document.querySelector('.over').classList.remove('show');clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('tm').textContent=time;if(time<=0){clearInterval(timer);inp.disabled=true;document.getElementById('finalsc').textContent=score;document.querySelector('.over').classList.add('show')}},1000);next();inp.focus()}
function next(){cur=WORDS[Math.random()*WORDS.length|0];render('')}
function render(t){word.innerHTML='';for(let i=0;i<cur.length;i++){let s=document.createElement('span');if(i<t.length)s.className='typed';s.textContent=cur[i];word.appendChild(s)}}
inp.addEventListener('input',()=>{let v=inp.value;if(v===cur){score++;document.getElementById('sc').textContent=score;inp.value='';next()}else render(v)});
restart();
</script></body></html>
