<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>⚔️ 武士斩</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>⚔️ 武士斩</h1><canvas id="cv"></canvas>
<div class="info">斩敌 <b id="sc">0</b> · 生命 <b id="lv">3</b></div>
<div class="hint">点击挥刀斩杀蓝衣敌人 · 别砍到橙色平民</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function size(){W=Math.min(innerWidth-24,440);H=Math.floor(W*.75);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
let over=false,score=0,life=3,items=[],tick=0,slash=false,slashT=0,cursor={x:W/2,y:H/2};
function init(){over=false;score=0;life=3;items=[];tick=0;slash=false;slashT=0;cursor={x:W/2,y:H/2};document.getElementById('sc').textContent='0';document.getElementById('lv').textContent='3';document.querySelector('.over').classList.remove('show');loop()}
function spawn(){const r=Math.random();items.push(r<.68?{type:'bad',x:30+Math.random()*(W-60),y:30+Math.random()*(H-120),r:16}:{type:'good',x:30+Math.random()*(W-60),y:30+Math.random()*(H-120),r:14})}
cv.addEventListener('pointermove',e=>{if(over)return;const r=cv.getBoundingClientRect();cursor.x=e.clientX-r.left;cursor.y=e.clientY-r.top});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(over)return;const r=cv.getBoundingClientRect();cursor.x=e.touches[0].clientX-r.left;cursor.y=e.touches[0].clientY-r.top},{passive:false});
cv.addEventListener('pointerdown',()=>{if(over)return;slash=true;slashT=12});
function step(){if(over)return;tick++;if(tick%40===0)spawn();
for(const it of items){it.life=(it.life||200)-1}
if(slashT>0){slashT--;if(slashT===10){for(const it of items){if(Math.hypot(cursor.x-it.x,cursor.y-it.y)<it.r+24){if(it.type==='bad'){score++;document.getElementById('sc').textContent=score}else{life--;document.getElementById('lv').textContent=life;if(life<=0){over=true;msg.textContent='砍到平民！得分 '+score;document.querySelector('.over').classList.add('show')}}it.dead=true}}}}else if(slash){slash=false}
items=items.filter(it=>!it.dead&&it.life>0);draw();requestAnimationFrame(step)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#171219';ctx.fillRect(0,0,W,H);
for(const it of items){if(it.dead)continue;if(it.type==='bad'){ctx.fillStyle='#2a3a5a';ctx.beginPath();ctx.arc(it.x,it.y,it.r,0,7);ctx.fill();ctx.fillStyle='#ffd9c8';ctx.beginPath();ctx.arc(it.x+4,it.y-4,4,0,7);ctx.arc(it.x-4,it.y-4,4,0,7);ctx.fill();ctx.strokeStyle='#d64545';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(it.x-10,it.y+8);ctx.lineTo(it.x+10,it.y+8);ctx.stroke()}else{ctx.fillStyle='#e8a13c';ctx.beginPath();ctx.arc(it.x,it.y,it.r,0,7);ctx.fill();ctx.fillStyle='#ffd9c8';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('民',it.x,it.y+4)}}
if(slashT>0){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cursor.x,cursor.y,26,0,7);ctx.stroke()}
ctx.fillStyle='#ffd9c8';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText('斩敌 '+score,12,24);ctx.textAlign='right';ctx.fillText('生命 '+life,W-12,24)}
function restart(){init()}
let running=false;function loop(){if(running)return;running=true;step()}
init();

</script></body></html>
