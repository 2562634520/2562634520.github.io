<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🌴 丛林跳跃</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🌴 丛林跳跃</h1><div class="score">高度 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=360*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let player,platforms,score,alive,raf;
function rset(){player={x:180,y:300,vx:0,vy:0};platforms=[];for(let i=0;i<10;i++)platforms.push({x:Math.random()*320,y:300-i*60});score=0;alive=true;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){if(!alive)return;player.vy+=.5;player.x+=player.vx;player.y+=player.vy;if(player.x<0)player.x=360;if(player.x>360)player.x=0;if(player.vy>0)platforms.forEach(p=>{if(Math.abs(player.x-p.x)<40&&Math.abs(player.y-p.y)<15&&player.y<p.y){player.vy=-10;score=Math.max(score,Math.floor((300-player.y)/30))}});
if(player.y>360){{document.getElementById('msg').textContent='高度 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('junglejumpBest',Math.max(parseInt(localStorage.getItem('junglejumpBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}
while(platforms.length&&platforms[0].y>player.y+200)platforms.shift();
if(platforms[platforms.length-1].y>player.y-200)platforms.push({x:Math.random()*320,y:platforms[platforms.length-1].y-60});
document.getElementById('sc').textContent=score;
ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,360);platforms.forEach(p=>{ctx.fillStyle='#8b0000';ctx.fillRect(p.x-40,p.y,80,10)});ctx.fillStyle='#ffd9c8';ctx.fillRect(player.x-10,player.y-20,20,20);raf=requestAnimationFrame(loop)}
function restart(){rset()}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(360/r.width);player.vx=(x-player.x)*0.2});
rset();
</script></body></html>
