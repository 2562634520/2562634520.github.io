<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎯 宾果连线</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🎯 宾果连线</h1><div class="score">连成 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=360*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let grid,marked,score,alive,raf;
function rset(){grid=[];marked=Array(25).fill(false);const nums=[];for(let i=0;i<25;i++)nums.push(i+1);for(let i=nums.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[nums[i],nums[j]]=[nums[j],nums[i]]}grid=nums;score=0;alive=true;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function check(){let lines=0;for(let r=0;r<5;r++)if([0,1,2,3,4].every(c=>marked[r*5+c]))lines++;for(let c=0;c<5;c++)if([0,1,2,3,4].every(r=>marked[r*5+c]))lines++;if([0,1,2,3,4].every(i=>marked[i*5+i]))lines++;if([0,1,2,3,4].every(i=>marked[i*5+4-i]))lines++;return lines}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,360);for(let i=0;i<25;i++){const r=Math.floor(i/5),c=i%5;const x=20+c*64,y=20+r*64;ctx.fillStyle=marked[i]?'#b02a2a':'#2a1414';ctx.fillRect(x,y,60,60);ctx.strokeStyle='#d9a08f';ctx.strokeRect(x,y,60,60);ctx.fillStyle=marked[i]?'#fff':'#d9a08f';ctx.font=(marked[i]?'bold ':'')+'22px sans-serif';ctx.fillText(marked[i]?'✓':grid[i],x+15,y+38)}document.getElementById('sc').textContent=check();raf=requestAnimationFrame(loop)}
function restart(){rset()}
function tap(i){marked[i]=true;const lines=check();if(lines>=5){{document.getElementById('msg').textContent='完成 '+lines;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),lines);localStorage.setItem('bingoBest',Math.max(parseInt(localStorage.getItem('bingoBest')||0),lines));document.querySelector('.over').classList.add('show');alive=false};return}}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const cx=(e.clientX-r.left)*(360/r.width);const cy=(e.clientY-r.top)*(360/r.height);const c=Math.floor((cx-20)/64),rr=Math.floor((cy-20)/64);if(c>=0&&c<5&&rr>=0&&rr<5)tap(rr*5+c)});
rset();
</script></body></html>
