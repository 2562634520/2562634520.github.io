<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>💣 炸弹人</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>💣 炸弹人</h1><div class="score">分数 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=360*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let px,py,bombs,blasts,enemies,score,alive,raf,tick;
function rset(){px=1;py=1;bombs=[];blasts=[];enemies=[];score=0;tick=0;alive=true;for(let i=0;i<4;i++)enemies.push({x:Math.floor(Math.random()*7),y:Math.floor(Math.random()*7)});document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){if(!alive)return;tick++;if(tick%40===0)enemies.forEach(e=>{const dx=px-e.x,dy=py-e.y;if(Math.abs(dx)>Math.abs(dy))e.x+=Math.sign(dx);else e.y+=Math.sign(dy)});bombs.forEach(b=>{b.t--;if(b.t<=0){for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)if(Math.abs(dx)+Math.abs(dy)<=1)blasts.push({x:b.x+dx,y:b.y+dy,t:10})}});bombs=bombs.filter(b=>b.t>0);blasts.forEach(b=>{if(b.t<=0){enemies=enemies.filter(e=>e.x===b.x&&e.y===b.y);if(px===b.x&&py===b.y){{document.getElementById('msg').textContent='得分 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('bombermanBest',Math.max(parseInt(localStorage.getItem('bombermanBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}}b.t--});blasts=blasts.filter(b=>b.t>0);
score+=1;if(enemies.length===0){{document.getElementById('msg').textContent='通关 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('bombermanBest',Math.max(parseInt(localStorage.getItem('bombermanBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}
document.getElementById('sc').textContent=score;
ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,360);for(let i=0;i<8;i++)for(let j=0;j<8;j++){ctx.strokeStyle='#2a1414';ctx.strokeRect(20+i*40,20+j*40,40,40)}
blasts.forEach(b=>{ctx.fillStyle='rgba(214,69,69,'+(b.t/10)+')';ctx.fillRect(20+b.x*40,20+b.y*40,40,40)});
enemies.forEach(e=>{ctx.fillStyle='#5a8faf';ctx.fillRect(20+e.x*40+8,20+e.y*40+8,24,24)});
bombs.forEach(b=>{ctx.fillStyle='#b02a2a';ctx.beginPath();ctx.arc(20+b.x*40+20,20+b.y*40+20,12,0,7);ctx.fill()});
ctx.fillStyle='#ffd9c8';ctx.fillRect(20+px*40+8,20+py*40+8,24,24);raf=requestAnimationFrame(loop)}
function restart(){rset()}
function bomb(){bombs.push({x:px,y:py,t:60})}
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')py=Math.max(0,py-1);if(e.key==='ArrowDown')py=Math.min(7,py+1);if(e.key==='ArrowLeft')px=Math.max(0,px-1);if(e.key==='ArrowRight')px=Math.min(7,px+1);if(e.key===' ')bomb()});
let lastTap=0;cv.addEventListener('pointerdown',e=>{const now=Date.now();if(now-lastTap<300)bomb();lastTap=now;const r=cv.getBoundingClientRect();const cx=(e.clientX-r.left)*(360/r.width);const cy=(e.clientY-r.top)*(360/r.height);if(cx<60)px=Math.max(0,px-1);else if(cx>300)px=Math.min(7,px+1);else if(cy<60)py=Math.max(0,py-1);else if(cy>300)py=Math.min(7,py+1)});
rset();
</script></body></html>
