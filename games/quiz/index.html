<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>❓ 趣味问答</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>❓ 趣味问答</h1><div class="score">得分 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=360*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let qs,idx,score,alive,raf;
function rset(){qs=[{q:'1+1=?',a:['2','3','4'],c:0},{q:'中国首都?',a:['北京','上海','广州'],c:0},{q:'一年几天?',a:['365','360','300'],c:0},{q:'最大的海洋?',a:['太平洋','大西洋','印度洋'],c:0},{q:'人类登月?',a:['1969','1970','1971'],c:0},{q:'水的沸点?',a:['100','90','80'],c:0},{q:'光速 km/s?',a:['30万','20万','40万'],c:0},{q:'一周几天?',a:['7','5','6'],c:0}];idx=0;score=0;alive=true;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,360);if(idx<qs.length){ctx.fillStyle='#ffd9c8';ctx.font='bold 18px sans-serif';ctx.fillText(qs[idx].q,20,50);qs[idx].a.forEach((a,i)=>{ctx.fillStyle='#b02a2a';ctx.fillRect(20,80+i*60,320,50);ctx.fillStyle='#ffd9c8';ctx.font='15px sans-serif';ctx.fillText(a,40,112+i*60)})}ctx.fillStyle='#d9a08f';ctx.font='14px sans-serif';ctx.fillText('得分 '+score+' / '+qs.length,20,340);raf=requestAnimationFrame(loop)}
function pick(i){if(idx>=qs.length)return;if(i===qs[idx].c)score++;idx++;if(idx>=qs.length){{document.getElementById('msg').textContent='得分 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('quizBest',Math.max(parseInt(localStorage.getItem('quizBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}}
function restart(){rset()}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const y=(e.clientY-r.top)*(360/r.height);pick(Math.floor((y-80)/60))});
rset();
</script></body></html>
