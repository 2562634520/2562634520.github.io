<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎈 气球上升</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🎈 气球上升</h1><div class="score">高度 <b id="sc">0</b> · 最佳 <b id="bs">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=420*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let ball,obs,score,best,alive,raf,spawnT;
function rset(){ball={x:180,y:380,r:18};obs=[];score=0;best=parseInt(localStorage.balloonriseBest||0);document.getElementById('bs').textContent=best;spawnT=0;alive=true;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,420);obs.forEach(o=>{ctx.fillStyle='#3a3a3a';ctx.fillRect(o.x,o.y,o.w,o.h)});ctx.fillStyle='#d64545';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x-5,ball.y-5,ball.r/3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#888';ctx.fillRect(ball.x-2,ball.y+ball.r,4,15);
ball.y-=1.5;score=Math.max(score,Math.floor((420-ball.y)/10));document.getElementById('sc').textContent=score;if(ball.y<20){alive=false;{document.getElementById('msg').textContent='高度 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('balloonriseBest',Math.max(parseInt(localStorage.getItem('balloonriseBest')||0),score));document.querySelector('.over').classList.add('show');alive=false}m;return}
spawnT++;if(spawnT%30===0){const gap=80+Math.random()*40;const w=40+Math.random()*40;const y=-20;obs.push({x:0,y,w,h:Math.random()*80+20});obs.push({x:gap+w,y,w,h:Math.random()*80+20})}
obs=obs.filter(o=>{o.y+=2;if(o.x<ball.x+ball.r&&o.x+o.w>ball.x-ball.r&&o.y<ball.y+ball.r&&o.y+o.h>ball.y-ball.r){alive=false;{document.getElementById('msg').textContent='高度 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('balloonriseBest',Math.max(parseInt(localStorage.getItem('balloonriseBest')||0),score));document.querySelector('.over').classList.add('show');alive=false}m;return false}
return o.y<440});
raf=requestAnimationFrame(loop)}
function move(e){const r=cv.getBoundingClientRect();ball.x=(e.clientX-r.left)*(360/r.width)}
function restart(){rset()}
cv.addEventListener('pointermove',move);
cv.addEventListener('pointerdown',move);
rset();
</script></body></html>
