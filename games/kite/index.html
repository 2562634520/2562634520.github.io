<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🪁 风筝飞行</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>🪁 风筝飞行</h1><canvas id="cv"></canvas>
<div class="info">高度 <b id="sc">0</b> · 星星 +10</div>
<div class="hint">按住让风筝上升，松开下降 · 收集星星避开云朵</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function size(){W=Math.min(innerWidth-24,420);H=Math.floor(W*1.25);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
let over=false,score=0,hold=false,kite={x:0,y:0,vy:0},clouds=[],stars=[],tick=0;
function init(){over=false;score=0;hold=false;kite={x:W/2,y:H-100,vy:0};clouds=[];stars=[];tick=0;document.getElementById('sc').textContent='0';document.querySelector('.over').classList.remove('show');loop()}
cv.addEventListener('pointerdown',()=>{hold=true});addEventListener('pointerup',()=>{hold=false});addEventListener('pointercancel',()=>{hold=false});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();hold=true}});addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')hold=false});
function step(){if(over)return;tick++;if(hold)kite.vy-=1.2;else kite.vy+=.7;kite.vy=Math.max(-8,Math.min(7,kite.vy));kite.y+=kite.vy;kite.y=Math.max(70,Math.min(H-50,kite.y));
if(tick%44===0)clouds.push({x:W+40,y:30+Math.random()*(H-120),w:70+Math.random()*60,v:1.2+Math.random()*1.4});
if(tick%120===0)stars.push({x:W+30,y:40+Math.random()*(H-140),v:2.5});
for(const c of clouds){c.x-=c.v;if(Math.hypot(kite.x-c.x,kite.y-c.y)<48){end('风筝被云打落！飞了 '+Math.floor(score));return}}
clouds=clouds.filter(c=>c.x>-100);
for(const s of stars){s.x-=s.v;if(Math.hypot(kite.x-s.x,kite.y-s.y)<26){score+=10;document.getElementById('sc').textContent=Math.floor(score);s.dead=true}}
stars=stars.filter(s=>!s.dead&&s.x>-20);score+=.07;document.getElementById('sc').textContent=Math.floor(score);
draw();requestAnimationFrame(step)}
function end(m){over=true;msg.textContent=m;document.querySelector('.over').classList.add('show')}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#131a24';ctx.fillRect(0,0,W,H);
for(const c of clouds){ctx.fillStyle='rgba(120,140,180,.28)';ctx.beginPath();ctx.arc(c.x,c.y,20,0,7);ctx.arc(c.x+28,c.y-4,24,0,7);ctx.arc(c.x+52,c.y+4,18,0,7);ctx.fill()}
for(const s of stars){ctx.fillStyle='#ffc93c';ctx.beginPath();ctx.arc(s.x,s.y,8,0,7);ctx.fill()}
const x=kite.x,y=kite.y;ctx.strokeStyle='#c9a05a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y+30);ctx.lineTo(W/2,H+10);ctx.stroke();
ctx.fillStyle='#d64545';ctx.beginPath();ctx.moveTo(x,y-26);ctx.lineTo(x+22,y);ctx.lineTo(x,y+26);ctx.lineTo(x-22,y);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffd9c8';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#e8dcd5';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();
ctx.fillStyle='#ffd9c8';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText('高度 '+Math.floor(score),12,24)}
function restart(){init()}
let running=false;function loop(){if(running)return;running=true;step()}
init();

</script></body></html>
