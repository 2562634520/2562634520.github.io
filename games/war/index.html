<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>⚔️ 纸牌战争</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>⚔️ 纸牌战争</h1><div class="score">胜 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=360*dpr;cv.height=360*dpr;cv.style.width=Math.min(360,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let deck,p1Deck,p2Deck,p1Card,p2Card,score,alive,lock;
function rset(){deck=[];for(let r=0;r<4;r++)for(let n=2;n<=14;n++)deck.push({r,n});for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
p1Deck=deck.slice(0,26);p2Deck=deck.slice(26);p1Card=null;p2Card=null;score=0;alive=true;lock=false;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,360,360);drawCard(80,140,p1Card,'#b02a2a');drawCard(220,140,p2Card,'#5a8faf');ctx.fillStyle='#ffd9c8';ctx.font='13px sans-serif';ctx.fillText('我方 剩余 '+p1Deck.length,20,30);ctx.fillText('电脑 剩余 '+p2Deck.length,200,30);ctx.fillText('点击翻牌',130,300);raf=requestAnimationFrame(loop)}
function drawCard(x,y,c,border){ctx.fillStyle=border;ctx.fillRect(x,y,60,90);ctx.fillStyle='#171215';ctx.fillRect(x+4,y+4,52,82);ctx.fillStyle='#ffd9c8';ctx.font='bold 22px sans-serif';if(c){ctx.fillText(c.n===14?'A':c.n===13?'K':c.n===12?'Q':c.n===11?'J':c.n, x+22, y+50);ctx.fillStyle=['#b02a2a','#0c0a0d','#d9a08f','#8b0000'][c.r];ctx.fillText('♥♦♠♣'.split('')[c.r], x+30, y+75)}}
function flip(){if(!alive||lock||!p1Deck.length||!p2Deck.length)return;p1Card=p1Deck.shift();p2Card=p2Deck.shift();lock=true;setTimeout(()=>{const w=[];w.push(p1Card,p2Card);if(p1Card.n>p2Card.n){score++;p1Deck.push(...w)}else if(p2Card.n>p1Card.n){p2Deck.push(...w)}else{score+=0}p1Card=null;p2Card=null;lock=false;document.getElementById('sc').textContent=score;if(!p1Deck.length||!p2Deck.length){{document.getElementById('msg').textContent='胜 '+score;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),score);localStorage.setItem('warBest',Math.max(parseInt(localStorage.getItem('warBest')||0),score));document.querySelector('.over').classList.add('show');alive=false};return}},600)}
function restart(){rset()}
cv.addEventListener('pointerdown',flip);
rset();
</script></body></html>
