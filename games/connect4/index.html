<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🔴 四子棋</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
h1{font-size:19px;letter-spacing:.16em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}.score b{color:#ffd9c8}
canvas{background:#0c0a0d;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px}.panel b{font-size:24px;color:#ffd9c8}
.btn{display:block;margin:16px auto 0;padding:10px 30px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}</style></head><body>
<div class="wrap"><h1>🔴 四子棋</h1><div class="score">本局 <b id="sc">0</b></div><canvas id="cv"></canvas><div class="hint">点击/触屏操作</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);cv.width=420*dpr;cv.height=360*dpr;cv.style.width=Math.min(420,innerWidth-24)+'px';cv.style.height='auto';ctx.setTransform(dpr,0,0,dpr,0,0);
let board,turn,score,alive,raf;
function rset(){board=Array(6).fill(0).map(()=>Array(7).fill(0));turn=1;score=0;alive=true;document.getElementById('sc').textContent=0;document.querySelector('.over').classList.remove('show');cancelAnimationFrame(raf);requestAnimationFrame(loop)}
function drop(c){if(!alive)return;for(let r=5;r>=0;r--)if(board[r][c]===0){board[r][c]=turn;if(check(r,c,turn)){score=1;{document.getElementById('msg').textContent='Win '+1;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),1);localStorage.setItem('connect4Best',Math.max(parseInt(localStorage.getItem('connect4Best')||0),1));document.querySelector('.over').classList.add('show');alive=false};return}turn=3-turn;ai();return}}
function check(r,c,t){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc){let n=1;for(let k=1;k<4;k++){const nr=r+dr*k,nc=c+dc*k;if(nr<0||nr>5||nc<0||nc>6||board[nr][nc]!==t)break;n++}for(let k=1;k<4;k++){const nr=r-dr*k,nc=c-dc*k;if(nr<0||nr>5||nc<0||nc>6||board[nr][nc]!==t)break;n++}if(n>=4)return true}return false}
function ai(){const c=Math.floor(Math.random()*7);for(let r=5;r>=0;r--)if(board[r][c]===0){board[r][c]=2;if(check(r,c,2)){alive=false;{document.getElementById('msg').textContent='Lose '+0;document.getElementById('bs').textContent=Math.max(parseInt(document.getElementById('bs').textContent||0),0);localStorage.setItem('connect4Best',Math.max(parseInt(localStorage.getItem('connect4Best')||0),0));document.querySelector('.over').classList.add('show');alive=false};return}turn=3-turn;return}}
function loop(){ctx.fillStyle='#0c0a0d';ctx.fillRect(0,0,420,360);for(let r=0;r<6;r++)for(let c=0;c<7;c++){const x=10+c*55,y=40+r*50;ctx.fillStyle=board[r][c]===1?'#b02a2a':board[r][c]===2?'#ffd9c8':'#171215';ctx.beginPath();ctx.arc(x+25,y+22,20,0,7);ctx.fill()}raf=requestAnimationFrame(loop)}
function restart(){rset()}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(420/r.width);drop(Math.floor(x/55))});
rset();
</script></body></html>
