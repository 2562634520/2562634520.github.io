<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>跳棋</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,'PingFang SC',sans-serif;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#ffd9c8;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{font-size:19px;margin:10px 0 4px;letter-spacing:2px}
.hint{font-size:12px;opacity:.7;margin-bottom:6px}
canvas{background:#171421;border:1px solid #5a2424;border-radius:12px;max-width:96vw;max-height:70vh;touch-action:none}
.bar{font-size:13px;margin:8px 0}
.over{position:fixed;inset:0;background:rgba(10,6,8,.86);display:none;align-items:center;justify-content:center;z-index:9}
.over.show{display:flex}
.panel{text-align:center;padding:26px 38px;background:#1a0f12;border:1px solid #b02a2a;border-radius:16px}
.panel h2{font-size:24px;color:#ff6b6b;margin-bottom:8px}
.panel p{font-size:14px;margin-bottom:16px}
.btn{display:inline-block;padding:10px 28px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;border:none;border-radius:999px;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.96)}
</style></head><body>
<h1>🔴 跳棋</h1><div class="hint">红方先走 · 斜走一格，跳吃对方 · 有吃必吃</div>
<canvas id="c" width="368" height="368"></canvas>
<div class="bar"><b id="turn">红方走棋</b> · 到对方底线变王</div>
<div class="over" id="over"><div class="panel"><h2 id="t"></h2><p id="s"></p><button class="btn" onclick="again()">再来一局</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),N=8,S=46;
let board=[],turn=0,sel=null,jumps=[],run=true;
function empty(){let b=[];for(let i=0;i<N;i++)b.push(Array(N).fill(0));
for(let r=0;r<3;r++)for(let c=(r+1)%2;c<N;c+=2)b[r][c]={s:1,k:0};
for(let r=5;r<8;r++)for(let c=(r+1)%2;c<N;c+=2)b[r][c]={s:0,k:0};return b}
function inb(r,c){return r>=0&&r<8&&c>=0&&c<8}
function moves(r,c){let p=board[r][c],out=[],cap=[],dirs=p.k?[[-1,-1],[-1,1],[1,-1],[1,1]]:[[p.s?-1:-1,1],[p.s?-1:1,-1]].map(d=>[p.s?d[0]:-d[0],d[1]]);
if(p.s===0)dirs=[[-1,-1],[-1,1]];if(p.s===1)dirs=[[1,-1],[1,1]];if(p.k)dirs=[[-1,-1],[-1,1],[1,-1],[1,1]];
for(let d of dirs){let rr=r+d[0],cc=c+d[1];
if(inb(rr,cc)&&!board[rr][cc])out.push([rr,cc]);
let r2=rr+d[0],c2=cc+d[1];
if(inb(r2,c2)&&board[rr][cc]&&board[rr][cc].s!==p.s&&!board[r2][c2])cap.push([r2,c2])}
return cap.length?{moves:cap,must:true}:{moves:out,must:false}}
function anyCap(s){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c]&&board[r][c].s===s&&moves(r,c).must)return true;return false}
function click(e){if(!run)return;let r=Math.floor((e.clientY-cv.getBoundingClientRect().top)/S),c=Math.floor((e.clientX-cv.getBoundingClientRect().left)/S);
if(!inb(r,c))return;
if(sel&&jumps.some(m=>m[0]===r&&m[1]===c)){
let mid=[(sel[0]+r)/2,(sel[1]+c)/2];board[mid[0]][mid[1]]=0;board[r][c]=board[sel[0]][sel[1]];board[sel[0]][sel[1]]=0;
if(r===0&&board[r][c].s===0)board[r][c].k=1;if(r===7&&board[r][c].s===1)board[r][c].k=1;
let again=moves(r,c);if(again.must){sel=[r,c];jumps=again.moves;draw();return}
sel=null;jumps=[];turn=1-turn;check();draw();return}
if(board[r][c]&&board[r][c].s===turn){let m=moves(r,c);
if(!m.must&&anyCap(turn)){sel=null;jumps=[];draw();return}
sel=[r,c];jumps=m.moves;draw()}
else{sel=null;jumps=[];draw()}}
function check(){let a=[0,0];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c])a[board[r][c].s]++;
if(!a[1])end('🔴 红方胜利','蓝方棋子全部被吃');if(!a[0])end('🔵 蓝方胜利','红方棋子全部被吃')}
function end(t,s){run=false;show(t,s)}
function draw(){ctx.fillStyle='#171421';ctx.fillRect(0,0,368,368);
for(let r=0;r<N;r++)for(let c=0;c<N;c++){if((r+c)%2){ctx.fillStyle='#3a2020';ctx.fillRect(c*S,r*S,S,S)}}
if(sel){ctx.fillStyle='rgba(255,214,150,.45)';ctx.fillRect(sel[1]*S,sel[0]*S,S,S)}
for(let m of jumps){ctx.fillStyle='#ffd9c8';ctx.beginPath();ctx.arc(m[1]*S+S/2,m[0]*S+S/2,6,0,7);ctx.fill()}
for(let r=0;r<N;r++)for(let c=0;c<N;c++){let p=board[r][c];if(!p)continue;
ctx.beginPath();ctx.arc(c*S+S/2,r*S+S/2,16,0,7);ctx.fillStyle=p.s?'#ff6b6b':'#8fb7ff';ctx.fill();
ctx.strokeStyle='#1a0f12';ctx.lineWidth=2;ctx.stroke();
if(p.k){ctx.fillStyle='#fff';ctx.font='15px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('王',c*S+S/2,r*S+S/2)}}
document.getElementById('turn').textContent=turn?'蓝方走棋':'红方走棋'}
cv.addEventListener('pointerdown',click);
function show(t,s){document.getElementById('t').textContent=t;document.getElementById('s').textContent=s;document.getElementById('over').classList.add('show')}
function again(){document.getElementById('over').classList.remove('show');board=empty();turn=0;sel=null;jumps=[];run=true;draw()}
again();draw();
</script></body></html>
