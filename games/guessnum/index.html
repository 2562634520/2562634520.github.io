<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>猜数字</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.score{font-size:13px;color:#d9a08f}
.range{font-size:22px;color:#ffd9c8;font-weight:700}
.inp{display:flex;gap:8px;width:min(92vw,360px)}
input{flex:1;min-width:0;border:1px solid #b02a2a66;border-radius:12px;background:#171215;color:#ffd9c8;padding:13px;font-size:18px;text-align:center;outline:0}
.go{border:0;border-radius:12px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;padding:0 24px;font-size:15px;font-weight:700;cursor:pointer}
.logs{width:min(92vw,360px);min-height:110px;border:1px solid #33262a;border-radius:12px;background:#171215;padding:10px;font-size:13px;color:#d9a08f;overflow-y:auto}
.logs div{margin:3px 0}
.hint{font-size:11px;color:#8f7f7b}
</style></head><body>
<div class="wrap"><h1>❓ 猜数字</h1><div class="score">猜了 <b id="at">0</b> 次 · 最佳 <span id="best">-</span></div>
<div class="range">范围：1 - 100</div>
<div class="inp"><input id="inp" type="number" min="1" max="100" placeholder="输入你的猜测" autocomplete="off"><button class="go" onclick="guess()">猜</button></div>
<div class="logs" id="logs"></div><div class="hint">我会提示大了还是小了，直到你猜中</div></div>
<script>
let target=0,attempts=0,best=+localStorage.getItem('emeng_guess')||0;
const inp=document.getElementById('inp'),logs=document.getElementById('logs');
document.getElementById('best').textContent=best||'-';
function newGame(){target=1+Math.random()*100|0;attempts=0;logs.innerHTML='';add('🎲 新一局，猜 1-100 之间的数字');document.getElementById('at').textContent=0}
function add(t){const d=document.createElement('div');d.textContent=t;logs.prepend(d)}
function guess(){const v=+inp.value;if(!v||v<1||v>100){add('⚠️ 请输入 1-100 的数字');return}
attempts++;document.getElementById('at').textContent=attempts;
if(v===target){add('🎉 猜中了！用了 '+attempts+' 次');if(!best||attempts<best){best=attempts;localStorage.setItem('emeng_guess',best);document.getElementById('best').textContent=best}setTimeout(newGame,1400)}
else if(v<target)add('📈 小了，再大一点')
else add('📉 大了，再小一点');
inp.value='';inp.focus()}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')guess()});
newGame();
</script></body></html>
