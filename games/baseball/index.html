<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>⚾ 棒球击打</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse at 50% 0%,#221417,#0b090c);color:#e8dcd5;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
h1{font-size:20px;letter-spacing:.18em;color:#ffd9c8}
.info{font-size:13px;color:#d9a08f}
canvas{background:#120e11;border:2px solid #b02a2a66;border-radius:12px;box-shadow:0 0 24px #b02a2a2e;max-width:100%;touch-action:none}
.hint{font-size:11px;color:#8f7f7b}
.over{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,3,5,.82);z-index:9}
.over.show{display:grid}
.panel{text-align:center;background:#171215;border:1px solid #b02a2a55;border-radius:16px;padding:26px 36px;box-shadow:0 0 40px #b02a2a2e}
.panel b{font-size:26px;color:#ffd9c8}
.btn{display:inline-block;margin:16px 6px 0;padding:10px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#b02a2a,#d64545);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.small{padding:7px 16px;font-size:13px}

</style></head><body>
<div class="wrap"><h1>⚾ 棒球击打</h1><canvas id="cv"></canvas>
<div class="info">得分 <b id="sc">0</b> · 生命 <b id="lv">5</b></div>
<div class="hint">球飞过本垒时点击挥棒 · 连击分数翻倍</div></div>
<div class="over"><div class="panel"><b id="msg">游戏结束</b><button class="btn" onclick="restart()">再来一局</button></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function size(){W=Math.min(innerWidth-24,440);H=Math.floor(W*.72);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W;cv.height=H}
size();addEventListener('resize',()=>{size();draw()});
let over=false,score=0,lives=5,ball={x:0,y:0,vx:0,vy:0,active:false},swing=false,swingT=0,pitchT=0,combo=0;
function init(){over=false;score=0;lives=5;ball={x:0,y:0,vx:0,vy:0,active:false};swing=false;swingT=0;pitchT=80;combo=0;document.getElementById('sc').textContent='0';document.getElementById('lv').textContent='5';document.querySelector('.over').classList.remove('show');loop()}
function pitch(){ball={x:W+20,y:80+Math.random()*80,vx:-(7+Math.random()*3),vy:(Math.random()-.5)*1.5,active:true}}
cv.addEventListener('pointerdown',()=>{if(over)return;swing=true;swingT=14});
function step(){if(over)return;pitchT--;if(pitchT<=0&&!ball.active){pitch();pitchT=90+Math.random()*40}
if(ball.active){ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=.04;if(ball.x<-30){lives--;document.getElementById('lv').textContent=lives;ball.active=false;combo=0;if(lives<=0){over=true;msg.textContent='漏球太多！得分 '+score;document.querySelector('.over').classList.add('show')}}}
if(swingT>0){swingT--;if(swingT===6&&ball.active&&Math.abs(ball.x-W/2)<42&&Math.abs(ball.y-H*.55)<60){const d=Math.hypot(ball.vx,ball.vy);ball.vx=-ball.vx*1.25+2;ball.vy=-ball.vy*1.1-3;combo++;score+=10*Math.min(combo,3);document.getElementById('sc').textContent=score;swing=false;ball.active=true}}else if(swing){swing=false}
draw();requestAnimationFrame(step)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#131a10';ctx.fillRect(0,0,W,H);ctx.fillStyle='#2a4a2a';ctx.fillRect(0,H-60,W,60);ctx.fillStyle='#8a5a3a';ctx.fillRect(W/2-6,H-120,12,60);
ctx.strokeStyle='#c9a05a';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();if(swingT>0){ctx.moveTo(W/2-40,H-70);ctx.lineTo(W/2+40,H-130)}else{ctx.moveTo(W/2-35,H-90);ctx.lineTo(W/2+35,H-130)}ctx.stroke();
if(ball.active){ctx.fillStyle='#e8dcd5';ctx.beginPath();ctx.arc(ball.x,ball.y,9,0,7);ctx.fill();ctx.strokeStyle='#b02a2a';ctx.lineWidth=2;ctx.stroke()}
ctx.fillStyle='#ffd9c8';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText('得分 '+score,12,24);ctx.textAlign='right';ctx.fillText('生命 '+lives,W-12,24)}
function restart(){init()}
let running=false;function loop(){if(running)return;running=true;step()}
init();

</script></body></html>
